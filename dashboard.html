<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM AUDIT MALRA | Arsitektur S.Kom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f7fa; color: #000; margin: 0; }
        .sidebar { background: #000a1f; border-right: 4px solid #3b82f6; width: 270px; height: 100vh; position: fixed; z-index: 100; }
        .row-case { background: white; border-bottom: 1px solid #e2e8f0; transition: 0.2s; cursor: pointer; border-left: 6px solid transparent; }
        .row-case:hover { background: #fdfdfd; border-left-color: #3b82f6; transform: scale(1.002); }
        .expanded-detail { display: none; background: #fcfdfe; padding: 25px; border-bottom: 4px solid #cbd5e1; }
        
        /* OVERHAUL MODAL VIEW UNTUK DOKUMEN BANYAK HALAMAN */
        #modalViewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 50px; overflow-y: auto; scroll-behavior: smooth; }
        .canvas-container { display: flex; flex-direction: column; gap: 30px; align-items: center; width: 100%; max-width: 900px; padding-bottom: 100px; }
        
        img.hd-img { width: 100%; max-width: 800px; border: 12px solid white; border-radius: 8px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); object-fit: contain; }
        .txt-bolt-pekat { color: #000000 !important; font-weight: 900 !important; text-transform: uppercase; line-height: 1; }
        .tab-btn { background: white; border: 1.5px solid #cbd5e1; font-weight: 800; padding: 8px 18px; border-radius: 99px; font-size: 10px; transition: 0.3s; white-space: nowrap; }
        .tab-btn.aktif { background: #0ea5e9 !important; color: white !important; border-color: #0ea5e9; }
        
        /* INDIKATOR HALAMAN AUDIT */
        .page-tag { background: #2563eb; color: white; padding: 5px 20px; border-radius: 99px; font-size: 10px; font-weight: 900; margin-bottom: -20px; z-index: 10; position: relative; }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- LOGIN WALL PROTECTED - TETAP AMAN -->
    <div id="pintuAkses" style="position:fixed; inset:0; background:#000a1f; z-index:9999999; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; padding:40px; border-radius:3rem; width:380px; text-align:center; border-bottom:12px solid #3b82f6;">
            <img src="./logo_malra.png" style="height:90px; margin:0 auto 20px;">
            <h2 class="txt-bolt-pekat text-lg mb-8 italic">VERIFIKASI COMMANDER MALRA</h2>
            <input type="text" id="userInput" placeholder="USER ID" style="width:100%; padding:18px; border:2px solid #e2e8f0; border-radius:1rem; margin-bottom:12px; text-align:center; font-weight:900;">
            <input type="password" id="passInput" placeholder="KODE AUTH" style="width:100%; padding:18px; border:2px solid #e2e8f0; border-radius:1rem; margin-bottom:25px; text-align:center; font-weight:900; letter-spacing:4px;">
            <button id="btnLogin" style="width:100%; background:#2563eb; color:white; font-weight:900; padding:22px; border-radius:1.5rem; font-size:12px; text-transform:uppercase; cursor:pointer;">ACTIVATE ENGINE</button>
        </div>
    </div>

    <div id="modalViewer">
        <div id="canvasCore" class="canvas-container"></div>
        <button onclick="document.getElementById('modalViewer').style.display='none'" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background:#ef4444; color:white; width:300px; padding:22px; border-radius:2rem; font-weight:900; font-size:14px; cursor:pointer; box-shadow:0 10px 40px rgba(239, 68, 68, 0.4); z-index: 1000000;">KEMBALI KE PANEL AUDIT</button>
    </div>

    <aside class="sidebar p-6 flex flex-col italic font-black uppercase text-white">
        <div class="border-b border-slate-700 pb-8 mb-6 text-center">
            <img src="./logo_malra.png" class="h-28 mx-auto mb-3">
            <h1 class="text-lg">SiAPP <span class="text-blue-500">MAS</span></h1>
            <p class="text-[7px] tracking-[0.2em] opacity-40 italic">Command Gateway</p>
        </div>
        <div class="flex-1 overflow-y-auto" id="areaListKec"></div>
        <div class="mt-auto border-t-2 border-slate-700 pt-6 font-sans">
            <p class="text-[8px] text-blue-500 font-black mb-2">ACCESS BY AUDITOR:</p>
            <p class="text-sm font-black italic text-white uppercase leading-none">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[8px] opacity-30 mt-1 uppercase italic font-bold">Auditor Ahli Pratama @ 2026</p>
            <button onclick="location.reload()" class="w-full mt-6 bg-slate-900 border border-slate-700 py-3 rounded-2xl text-[8.5px] hover:bg-red-700 transition-all font-black text-red-500 hover:text-white uppercase italic shadow-lg">End Command</button>
        </div>
    </aside>

    <main class="flex-1 ml-[270px] p-6 uppercase font-black italic tracking-tighter">
        <header class="flex justify-between items-end border-b-4 border-slate-900 pb-8 mb-8">
            <div>
                <p id="tglReal" class="text-blue-600 text-[10px] mb-1 font-bold font-sans tracking-widest"></p>
                <h2 class="text-2xl text-slate-800 uppercase font-black">Gateway Laporan Masyarakat</h2>
            </div>
            
            <div class="flex gap-2">
                <div class="bg-black text-white px-5 py-2.5 rounded-xl text-[9px] shadow-lg">TOTAL DATA: <span id="ui_tot_stats">0</span></div>
                <div class="bg-red-600 text-white px-5 py-2.5 rounded-xl text-[9px] shadow-lg">ADUAN BARU: <span id="ui_act_stats">0</span></div>
            </div>
        </header>
        
        <div style="position: relative; width: 230px; margin-bottom: 20px;">
            <i class="fas fa-search" style="position: absolute; left: 15px; top: 12px; color: #2563eb; font-size: 10px;"></i>
            <input type="text" id="srchEngine" placeholder="CARI TICKET ID..." style="width: 100%; background: #ffffff; border: 2px solid #000000; padding: 10px 10px 10px 40px; border-radius: 1.5rem; font-size: 10px; font-weight: 900; font-style: italic; outline: none; box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);">
        </div>
        
        <div class="flex gap-2 mb-8 overflow-x-auto pb-4">
            <button onclick="filt('ALL')" class="tab-btn aktif">SEMUA DATA</button>
            <button onclick="filt('Dana Desa')" class="tab-btn">DANA DESA</button>
            <button onclick="filt('Dana BOS')" class="tab-btn">DANA BOS-BOP</button>
            <button onclick="filt('BOK Puskesmas')" class="tab-btn">DANA BOK</button>
            <button onclick="filt('PBJ')" class="tab-btn">PBJ DINAS</button>
            <button onclick="filt('Penyalahgunaan Jabatan/Wewenang')" class="tab-btn bg-red-50">PENYALAHGUNAAN WEWENANG</button>
            <button onclick="filt('Korupsi, Kolusi, dan Nepotisme (KKN)')" class="tab-btn bg-red-50 text-red-600">KKN</button>
            <button onclick="filt('Pelanggaran Administratif')" class="tab-btn bg-blue-50">PELANGGARAN ADMIN</button>
            <button onclick="filt('Pelanggaran Disiplin Pegawai')" class="tab-btn bg-blue-50">DISIPLIN PEGAWAI</button>
        </div>

        <div id="dataGrid" class="divide-y-2 bg-white border-2 border-slate-900 rounded-[3rem] overflow-hidden shadow-2xl">
             <div class="p-20 text-center opacity-10 uppercase italic">Tengah Menghubungkan Arsitektur Malra...</div>
        </div>

        <p class="text-center text-[7.5px] mt-16 italic opacity-10 font-bold uppercase tracking-[0.4em]">Integrated Secure Interface • Architecture BY FIRDAUS S.KOM © 2026</p>
    </main>

    <audio id="alrtSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const cf = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(cf); const db = getFirestore(app);

        document.getElementById('btnLogin').onclick = () => {
            const u = document.getElementById('userInput').value, p = document.getElementById('passInput').value;
            if(u === 'itkabmalra1' && p === 'itkabmalra01') {
                document.getElementById('pintuAkses').style.display='none'; 
                startMatrix(); 
            } else { alert("IDENTITAS AUDITOR DITOLAK!"); }
        };

        function startMatrix() {
            let lastL = -1;
            onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
                const gr = document.getElementById('dataGrid'); const ml = document.getElementById('areaListKec');
                gr.innerHTML = ""; ml.innerHTML = "";
                let kM = {}; let actv = 0;
                
                let realSize = snap.size;
                if(lastL !== -1 && realSize > lastL) document.getElementById('alrtSound').play();
                lastL = realSize;

                snap.forEach(shot => {
                    const d = shot.data(); const cid = shot.id; kM[d.kec]=(kM[d.kec]||0)+1; 
                    if(d.status === "DILIHAT") actv++;
                    
                    const urgent = (d.kat === "Dana Desa" || d.kat === "PBJ" || d.kat.includes("Korupsi") || d.kat.includes("Jabatan"));

                    gr.innerHTML += `
                    <div class="row-target" data-k="${d.kat}">
                        <div class="row-case grid grid-cols-12 gap-5 p-8 py-4 items-center ${urgent?'bg-red-50':''}" onclick="togD('${cid}')">
                            <div class="col-span-1" onclick="event.stopPropagation(); see('${d.face}')"><img src="${d.face}" class="w-14 h-14 rounded-2xl shadow-xl border-2 border-white object-cover hover:scale-110"></div>
                            <div class="col-span-2 border-l pl-4 leading-none"><p class="text-[8px] text-blue-500 mb-1 font-black"># ${d.ticket_id}</p><h4 class="text-[9.5px] font-black">${d.kat.toUpperCase()}</h4></div>
                            <div class="col-span-7 flex flex-col justify-center px-10 border-x">
                                 <h5 class="txt-bolt-pekat text-[24px] mb-1 truncate tracking-tighter italic">${d.pelapor_nama}</h5>
                                 <p class="text-xs italic opacity-100 font-bold text-black">MOB: ${d.wa} <span class="mx-3 opacity-20">|</span> WILAYAH: ${d.kec.toUpperCase()} / OHOI ${d.vill.toUpperCase()}</p>
                            </div>
                            <div class="col-span-2 text-right">
                                <span style="background:${d.status==='SELESAI'?'#10b981':'#ef4444'};" class="inline-block py-2 px-6 rounded-2xl text-white font-black text-[9px] uppercase shadow-md">${d.status}</span>
                            </div>
                        </div>

                        <div id="ex_${cid}" class="expanded-detail font-black uppercase italic">
                            <div class="grid grid-cols-12 gap-8 items-start">
                                <div class="col-span-3 text-center space-y-4">
                                    <img src="${d.face}" class="rounded-[2.5rem] border-4 border-white shadow-2xl transition-all cursor-zoom-in" onclick="event.stopPropagation(); see('${d.face}')">
                                    <button onclick="event.stopPropagation(); see('${d.doc_archive}')" style="background:#000; color:#3b82f6;" class="w-full p-6 rounded-full text-[10px] shadow-xl font-black active:translate-y-2 uppercase">DATA INVESTIGASI <i class="fas fa-search-plus"></i></button>
                                </div>
                                <div class="col-span-6 bg-white p-8 rounded-[3.5rem] shadow-xl border-t-8 border-l-8 border-slate-50 text-center relative overflow-hidden">
                                    <p class="txt-bolt-pekat text-[11px] text-blue-600 mb-6 block underline">INSTRUKSI KANTOR INSPEKTORAT :</p>
                                    <textarea id="msg_${cid}" onclick="event.stopPropagation()" class="w-full h-32 bg-slate-50 border-2 border-dashed rounded-3xl p-6 text-2xl font-black italic outline-none shadow-inner">${d.note || ""}</textarea>
                                    <button onclick="event.stopPropagation(); saveM('${cid}')" style="background:#10b981;" class="w-full mt-6 text-white py-5 rounded-[2rem] font-black text-sm uppercase italic animate-pulse shadow-lg">SINKRONKAN PESAN KEU WARGA ✅</button>
                                </div>
                                <div class="col-span-3 flex flex-col gap-4 pt-10">
                                    <button onclick="event.stopPropagation(); upP('${cid}','DIVERIFIKASI')" class="w-full py-4 rounded-[1.5rem] font-black text-xs bg-slate-50 border border-blue-200 text-blue-700 uppercase">SET VERIFIED</button>
                                    <button onclick="event.stopPropagation(); upP('${cid}','DIPROSES')" class="w-full py-4 rounded-[1.5rem] font-black text-xs bg-slate-50 border border-orange-200 text-orange-700 uppercase">SET PROCESS</button>
                                    <button onclick="event.stopPropagation(); upP('${cid}','SELESAI')" class="w-full bg-slate-900 text-emerald-400 py-6 mt-12 rounded-[4rem] text-[13px] uppercase shadow-2xl font-black">MARK AS DONE ✅</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                
                Object.keys(kM).sort().forEach(k => ml.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:rgba(255,255,255,0.05); margin-bottom:5px; border-radius:1rem;" class="transition-all hover:bg-blue-600 font-bold uppercase"><span style="color:white; font-size:10.5px;">${k}</span><span style="background:#2563eb; color:white; padding:1px 12px; border-radius:15px; font-size:8px;">${kM[k]} DATA</span></div>`);
                
                document.getElementById('ui_tot_stats').innerText = realSize; 
                document.getElementById('ui_act_stats').innerText = actv;
            });
        }

        // --- SUNTIKAN KHUSUS ENGINE SCANNER MULTI-PAGE S.KOM ---
        window.see = (url) => {
            if(!url || url === "" || url === "undefined") return alert("Berkas bukti belum tersedia.");
            const canv = document.getElementById('canvasCore'); 
            canv.innerHTML = ""; 
            
            // LOGIKA PEMISAH (SPLIT ENGINE): Mendeteksi pemisah | yang kita buat di index.html
            const multiPage = url.split("|");

            if(url.toLowerCase().includes(".pdf")) {
                canv.innerHTML = `<embed src="${url}" type="application/pdf" width="90%" height="800px" style="border-radius:15px; border:10px solid white;" />`;
            } else {
                // Tampilkan semua halaman laporan secara berurutan ke bawah
                multiPage.forEach((pageUrl, index) => {
                    if(pageUrl.trim() !== "") {
                        canv.innerHTML += `
                            <span class="page-tag uppercase">HALAMAN : ${index + 1}</span>
                            <img src="${pageUrl}" class="hd-img shadow-2xl mb-10">
                        `;
                    }
                });
            }
            
            document.getElementById('modalViewer').style.display='flex';
            document.getElementById('modalViewer').scrollTop = 0; // Balik ke halaman 1
        };

        window.togD = (i) => { const el = document.getElementById('ex_'+i); el.style.display = el.style.display === 'block' ? 'none' : 'block'; };
        window.upP = async(i,s) => { if(confirm("OTORISASI STATUS BARU?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        window.saveM = async(i) => { const m = document.getElementById('msg_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("TERKIRIM!"); };
        
        window.filt = (k) => {
            document.querySelectorAll('.tab-btn').forEach(b => { 
                if(b.getAttribute('onclick').includes("'"+k+"'")) b.classList.add('aktif'); 
                else b.classList.remove('aktif'); 
            });
            document.querySelectorAll('.row-target').forEach(e => e.style.display = (k==='ALL' || e.getAttribute('data-k')===k)?'block':'none');
        };

        const tD = new Date(); document.getElementById('tglReal').innerText = tD.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • PUSAT HUB INVESTIGASI";
        document.getElementById('srchEngine').oninput = (e) => {
            const filter = e.target.value.toUpperCase();
            const rows = document.querySelectorAll('.row-target');
            rows.forEach(row => { row.style.display = row.innerText.toUpperCase().includes(filter) ? "block" : "none"; });
        };
        
    </script>
</body>
</html>
