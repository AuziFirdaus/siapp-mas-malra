<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL COMMAND | Auditor Firdaus S.Kom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; }
        .sidebar { background: #0f172a; box-shadow: 10px 0 30px rgba(0,0,0,0.1); }
        .report-row { background: white; border-bottom: 1.5px solid #f1f5f9; transition: all 0.2s; cursor: pointer; }
        .report-row:hover { background: #f8faff; border-left: 8px solid #3b82f6; }
        .expand-panel { display: none; background: #fdfdfd; padding: 25px; border-bottom: 2px solid #e2e8f0; }
        .status-pill { padding: 4px 10px; border-radius: 99px; font-size: 8px; font-weight: 800; }
        .mini-stat { background: white; padding: 6px 14px; border-radius: 12px; border: 1.2px solid #e2e8f0; font-weight: 800; font-size: 10px; display: flex; align-items: center; gap: 8px; }
        textarea.note-area { background: #f1f5f9; border-radius: 12px; font-size: 11px; font-weight: 600; padding: 12px; width: 100%; border: 2px dashed #cbd5e1; outline: none; }
        textarea.note-area:focus { border-color: #3b82f6; background: white; }
        #modalViewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="modalViewer" onclick="this.style.display='none'">
        <div class="text-center w-full flex flex-col items-center justify-center p-4">
             <img id="imgBig" src="" class="max-h-[85vh] rounded-2xl shadow-2xl border-4 border-white mb-6">
             <button class="bg-white text-slate-900 px-10 py-3 rounded-full font-black text-[10px] uppercase">KEMBALI KE PANEL</button>
        </div>
    </div>

    <!-- SIDEBAR STAY -->
    <aside class="sidebar w-64 fixed h-full flex flex-col p-6 text-white hidden lg:flex italic uppercase">
        <div class="flex items-center gap-3 mb-8 border-b border-slate-800 pb-8">
            <img src="./logo_malra.png" alt="MALRA" class="h-10 w-auto">
            <div><p class="font-black text-sm uppercase">SiAPP <span class="text-blue-500">MAS</span></p>
            <p class="text-[6px] opacity-40 uppercase italic tracking-widest mt-1">COMMAND CENTER MALRA</p></div>
        </div>
        <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
             <div id="areaMapping" class="space-y-1"></div>
        </div>
        <div class="mt-auto pt-6 border-t border-slate-800 lowercase">
            <p class="text-[8px] text-blue-400 font-bold mb-3 uppercase tracking-widest italic font-sans">ACCESS GRANTED BY :</p>
            <p class="font-black text-[11px] uppercase italic text-blue-50 leading-tight">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[7px] opacity-40 font-black tracking-tight mt-1 uppercase">AUDIT PRATAMA MALRA @ 2026</p>
            <button onclick="location.href='index.html'" class="w-full mt-10 bg-red-950/20 border border-red-900 text-red-500 py-3 rounded-xl text-[9px] font-black uppercase transition-all shadow-xl hover:bg-red-600 hover:text-white">TERMINATE SESSION</button>
        </div>
    </aside>

    <main class="flex-1 lg:ml-64 p-5 lg:p-8">
        <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-12 border-b border-slate-100 pb-10">
            <div>
                <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-[0.2em]" id="realTimeCal"></p>
                <div class="flex items-center gap-4">
                    <h2 class="text-2xl font-black text-slate-800 tracking-tighter uppercase italic">MEJA KERJA KENDALI</h2>
                    <div class="flex gap-2">
                        <div class="mini-stat border-blue-50 text-blue-700 italic"><i class="fas fa-file-invoice"></i> <span id="totCnt">0</span> LAPS</div>
                    </div>
                </div>
            </div>
            <div class="relative w-full lg:w-72">
                <i class="fas fa-id-fingerprint absolute left-4 top-3.5 text-blue-400"></i>
                <input type="text" id="srch" placeholder="CARI CASE BY TIKET/NAMA..." class="w-full bg-slate-50 border border-slate-200 p-3.5 pl-10 rounded-2xl text-[9px] font-black italic shadow-inner outline-none">
            </div>
        </header>

        <div id="mainBoard" class="space-y-4">
             <div class="p-40 text-center italic opacity-20 text-sm">Menunggu Signal Audit Maluku Tenggara...</div>
        </div>

        <p class="text-center text-[8px] mt-24 italic opacity-10 font-bold tracking-[0.5em] uppercase">Security Level : S-DKC.26 MALRA HUB</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const cf = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(cf); const db = getFirestore(app);

        // DATA LIVE HANDLER VERSION S-DKC
        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
            const feed = document.getElementById('mainBoard'); const mapping = document.getElementById('areaMapping');
            feed.innerHTML = ""; mapping.innerHTML = "";
            let t = snap.size, pD = {};

            snap.forEach(laporan => {
                const d = laporan.data(); const cid = laporan.id;
                pD[d.kec] = (pD[d.kec] || 0) + 1;
                const isPriority = (d.kat === "Dana Desa" || d.kat === "PBJ");
                
                feed.innerHTML += `
                <div>
                    <div class="report-row border-[2.5px] rounded-[2.5rem] border-white shadow-2xl p-6 px-10 mb-2 flex items-center gap-10 ${isPriority?'border-red-100':''}" onclick="masterTog('${cid}')">
                         <div class="w-16 h-16"><img src="${d.face}" class="rounded-2xl border-4 border-white shadow-xl h-full w-full object-cover"></div>
                         <div class="flex-1">
                             <p class="text-[7.5px] text-blue-500 italic tracking-widest font-black uppercase mb-1">tiket id: ${d.ticket_id}</p>
                             <h4 class="text-xl font-black italic tracking-tighter uppercase leading-none">${d.kat}</h4>
                         </div>
                         <div class="w-1/4">
                             <h5 class="text-xl font-black italic text-slate-800 leading-tight truncate">${d.pelapor_nama.toUpperCase()}</h5>
                             <p class="text-[10px] text-emerald-600 font-bold mt-1">WA: ${d.wa}</p>
                         </div>
                         <div class="w-1/5 border-l-2 border-slate-100 pl-6 text-slate-900 italic font-black">
                             <h5 class="text-xs uppercase">${d.kec}</h5>
                             <p class="text-[10px] opacity-30 tracking-tight"><i class="fas fa-location-dot"></i> OHOI ${d.vill}</p>
                         </div>
                         <div class="w-20 text-center"><i class="far fa-circle text-slate-300"></i></div>
                         <div class="w-24 text-right">
                             <span class="status-pill inline-block border-[1.5px] border-slate-300 italic tracking-widest uppercase font-black">${d.status}</span>
                         </div>
                         <i class="fas fa-chevron-right opacity-10 ml-5"></i>
                    </div>

                    <div id="panel_${cid}" class="expand-panel rounded-[2rem] mx-4 border-[5px] border-white shadow-inner bg-slate-50 mb-10 mt-[-10px]">
                         <div class="grid lg:grid-cols-12 gap-8 items-start">
                             <div class="col-span-3 flex flex-col gap-6 font-black italic">
                                  <img src="${d.face}" class="rounded-[2rem] border-[6px] border-white shadow-2xl transition-transform hover:scale-105" onclick="event.stopPropagation(); viewMaster('${d.face}')">
                                  <button onclick="event.stopPropagation(); viewMaster('${d.doc_archive}')" class="w-full bg-slate-900 border-b-8 border-slate-950 text-white p-6 rounded-3xl text-[9px] shadow-2xl flex items-center justify-center gap-3">
                                       <i class="fas fa-file-contract text-emerald-400"></i> LIHAT BUKTI DOKUMEN TERTULIS
                                  </button>
                             </div>
                             <div class="col-span-6 bg-white p-8 rounded-[3.5rem] shadow-xl border-t border-l border-white relative">
                                  <div class="absolute -right-2 top-10 bg-blue-600 text-white p-2 rounded-lg text-[7px] italic">SECURE FEED</div>
                                  <p class="text-[9px] text-blue-600 mb-3 uppercase italic underline decoration-blue-100 decoration-4">INPUT TINDAK LANJUT AUDITOR :</p>
                                  <textarea id="nt_${cid}" onclick="event.stopPropagation()" class="note-area h-24 mb-6" placeholder="Ketik Instruksi Investigasi Untuk Warga...">${d.note || ""}</textarea>
                                  <button onclick="event.stopPropagation(); saveNoteMaster('${cid}')" class="w-full bg-emerald-600 border-b-8 border-emerald-900 text-white py-5 rounded-[2.5rem] text-[10px] font-black italic uppercase shadow-xl animate-pulse tracking-widest">SINKRONKAN RESPON DIGITAL ✅</button>
                             </div>
                             <div class="col-span-3 flex flex-col gap-3 pt-5 uppercase italic">
                                  <p class="text-[7.5px] opacity-20 font-black mb-3 px-1">Ubah Progress Case :</p>
                                  <button onclick="event.stopPropagation(); statusMaster('${cid}','DIVERIFIKASI')" class="w-full bg-slate-50 border-2 border-blue-200 py-3 rounded-2xl text-[9.5px] font-black text-blue-700">DIVERIFIKASI</button>
                                  <button onclick="event.stopPropagation(); statusMaster('${cid}','DIPROSES')" class="w-full bg-slate-50 border-2 border-orange-200 py-3 rounded-2xl text-[9.5px] font-black text-orange-700">MULAI AUDIT</button>
                                  <button onclick="event.stopPropagation(); statusMaster('${cid}','SELESAI')" class="w-full bg-emerald-700 text-white py-5 rounded-[2.5rem] text-[10.5px] font-black mt-10 shadow-2xl active:translate-y-4">ARSIP SELESAI ✅</button>
                             </div>
                         </div>
                    </div>
                </div>`;
            });
            Object.keys(pD).sort().forEach(kecName => mapping.innerHTML += `<div class="group flex items-center justify-between p-3.5 hover:bg-slate-800 transition-colors rounded-2xl italic px-5 mb-1"><span class="text-[7.5px] opacity-20">${kecName.toUpperCase()}</span><span class="bg-blue-600 text-[8px] text-white py-0.5 px-3 rounded-lg font-black italic">${pD[kecName]} LAPS</span></div>`);
            document.getElementById('totCnt').innerText = t;
        });

        window.masterTog = (id) => { const el = document.getElementById('panel_'+id); el.style.display = el.style.display === 'block'?'none':'block'; };
        window.statusMaster = async(id, st) => { 
            try { 
                await updateDoc(doc(db,"pengaduan",id),{status:st}); 
                alert("STAGING STATUS DIPERBARUI SECARA AMAN!"); 
            } catch (err) { 
                alert("GAGAL AKSES SERVER DATABASE!"); 
            } 
        };
        window.saveNoteMaster = async(id) => { 
            const msg = document.getElementById('nt_'+id).value; 
            try { 
                await updateDoc(doc(db,"pengaduan",id),{note:msg}); 
                alert("INSTRUKSI AUDIT TERKONEKSI!"); 
            } catch (e) { 
                alert("KONEKSI FAIL!"); 
            } 
        };
        window.viewMaster = (u) => { document.getElementById('imgBig').src=u; document.getElementById('modalViewer').style.display='flex'; };

        document.getElementById('srch').oninput=(e)=>{ const v=e.target.value.toUpperCase(); document.querySelectorAll('.report-row').forEach(row=>{ row.style.display = row.innerText.toUpperCase().includes(v)?'flex':'none'; }); };
        const now = new Date(); document.getElementById('realTimeCal').innerText = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).toUpperCase() + " • KODE AKSES ARSITEKTUR KOMPAK";
    </script>
</body>
</html>
