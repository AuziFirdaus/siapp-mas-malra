<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB KENDALI AUDIT | Firdaus S.Kom 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* REVISI CORE: Pastikan body bisa scroll */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; min-height: 100vh; overflow-y: auto !important; }
        .sidebar-master { background: #000a1f; border-right: 5px solid #3b82f6; width: 300px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 100; }
        .main-view { margin-left: 300px; padding: 40px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .row-case { background: white; border-bottom: 2px solid #e2e8f0; cursor: pointer; transition: 0.2s; border-left: 10px solid transparent; }
        .row-case:hover { background: #fdfdfd; border-left-color: #3b82f6; }
        .p-inspect { display: none; background: #ffffff; padding: 30px; border-bottom: 5px solid #cbd5e1; }
        
        #modalMaster { position: fixed; inset: 0; background: #000; z-index: 1000000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(25px); }
        iframe { width: 92vw; height: 75vh; border-radius: 1.5rem; background: white; border: none; }
        .im-v { max-height: 75vh; border: 8px solid white; border-radius: 20px; box-shadow: 0 40px 100px #000; }
        .font-black-bolt { color: #000 !important; font-weight: 900 !important; text-transform: uppercase; }
        .btn-filt { background: white; border: 2px solid #e2e8f0; color: #64748b; font-size: 10px; font-weight: 900; padding: 10px 25px; border-radius: 99px; }
        .btn-filt.aktif { background: #0ea5e9 !important; color: white !important; border-color: #0ea5e9; }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex">

    <!-- LOGIN WALL (TERSEGEL) -->
    <div id="pintu" style="position:fixed; inset:0; background:#000a1f; z-index:9999999; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; padding:50px; border-radius:3.5rem; width:450px; text-align:center; border-bottom:20px solid #3b82f6;">
            <img src="./logo_malra.png" style="height:100px; margin:0 auto 30px;">
            <h2 class="font-black-bolt text-2xl italic mb-10">AKSES AUDIT TERSEGEL</h2>
            <input type="text" id="u" placeholder="ID AUDITOR" style="width:100%; padding:20px; border:3px solid #e2e8f0; border-radius:1.5rem; margin-bottom:15px; text-align:center; font-weight:900;">
            <input type="password" id="p" placeholder="SECRET CODE" style="width:100%; padding:20px; border:3px solid #e2e8f0; border-radius:1.5rem; margin-bottom:40px; text-align:center; font-weight:900; letter-spacing:8px;">
            <button id="goLogin" style="width:100%; background:#2563eb; color:white; font-weight:900; padding:28px; border-radius:2rem; font-size:16px;">BUKA KENDALI HUB</button>
        </div>
    </div>

    <!-- VIEWER SYSTEM -->
    <div id="modalMaster">
        <div id="matrixViewer" class="flex flex-col items-center w-full" onclick="event.stopPropagation()"></div>
        <button onclick="document.getElementById('modalMaster').style.display='none'" style="background:#ef4444; color:white; width:90%; padding:28px; border-radius:2.5rem; font-weight:900; font-size:22px; margin-top:20px; cursor:pointer;">EXIT : TUTUP DATA FISIK (KELUAR)</button>
    </div>

    <!-- SIDEBAR STAY LOCKED -->
    <aside class="sidebar-master p-8 flex flex-col italic font-black uppercase text-white">
        <div class="border-b-4 border-blue-600 pb-10 mb-8 text-center">
            <img src="./logo_malra.png" class="h-32 mx-auto mb-5 drop-shadow-2xl">
            <h1 class="text-xl leading-none">SiAPP <span class="text-blue-500 italic">MAS</span></h1>
            <p class="text-[7px] tracking-widest mt-2 opacity-40 italic">Command Center Malra</p>
        </div>
        <div class="flex-1 overflow-y-auto" id="listDistMap"></div>
        <div class="mt-auto border-t-2 border-slate-700 pt-10 font-sans lowercase">
            <p class="text-[9px] text-blue-500 font-black mb-3 uppercase italic tracking-widest">ACCESS BY AUDITOR:</p>
            <p class="text-lg font-black uppercase text-white leading-tight">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[8.5px] opacity-40 mt-1 uppercase italic font-bold">Audit Ahli Pratama @ 2026</p>
            <button onclick="location.reload()" class="w-full mt-10 bg-slate-900 border-2 border-red-900 text-red-500 py-3.5 rounded-3xl text-[9px]">TERMINATE</button>
        </div>
    </aside>

    <main class="main-view flex-1 font-black uppercase italic">
        <header class="flex justify-between items-end border-b-4 border-slate-900 pb-8 mb-10">
            <div>
                <p id="cal" class="text-blue-600 text-xs mb-1 font-sans"></p>
                <h2 class="text-3xl text-slate-800">MARKAS KENDALI LAPORAN</h2>
                <div class="flex gap-4 mt-4 font-sans italic tracking-tighter">
                    <div class="bg-black text-white px-5 py-2 rounded-xl text-[10px]">TOT : <span id="r_t">0</span></div>
                    <div class="bg-red-700 text-white px-5 py-2 rounded-xl text-[10px] animate-pulse">ALR : <span id="r_a">0</span></div>
                </div>
            </div>
            <!-- SEARCH ENGINE MINI -->
            <div style="position: relative; width: 230px;">
                <i class="fas fa-search absolute left-4 top-3 text-blue-600"></i>
                <input type="text" id="srch" placeholder="CARI TICKET ID..." style="width:100%; background:white; border:2.5px solid #000; padding:10px 10px 10px 45px; border-radius:1.5rem; font-size:10px;">
            </div>
        </header>

        <div class="flex gap-2 mb-10">
            <button onclick="filtX('ALL')" class="btn-filt aktif">DASHBOARD UTAMA</button>
            <button onclick="filtX('Dana Desa')" class="btn-filt">DANA DESA</button>
            <button onclick="filtX('Dana BOS')" class="btn-filt">DANA BOS</button>
            <button onclick="filtX('BOK Puskesmas')" class="btn-filt">DANA BOK</button>
            <button onclick="filtX('PBJ')" class="btn-filt">PBJ DINAS</button>
        </div>

        <div id="auditFeed" class="divide-y-4 bg-white border-4 border-slate-900 rounded-[3.5rem] overflow-hidden shadow-2xl">
             <div class="p-32 text-center opacity-10 uppercase italic">Contacting Goverment Archives...</div>
        </div>
    </main>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        // LOGIN (VERIFIED S-DKC)
        document.getElementById('goLogin').onclick=()=>{ 
            const user=document.getElementById('u').value, pass=document.getElementById('p').value; 
            if(user==='itkabmalra1' && pass==='itkabmalra01'){ document.getElementById('pintu').style.display='none'; startGate(); } 
            else { alert("ERROR : IDENTITAS SALAH!"); }
        };

        function startGate() {
            let oldL = -1;
            onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
                const feed = document.getElementById('auditFeed'); const dist = document.getElementById('listDistMap');
                feed.innerHTML = ""; dist.innerHTML = ""; let km = {}; let act = 0;
                if(oldL !== -1 && snap.size > oldL) document.getElementById('beep').play();
                oldL = snap.size;

                snap.forEach(it => {
                    const d=it.data(), id=it.id; km[d.kec]=(km[d.kec]||0)+1; if(d.status==="DILIHAT") act++;
                    const urg = (d.kat === "Dana Desa" || d.kat === "PBJ");
                    feed.innerHTML += `
                    <div class="case-box" data-k="${d.kat}">
                        <div class="row-case grid grid-cols-12 gap-8 p-12 py-5 items-center ${urg?'bg-red-50/50':''}" onclick="mExpand('${id}')">
                            <div class="col-span-1" onclick="event.stopPropagation(); masterShow('${id}', '${d.face}', true)"><img src="${d.face}" class="w-20 h-20 rounded-[1.8rem] border-4 border-white shadow-xl object-cover hover:scale-110"></div>
                            <div class="col-span-3 border-l-2 pl-10 leading-none"><p class="text-[9px] text-blue-600 mb-1 italic tracking-widest font-sans"># ${d.ticket_id}</p><h4 class="text-xs font-black uppercase">${d.kat}</h4></div>
                            <div class="col-span-6 px-10 border-x flex flex-col justify-center">
                                 <h5 class="font-black-bolt text-[2rem] leading-none mb-1 truncate tracking-tighter">${d.pelapor_nama}</h5>
                                 <p class="font-black-bolt text-lg text-emerald-700 opacity-60">WA: ${d.wa}</p>
                                 <p class="font-black-bolt text-md text-blue-900 mt-2 font-sans">${d.kec} • ${d.vill}</p>
                            </div>
                            <div class="col-span-2 text-right">
                                <span style="background:${d.status==='SELESAI'?'#10b981':'#ef4444'}; color:white;" class="inline-block py-2 px-8 rounded-full font-black text-[9.5px] uppercase">${d.status}</span>
                            </div>
                        </div>

                        <div id="xp_${id}" class="p-inspect p-12">
                             <div class="grid grid-cols-12 gap-12 font-black italic">
                                <div class="col-span-3 text-center space-y-6">
                                     <img src="${d.face}" class="rounded-[3rem] border-8 border-white shadow-2xl" onclick="event.stopPropagation(); masterShow('${id}', '${d.face}', true)">
                                     <button onclick="event.stopPropagation(); masterShow('${id}', '${d.face}', false)" class="w-full bg-black text-blue-400 p-7 rounded-full shadow-2xl uppercase border-b-8 border-black text-xs font-black">ANALISA SURAT FISIK <i class="fas fa-barcode"></i></button>
                                </div>
                                <div class="col-span-6 bg-white p-12 rounded-[5rem] shadow-2xl border-t-[5px] border-l-[5px] border-slate-50 text-center">
                                     <label class="text-blue-700 mb-6 block underline decoration-4 decoration-blue-100 uppercase tracking-tighter">SINTRONISASI INTRUKSI AUDIT :</label>
                                     <textarea id="not_${id}" onclick="event.stopPropagation()" class="w-full h-40 bg-slate-50 border-4 border-dashed rounded-[3rem] p-10 text-[32px] font-black italic outline-none focus:bg-white">${d.note || ""}</textarea>
                                     <button onclick="event.stopPropagation(); mSave('${id}')" style="background:#10b981;" class="w-full mt-10 text-white py-6 rounded-full font-black shadow-xl uppercase italic">SINKRONKAN RESPON ✅</button>
                                </div>
                                <div class="col-span-3 pt-20 space-y-4">
                                     <button onclick="event.stopPropagation(); mUp('${id}','DIVERIFIKASI')" class="w-full bg-slate-50 border-2 py-4 rounded-[1.5rem] font-black text-blue-600 text-sm">VERIFIKASI ID</button>
                                     <button onclick="event.stopPropagation(); mUp('${id}','DIPROSES')" class="w-full bg-slate-50 border-2 py-4 rounded-[1.5rem] font-black text-orange-800 text-sm">INVESTIGASI AUDIT</button>
                                     <button onclick="event.stopPropagation(); mUp('${id}','SELESAI')" class="w-full bg-slate-900 text-emerald-400 py-8 rounded-[4rem] text-xl font-black mt-16 shadow-2xl active:translate-y-5 italic uppercase">SAHKAN ARSIP ✅</button>
                                </div>
                             </div>
                        </div>
                    </div>`;
                });
                Object.keys(km).sort().forEach(n=> dist.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:15px 25px; background:rgba(255,255,255,0.05); border-radius:2.5rem; margin-bottom:8px;"><span class="text-[12px] font-black text-blue-50">${n}</span><span style="background:#2563eb; color:white; padding:3px 14px; border-radius:50px; font-size:9px; font-weight:900;">${km[n]} RECORDS</span></div>`);
                document.getElementById('r_t').innerText=total; document.getElementById('r_a').innerText=act;
            });
        }

        // PROTOKOL S-DKC ASSEMBLY: PENYAMBUNG PDF/JPG TANPA LAG
        window.masterShow = async(id, th, isFace) => {
            const canv = document.getElementById('matrixViewer'); canv.innerHTML = "<p class='text-white italic uppercase'>Menyambung Fragmentasi Arsitektur S-DKC...</p>"; 
            document.getElementById('modalMaster').style.display='flex';
            if(isFace){ canv.innerHTML = `<img src="${th}" class="im-v">`; } else {
                const qs = await getDocs(query(collection(db, "pengaduan", id, "pieces" || "shards"), orderBy("idx", "asc")));
                let raw = ""; qs.forEach(ck => { raw += (ck.data().raw || ck.data().data); });
                if(raw.includes("pdf")){ canv.innerHTML = `<iframe src="${raw}"></iframe>`; } else { canv.innerHTML = `<img src="${raw}" class="im-v">`; }
            }
        };

        window.mExpand=(i)=>{ const e=document.getElementById('xp_'+i); e.style.display=e.style.display==='block'?'none':'block'; };
        window.mUp=async(i,s)=>{ if(confirm("OTORISASI PROSES?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        window.mSave=async(i)=>{ const m=document.getElementById('not_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("TERSINKRON!"); };
        window.filtX=(k)=>{
            document.querySelectorAll('.btn-filt').forEach(b => { if(b.innerText.includes(k.toUpperCase())||(k==='ALL'&&b.innerText.includes('DASHBOARD'))) b.classList.add('aktif'); else b.classList.remove('aktif'); });
            document.querySelectorAll('.case-box').forEach(e => e.style.display = (k==='ALL' || e.getAttribute('data-k')===k)?'block':'none');
        };

        const r=new Date(); document.getElementById('cal').innerText = r.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • KODE KONTROL TERKONFIRMASI";
        document.getElementById('srch').oninput=(e)=>{ const f=e.target.value.toUpperCase(); document.querySelectorAll('.case-box').forEach(it=>{ it.style.display=it.innerText.toUpperCase().includes(f)?'block':'none'; }); };
    </script>
</body>
</html>
