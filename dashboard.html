<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM AUDIT | SiAPP MAS Malra Finale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .sidebar-left { background: #0f172a; border-right: 2px solid #1e293b; z-index: 100; }
        .row-case-matrix { background: #ffffff; border-bottom: 2px solid #f1f5f9; transition: 0.2s; cursor: pointer; border-left: 6px solid transparent; }
        .row-case-matrix:hover { background: #fdfdfd; border-left-color: #3b82f6; }
        .exp-detail-panel { display: none; background: #fafcfe; border-bottom: 3px solid #e2e8f0; }
        #modalIntegritas { position: fixed; inset: 0; background: rgba(0,0,0,0.99); z-index: 99999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        .iframe-viewer { width: 92vw; height: 85vh; border-radius: 1.5rem; background: white; border: none; }
        .image-viewer { max-height: 85vh; max-width: 90vw; border-radius: 2rem; border: 4px solid white; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
        .tm-point { width: 10px; height: 10px; border-radius: 50%; background: #e2e8f0; border: 1px solid white; }
        .tm-line { height: 3px; background: #f1f5f9; flex-grow: 1; }
        .tm-active { background: #10b981 !important; box-shadow: 0 0 10px #10b981; }
        /* FONT LOCK : HITAM BOLT */
        .text-audit-bold { color: #000000 !important; font-weight: 900 !important; text-decoration: none !important; }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- HD DOCUMENT & BIOMETRIC VIEWER -->
    <div id="modalIntegritas" onclick="this.style.display='none'">
        <div id="modalCore" class="flex flex-col items-center justify-center p-4 w-full h-full" onclick="event.stopPropagation()">
            <!-- Konten Render Di Sini -->
        </div>
    </div>

    <!-- SIDEBAR : PUSAT KONTROL MALRA -->
    <aside class="sidebar-left w-64 fixed h-full p-6 text-white hidden lg:flex flex-col font-black italic uppercase">
        <div class="flex items-center gap-3 border-b border-slate-800 pb-10 mb-8">
            <img src="./logo_malra.png" alt="Malra" class="h-10 w-auto">
            <div><h1 class="text-sm">SiAPP <span class="text-blue-500 italic">MAS</span></h1><p class="text-[6.5px] tracking-widest mt-2 opacity-30 italic">Audit Matrix Pro</p></div>
        </div>
        <div class="flex-1 overflow-y-auto" id="crisisMapping"></div>
        <div class="mt-auto border-t border-slate-800 pt-8 lowercase font-sans">
            <p class="text-[8px] text-blue-500 font-bold mb-4 italic uppercase">Verified access granted by :</p>
            <p class="text-xs font-black uppercase italic text-blue-50 tracking-tighter">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[7.5px] opacity-40 mt-1 uppercase font-bold tracking-tight">AUDITOR AHLI PRATAMA MALRA @ 2026</p>
            <button onclick="location.href='index.html'" class="w-full mt-10 bg-slate-900 border border-slate-700 py-3 rounded-2xl text-[9px] uppercase font-black hover:bg-red-800 hover:text-white transition-all">Sign-Out Commander</button>
        </div>
    </aside>

    <main class="flex-1 lg:ml-64 p-4 lg:p-8 font-black uppercase italic">
        <header class="flex flex-col lg:flex-row justify-between lg:items-end gap-10 mb-14 border-b pb-8 border-slate-100">
            <div>
                <p class="text-[10px] text-slate-300 mb-2 font-sans tracking-widest" id="realClock"></p>
                <div class="flex items-center gap-6">
                    <h2 class="text-3xl text-slate-800 leading-none">Pusat Data Keadilan</h2>
                    <div class="flex gap-2">
                        <div class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[9px] shadow-lg shadow-blue-200 font-sans">ARSIP: <span id="val_tot">0</span></div>
                        <div class="bg-red-600 text-white px-4 py-2 rounded-xl text-[9px] shadow-lg shadow-red-200 font-sans">LOKET: <span id="val_act">0</span></div>
                    </div>
                </div>
            </div>
            <div class="relative lg:w-80 group">
                <i class="fas fa-fingerprint absolute left-4 top-4 text-blue-600 group-hover:scale-110 transition-transform"></i>
                <input type="text" id="engineSearch" placeholder="CARI CASE/TIKET/NAMA..." class="w-full bg-white border border-slate-100 p-4 pl-12 rounded-3xl text-[9px] font-black italic shadow-inner outline-none uppercase placeholder:opacity-20 focus:border-blue-500">
            </div>
        </header>

        <!-- TABLE LAYOUT CORE (HITAM BOLD) -->
        <div id="auditFeedContainer" class="divide-y rounded-[3.5rem] overflow-hidden border border-slate-200 bg-white shadow-2xl">
             <div class="p-40 text-center opacity-10">SYNCHRONIZING INTERNAL DATA...</div>
        </div>

        <p class="text-center text-[8px] mt-24 italic opacity-10 tracking-[0.4em] font-black">Malra Investigation Hub • Digital Architecture by Firdaus S.Kom</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
            const feed=document.getElementById('auditFeedContainer'); const mapper=document.getElementById('crisisMapping');
            feed.innerHTML=""; mapper.innerHTML=""; let totalLaps=snap.size, aktifLaps=0, kecMap={};

            snap.forEach(it => {
                const d=it.data(); const cid=it.id; 
                kecMap[d.kec]=(kecMap[d.kec]||0)+1; if(d.status!=="SELESAI") aktifLaps++;
                const isUrgent = (d.kat === "Dana Desa" || d.kat === "PBJ");
                
                feed.innerHTML += `
                <div id="wrapper_${cid}">
                    <div class="row-case-matrix grid lg:grid-cols-12 items-center gap-10 p-12 py-5 ${isUrgent?'bg-red-50/40':''}" onclick="togDetail('${cid}')">
                        <!-- BIOMETRIK FOTO (CLICKABLE THUMBNAIL) -->
                        <div class="col-span-1" onclick="event.stopPropagation(); masterViewer('${d.face}')">
                            <img src="${d.face}" class="w-14 h-14 rounded-2xl shadow-xl border-[3px] border-white object-cover hover:scale-110 transition-transform">
                        </div>
                        <div class="col-span-3 leading-none px-2 border-l border-slate-50">
                            <p class="text-[7px] text-blue-500 mb-2 tracking-[0.1em] font-sans font-bold">CASE-ID: ${d.ticket_id}</p>
                            <h4 class="text-[12px] font-black text-black leading-none">${d.kat.toUpperCase()}</h4>
                        </div>
                        
                        <!-- DATA PELAPOR & LOKASI : HITAM BOLT VERTIKAL (SARAN PAK FIRDAUS S.KOM) -->
                        <div class="col-span-5 flex flex-col justify-center leading-tight">
                            <h5 class="text-audit-bold text-[13px]">${d.pelapor_nama.toUpperCase()}</h5>
                            <p class="text-audit-bold text-[10px] mt-0.5 opacity-60">HP : ${d.wa}</p>
                            <p class="text-audit-bold text-[11px] mt-0.5 text-blue-800 uppercase tracking-tighter italic">KEC. ${d.kec} • OHOI ${d.vill}</p>
                        </div>

                        <!-- PROGRESS BAR -->
                        <div class="col-span-1 flex items-center gap-0.5">
                             <div class="tm-point tm-active"></div><div class="tm-line ${checkPs(d.status,1)?'tm-active':''}"></div>
                             <div class="tm-point ${checkPs(d.status,1)?'tm-active':''}"></div><div class="tm-line ${checkPs(d.status,2)?'tm-active':''}"></div>
                             <div class="tm-point ${checkPs(d.status,2)?'tm-active':''}"></div>
                        </div>

                        <div class="col-span-2 text-right">
                             <span class="inline-block py-2 px-5 rounded-2xl font-black text-[7.5px] border italic tracking-tighter shadow-sm bg-white text-slate-900 border-slate-100 uppercase">${d.status}</span>
                             <i class="fas fa-chevron-down opacity-5 ml-4"></i>
                        </div>
                    </div>
                    
                    <!-- EXPAND INVESTIGASI PANEL -->
                    <div id="exPan_${cid}" class="exp-detail-panel p-12">
                         <div class="grid lg:grid-cols-12 gap-10 items-start">
                            <div class="col-span-3 flex flex-col gap-6">
                                 <img src="${d.face}" class="rounded-3xl border-8 border-white shadow-2xl transition-all cursor-zoom-in hover:brightness-110" onclick="event.stopPropagation(); masterViewer('${d.face}')">
                                 <button onclick="event.stopPropagation(); masterViewer('${d.doc_archive}')" class="w-full bg-slate-900 text-emerald-400 p-6 rounded-3xl text-[9.5px] font-black italic shadow-2xl flex items-center justify-center gap-3 hover:bg-black active:translate-y-2">
                                       <i class="fas fa-microscope text-lg"></i> INSPEKSI BERKAS SAH
                                 </button>
                            </div>
                            <div class="col-span-6 bg-white p-10 rounded-[4rem] shadow-2xl border-t border-l border-white">
                                 <p class="text-[9px] text-blue-600 mb-4 block underline font-sans font-bold">KOMANDO SINTRONISASI INSTRUKSI :</p>
                                 <textarea id="msgAud_${cid}" onclick="event.stopPropagation()" class="w-full h-32 bg-slate-50 border-2 border-dashed border-slate-200 rounded-[2rem] p-6 font-black italic text-slate-800 outline-none text-sm" placeholder="Respon Auditor kepada warga...">${d.note || ""}</textarea>
                                 <button onclick="event.stopPropagation(); executePush('${cid}')" class="w-full mt-6 bg-emerald-600 text-white p-5 rounded-[2.5rem] font-black text-[10px] shadow-inner tracking-widest uppercase active:scale-95">TERBITKAN PESAN TINDAK LANJUT ✅</button>
                            </div>
                            <div class="col-span-3 space-y-4">
                                 <button onclick="event.stopPropagation(); updateM('${cid}','DIVERIFIKASI')" class="w-full bg-white border-2 border-blue-200 py-3 rounded-2xl text-[9px] text-blue-600 font-bold uppercase shadow-sm">VERIFIKASI ID</button>
                                 <button onclick="event.stopPropagation(); updateM('${cid}','DIPROSES')" class="w-full bg-white border-2 border-amber-200 py-3 rounded-2xl text-[9px] text-amber-700 font-bold uppercase shadow-sm">PROSES INVESTIGASI</button>
                                 <button onclick="event.stopPropagation(); updateM('${cid}','SELESAI')" class="w-full bg-emerald-600 text-white py-5 rounded-[3rem] text-[11px] font-black shadow-xl mt-8">ARSIIP SELESAI ✅</button>
                                 <a href="https://wa.me/${d.wa}" target="_blank" onclick="event.stopPropagation()" class="block text-center mt-12 text-[8px] opacity-10 underline tracking-tighter">CALL PUBLIC SECTOR HUB</a>
                            </div>
                         </div>
                    </div>
                </div>`;
            });

            Object.keys(kecMap).sort().forEach(kn => mapper.innerHTML += `<div class="group flex items-center justify-between p-3.5 hover:bg-blue-600/20 transition-all rounded-2xl mb-1 italic px-5"><span class="text-[8px] opacity-40 font-bold font-sans">${kn.toUpperCase()}</span><span class="bg-blue-600 text-white text-[7.5px] px-3 py-1 rounded-full font-black italic">${kecMap[kn]} AUDIT</span></div>`);
            document.getElementById('val_tot').innerText=totalLaps; document.getElementById('val_act').innerText=aktifLaps;
        });

        window.togDetail=(i)=>{ const e=document.getElementById('exPan_'+i); e.style.display=e.style.display==='block'?'none':'block'; };
        window.executePush=async(i)=>{ const m=document.getElementById('msgAud_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("TERSINTRONISASI KE PUBLIC HUB!"); };
        window.updateM=async(i,s)=>{ if(confirm("SAHKAN UPDATE PROGRESS AUDIT?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        
        // --- MASTER VIEWER ENGINE FINAL ARSITEKTUR S.KOM ---
        window.masterViewer=(url)=>{
            if(!url){alert("NOT FOUND!");return;}
            const core = document.getElementById('modalCore'); core.innerHTML="";
            
            // Logic Anti Blank : Deteksi Base64 / Format PDF
            if(url.includes("data:application/pdf") || url.includes(".pdf")){
                core.innerHTML = `
                    <div class="bg-white p-4 rounded-[3rem] shadow-2xl border-b-[15px] border-slate-900 w-fit">
                        <iframe src="${url}" class="iframe-viewer"></iframe>
                        <div class="mt-6 flex gap-6">
                            <button class="flex-1 bg-red-600 text-white py-5 rounded-[2rem] font-black text-xs uppercase italic tracking-widest shadow-xl" onclick="document.getElementById('modalIntegritas').style.display='none'">TUTUP INVESTIGASI PDF</button>
                            <a href="${url}" download="surat-aduan.pdf" class="px-10 bg-slate-900 text-white flex items-center justify-center rounded-[2rem] font-black text-xs uppercase italic tracking-tighter">DOWNLOAD ARSIP</a>
                        </div>
                    </div>`;
            } else {
                core.innerHTML = `
                    <img src="${url}" class="image-viewer border-white border-[10px]">
                    <button class="bg-blue-600 text-white px-20 py-5 mt-10 rounded-full font-black text-xs uppercase shadow-2xl tracking-[0.3em] active:translate-y-4" onclick="document.getElementById('modalIntegritas').style.display='none'">CLOSE INSPECTION</button>`;
            }
            document.getElementById('modalIntegritas').style.display='flex';
        };

        function checkPs(c,n){ if(c==="DIVERIFIKASI") return n<=1; if(c==="DIPROSES") return n<=2; if(c==="SELESAI") return n<=3; return false; }
        const rT = new Date(); document.getElementById('realClock').innerText = rT.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • GOVERNANCE AUDIT ENGINE SECURED";
        document.getElementById('engineSearch').oninput=(e)=>{ const v=e.target.value.toUpperCase(); document.querySelectorAll('.row-case-matrix').forEach(r=>{ r.style.display=r.innerText.toUpperCase().includes(v)?'grid':'none'; }); };
    </script>
</body>
</html>
