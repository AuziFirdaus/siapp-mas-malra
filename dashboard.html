<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD UTAMA SiAPP MAS MALRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #000; margin: 0; }
        .sidebar { background: #000a1f; border-right: 5px solid #3b82f6; width: 320px; height: 100vh; position: fixed; }
        .row-case { background: white; border-bottom: 2px solid #e2e8f0; transition: 0.3s; cursor: pointer; }
        .row-case:hover { background: #f8fafc; border-left: 8px solid #3b82f6; }
        .expanded-detail { display: none; background: #ffffff; padding: 30px; border-bottom: 5px solid #cbd5e1; }
        /* VIEWER FIX */
        #modalViewer { position: fixed; inset: 0; background: #000; z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        iframe { width: 95vw; height: 80vh; background: white; border-radius: 15px; }
        img.hd-img { max-height: 75vh; max-width: 95vw; border: 10px solid white; border-radius: 20px; }
        /* TEXT STYLING BAPAK */
        .txt-bolt-pekat { color: #000000 !important; font-weight: 900 !important; text-transform: uppercase; }
        .tab-btn { background: white; border: 2px solid #cbd5e1; font-weight: 900; padding: 10px 25px; border-radius: 99px; font-size: 11px; }
        .tab-btn.aktif { background: #0ea5e9 !important; color: white !important; border-color: #0ea5e9; }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex">

    <!-- GERBANG LOGIN (WAJIB) -->
    <div id="pintuAkses" style="position:fixed; inset:0; background:#000a1f; z-index:9999999; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; padding:50px; border-radius:3rem; width:400px; text-align:center; border-bottom:15px solid #3b82f6;">
            <img src="./logo_malra.png" style="height:100px; margin:0 auto 30px;">
            <h2 class="txt-bolt-pekat text-xl italic mb-10">AKSES AUDITOR TERKUNCI</h2>
            <input type="text" id="userInput" placeholder="USER ID" style="width:100%; padding:20px; border:2px solid #e2e8f0; border-radius:1.5rem; margin-bottom:15px; text-align:center; font-weight:900;">
            <input type="password" id="passInput" placeholder="KODE AUTH" style="width:100%; padding:20px; border:2px solid #e2e8f0; border-radius:1.5rem; margin-bottom:30px; text-align:center; font-weight:900; letter-spacing:5px;">
            <button id="btnLogin" style="width:100%; background:#2563eb; color:white; font-weight:900; padding:25px; border-radius:1.5rem; font-size:14px; text-transform:uppercase;">INITIATE ACCESS</button>
        </div>
    </div>

    <!-- PUSAT PENAMPIL PDF/FOTO -->
    <div id="modalViewer">
        <div id="canvasCore" class="flex flex-col items-center w-full"></div>
        <!-- TOMBOL KELUAR RAKSASA (FIX SCREENSHOT 101/102) -->
        <button onclick="document.getElementById('modalViewer').style.display='none'" style="background:#ef4444; color:white; width:90%; padding:30px; border-radius:2rem; font-weight:900; font-size:25px; margin-top:20px; cursor:pointer;">EXIT : KEMBALI KE PANEL (KELUAR)</button>
    </div>

    <!-- SIDEBAR STAY LOCKED -->
    <aside class="sidebar p-8 flex flex-col italic font-black uppercase text-white">
        <div class="border-b-4 border-blue-600 pb-10 mb-8 text-center">
            <img src="./logo_malra.png" class="h-40 mx-auto mb-4">
            <h1 class="text-xl">SiAPP <span class="text-blue-500">MAS</span></h1>
            <p class="text-[8px] tracking-[0.4em] opacity-40">Command Center</p>
        </div>
        <div class="flex-1 overflow-y-auto" id="areaListKec"></div>
        <div class="mt-auto border-t-2 border-slate-700 pt-8 font-sans">
            <p class="text-[9px] text-blue-500 font-black mb-2 uppercase">CHIEF AUDITOR MALRA :</p>
            <p class="text-xl leading-none">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[9px] opacity-30 mt-1 uppercase italic font-bold">Audit Ahli Pratama @ 2026</p>
            <button onclick="location.reload()" class="w-full mt-10 bg-slate-900 border-2 border-red-900 text-red-600 py-3 rounded-2xl text-[10px]">SIGN OUT</button>
        </div>
    </aside>

    <!-- CONTENT TABLE DATA -->
    <main class="flex-1 ml-[320px] p-8 uppercase font-black italic">
        <header class="flex justify-between items-end border-b-4 border-slate-900 pb-10 mb-10">
            <div>
                <p id="tglReal" class="text-blue-600 text-xs mb-2"></p>
                <h2 class="text-3xl text-slate-800">PORTAL KENDALI DATA</h2>
            </div>
            <div class="relative w-80">
                <i class="fas fa-fingerprint absolute left-4 top-4 text-blue-600"></i>
                <input type="text" id="srchEngine" placeholder="SEARCH CASE..." style="width:100%; background:white; border:3px solid #000; padding:15px 15px 15px 50px; border-radius:2rem; font-size:12px;">
            </div>
        </header>

        <div class="flex gap-3 mb-10">
            <button onclick="filt('ALL')" class="tab-btn aktif">DAFTAR SEMUA</button>
            <button onclick="filt('Dana Desa')" class="tab-btn">DANA DESA</button>
            <button onclick="filt('Dana BOS')" class="tab-btn">DANA BOS/PAUD</button>
            <button onclick="filt('BOK Puskesmas')" class="tab-btn">DANA BOK</button>
            <button onclick="filt('PBJ')" class="tab-btn">PBJ KANTOR</button>
        </div>

        <div id="dataGrid" class="divide-y-4 bg-white border-4 border-slate-900 rounded-[3rem] overflow-hidden shadow-2xl">
             <p class="p-40 text-center opacity-10">Awaiting Signal From Server...</p>
        </div>
    </main>

    <audio id="intelSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        // LOGIN ENGINE PROTECTED
        document.getElementById('btnLogin').onclick = () => {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;
            if(u === 'itkabmalra1' && p === 'itkabmalra01') {
                document.getElementById('pintuAkses').style.display='none';
                startSync();
            } else { alert("ACCESS DENIED : USER WRONG"); }
        }

        function startSync() {
            let lastLen = -1;
            onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (sn) => {
                const grid = document.getElementById('dataGrid'); const mp = document.getElementById('areaListKec');
                grid.innerHTML = ""; mp.innerHTML = "";
                let kM = {}; 

                if(lastLen !== -1 && sn.size > lastLen) document.getElementById('intelSound').play();
                lastLen = sn.size;

                sn.forEach(shot => {
                    const d = shot.data(); const id = shot.id; kM[d.kec]=(kM[d.kec]||0)+1;
                    grid.innerHTML += `
                    <div class="row-target" data-k="${d.kat}">
                        <div class="row-case grid grid-cols-12 gap-5 p-12 py-6 items-center" onclick="openP('${id}')">
                            <div class="col-span-1" onclick="event.stopPropagation(); look('${d.face}')"><img src="${d.face}" class="w-24 h-24 rounded-3xl border-4 border-slate-100 shadow-xl object-cover"></div>
                            <div class="col-span-3 border-l-2 pl-8 border-slate-50"><p class="text-[9px] text-blue-600 mb-1 italic">tiket: ${d.ticket_id}</p><h4 class="text-md leading-tight txt-bolt-pekat">${d.kat}</h4></div>
                            <div class="col-span-6 flex flex-col justify-center px-10 border-x-2 border-slate-50">
                                 <h5 class="txt-bolt-pekat text-[40px] leading-none mb-1 truncate">${d.pelapor_nama}</h5>
                                 <p class="txt-bolt-pekat text-xl text-emerald-700 opacity-60">HUB: ${d.wa}</p>
                                 <p class="txt-bolt-pekat text-lg mt-2 text-blue-900 font-sans tracking-tighter">LOKASI: ${d.kec} • OHOI ${d.vill}</p>
                            </div>
                            <div class="col-span-2 text-right">
                                <span style="background:${d.status==='SELESAI'?'#059669':'#dc2626'}; color:white;" class="inline-block py-2 px-10 rounded-full font-black text-xs uppercase">${d.status}</span>
                            </div>
                        </div>

                        <div id="pan_${id}" class="expanded-detail">
                            <div class="grid grid-cols-12 gap-10 italic">
                                <div class="col-span-3 flex flex-col gap-8 items-center text-center">
                                    <img src="${d.face}" class="rounded-[3rem] border-8 border-white shadow-2xl" onclick="event.stopPropagation(); look('${d.face}')">
                                    <button onclick="event.stopPropagation(); look('${d.doc_archive}')" style="background:#000; color:#3b82f6;" class="w-full p-8 rounded-full font-black text-[12px] shadow-2xl uppercase">INSPEKSI FISIK SURAT <i class="fas fa-barcode"></i></button>
                                </div>
                                <div class="col-span-6 bg-slate-50 p-10 rounded-[4rem] shadow-inner text-center border-t-8 border-white">
                                    <p class="txt-bolt-pekat text-sm text-blue-600 mb-8 block underline decoration-4 decoration-blue-100">INSTRUKSI PENYELESAIAN AUDIT :</p>
                                    <textarea id="nt_${id}" onclick="event.stopPropagation()" class="w-full h-40 bg-white border-4 border-dashed rounded-[3rem] p-10 text-[35px] font-black italic text-black outline-none shadow-xl focus:border-blue-600">${d.note || ""}</textarea>
                                    <button onclick="event.stopPropagation(); saveN('${id}')" style="background:#10b981;" class="w-full mt-10 text-white p-6 rounded-full text-xl shadow-xl uppercase animate-pulse">SINKRONKAN PESAN KEU PUBLIC ✅</button>
                                </div>
                                <div class="col-span-3 flex flex-col gap-6 pt-10">
                                    <p class="text-[10px] font-black italic text-slate-400 border-l-4 border-blue-600 pl-4">SET AUDIT STATUS :</p>
                                    <button onclick="event.stopPropagation(); updS('${id}','DIVERIFIKASI')" style="border:4px solid #dbeafe; color:#1e40af;" class="w-full py-6 rounded-[2rem] font-black text-xl bg-white shadow-xl">VERIFIKASI ID</button>
                                    <button onclick="event.stopPropagation(); updS('${id}','DIPROSES')" style="border:4px solid #ffedd5; color:#9a3412;" class="w-full py-6 rounded-[2rem] font-black text-xl bg-white shadow-xl">START AUDIT</button>
                                    <button onclick="event.stopPropagation(); updS('${id}','SELESAI')" style="background:#000; color:#10b981;" class="w-full py-10 mt-12 rounded-[5rem] font-black text-3xl shadow-2xl">MARK DONE ✅</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                Object.keys(kM).sort().forEach(n => mp.innerHTML += `<div style="display:flex; justify-between; align-items:center; padding:15px; background:rgba(255,255,255,0.05); margin-bottom:5px; border-radius:1.5rem;"><span style="color:white; font-size:11px;">${n}</span><span style="background:#3b82f6; padding:2px 10px; border-radius:50px; font-size:9px;">${kM[n]} DATA</span></div>`);
                document.getElementById('ui_tot').innerText = total; document.getElementById('ui_act').innerText = act;
            });
        }

        window.look = (u) => {
            const canv = document.getElementById('canvasCore'); canv.innerHTML = "";
            const isP = (u.includes("pdf") || u.includes("blob:"));
            if(isP) canv.innerHTML = `<iframe src="${u}"></iframe>`;
            else canv.innerHTML = `<img src="${u}" class="hd-img shadow-2xl">`;
            document.getElementById('modalViewer').style.display='flex';
        };

        window.openP = (i) => { const el = document.getElementById('pan_'+i); el.style.display = el.style.display === 'block' ? 'none' : 'block'; };
        window.updS = async(i,s) => { if(confirm("AUTORISASI UPDATE DATA?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        window.saveN = async(i) => { const m = document.getElementById('nt_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("CONNECTED!"); };
        window.filt = (k) => {
            document.querySelectorAll('.tab-btn').forEach(b => { if(b.innerText.includes(k.toUpperCase())||(k==='ALL'&&b.innerText.includes('DAFTAR'))) b.classList.add('aktif'); else b.classList.remove('aktif'); });
            document.querySelectorAll('.row-target').forEach(e => e.style.display = (k==='ALL' || e.getAttribute('data-k')===k)?'block':'none');
        };

        const rt = new Date(); document.getElementById('tglReal').innerText = rt.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • KODE KONTROL FIRDAUS S.KOM";
        document.getElementById('srchEngine').oninput=(e)=>{ const v=e.target.value.toUpperCase(); document.querySelectorAll('.row-target').forEach(r=>{ r.style.display=r.innerText.toUpperCase().includes(v)?'block':'none'; }); };
    </script>
</body>
</html>
