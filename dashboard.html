<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB AUDIT | Firdaus Setitit S.Kom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfdfd; color: #1e293b; overflow-x: hidden; }
        .side { background: #0f172a; border-right: 2px solid #1e293b; }
        .row-case { background: #ffffff; border-bottom: 1.5px solid #f1f5f9; transition: 0.3s; cursor: pointer; }
        .row-case:hover { background: #f8fafc; border-left: 6px solid #3b82f6; }
        .exp-pan { display: none; background: #fafcfe; border-bottom: 2px solid #cbd5e1; }
        #modalViewer { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        iframe.pdf-v { width: 90vw; height: 85vh; border-radius: 1.5rem; background: white; border: none; }
        .img-hd { max-height: 85vh; border-radius: 2rem; border: 4px solid white; shadow: 2xl; }
        * { text-decoration: none !important; transition: all 0.2s; }
        .tm-point { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; border: 1.5px solid white; }
        .tm-line { height: 2px; background: #f1f5f9; flex-grow: 1; }
        .tm-active { background: #10b981 !important; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="modalViewer" onclick="this.style.display='none'">
        <div id="vCont" class="text-center w-full flex flex-col items-center justify-center p-4">
            <!-- Loader Otomatis Disini -->
        </div>
    </div>

    <aside class="side w-64 fixed h-full p-8 text-white hidden lg:flex flex-col font-black italic uppercase">
        <div class="flex items-center gap-3 border-b border-slate-800 pb-10 mb-8">
            <img src="./logo_malra.png" alt="MALRA" class="h-10 w-auto opacity-80">
            <div><h1 class="text-lg">SiAPP <span class="text-blue-500 italic">MAS</span></h1><p class="text-[7px] tracking-widest mt-2 opacity-30 italic">Audit Matrix</p></div>
        </div>
        <div class="flex-1 overflow-y-auto pr-2" id="mapList"></div>
        <div class="mt-auto border-t border-slate-800 pt-10 lowercase font-sans">
            <p class="text-[8px] text-blue-500 font-bold mb-4 italic uppercase">Commander authenticated :</p>
            <p class="text-sm font-black leading-none uppercase italic text-blue-50 tracking-tighter">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[8px] opacity-40 mt-1 uppercase font-bold tracking-tight">AUDIT AHLI PRATAMA MALRA @ 2026</p>
            <button onclick="location.href='index.html'" class="w-full mt-10 bg-slate-800 border border-slate-700 py-3 rounded-2xl text-[9px] uppercase font-black hover:bg-red-700">Log-Out System</button>
        </div>
    </aside>

    <main class="flex-1 lg:ml-64 p-5 lg:p-10 font-black">
        <header class="flex flex-col lg:flex-row justify-between lg:items-end gap-10 mb-16 border-b pb-10 border-slate-100 italic">
            <div>
                <p class="text-[10px] text-slate-300 mb-2 uppercase" id="timeD"></p>
                <div class="flex items-center gap-6">
                    <h2 class="text-3xl text-slate-800 leading-none">Matrix Kendali Pusat</h2>
                    <div class="flex gap-2">
                        <div class="bg-blue-50 text-blue-700 border border-blue-100 rounded-xl px-4 py-2 text-[10px]">TOT: <span id="tot">0</span></div>
                        <div class="bg-red-50 text-red-700 border border-red-100 rounded-xl px-4 py-2 text-[10px]">LIVE: <span id="act">0</span></div>
                    </div>
                </div>
            </div>
            <div class="relative w-full lg:w-80 group">
                <i class="fas fa-id-fingerprint absolute left-4 top-4 text-blue-600 transition-transform group-hover:scale-125"></i>
                <input type="text" id="master-s" placeholder="ID / NAMA SEARCH..." class="w-full bg-slate-50 border border-slate-100 p-4 pl-12 rounded-3xl text-[9.5px] font-black italic uppercase shadow-inner outline-none">
            </div>
        </header>

        <div id="caseFeed" class="divide-y rounded-[3.5rem] overflow-hidden border border-slate-200 bg-white shadow-2xl">
             <div class="p-32 text-center opacity-10 uppercase italic text-lg">Initialing Intelligence Secure Link...</div>
        </div>

        <p class="text-center text-[8px] mt-24 italic opacity-10 tracking-[0.4em] font-black uppercase">Government Infrastructure • Arsitektur Firdaus Setitit S.Kom</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const cf = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(cf); const db = getFirestore(app);

        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (sn) => {
            const feed=document.getElementById('caseFeed'); const maps=document.getElementById('mapList');
            feed.innerHTML=""; maps.innerHTML=""; let t=sn.size, p=0, dM={};

            sn.forEach(snap => {
                const d=snap.data(); const cid=snap.id;
                dM[d.kec]=(dM[d.kec]||0)+1; if(d.status!=="SELESAI") p++;
                const isUrgent = (d.kat === "Dana Desa" || d.kat === "PBJ");
                
                feed.innerHTML += `
                <div id="w_${cid}">
                    <div class="row-case grid lg:grid-cols-12 items-center gap-6 p-10 py-4 ${isUrgent?'bg-red-50/50':''}" onclick="tog('${cid}')">
                        <div class="col-span-1"><img src="${d.face}" class="w-12 h-12 rounded-xl shadow-lg border-2 border-white object-cover"></div>
                        <div class="col-span-2 pl-4"><p class="text-[7.5px] text-blue-500 italic mb-1 uppercase font-sans tracking-widest">${d.ticket_id}</p><h4 class="text-[10px] leading-tight font-black">${d.kat}</h4></div>
                        <div class="col-span-2 text-[10.5px] font-black italic text-slate-700">${d.pelapor_nama}</div>
                        <div class="col-span-3 text-[9px] italic opacity-40 font-black lowercase">${d.kec.toUpperCase()} • OHOI ${d.vill.toUpperCase()}</div>
                        <div class="col-span-2 flex items-center gap-1">
                             <div class="tm-point tm-active"></div><div class="tm-line ${ps(d.status,1)?'tm-active':''}"></div>
                             <div class="tm-point ${ps(d.status,1)?'tm-active':''}"></div><div class="tm-line ${ps(d.status,2)?'tm-active':''}"></div>
                             <div class="tm-point ${ps(d.status,2)?'tm-active':''}"></div><div class="tm-line ${ps(d.status,3)?'tm-active':''}"></div>
                             <div class="tm-point ${ps(d.status,3)?'tm-active':''}"></div>
                        </div>
                        <div class="col-span-2 text-right">
                             <span class="inline-block py-1.5 px-4 rounded-xl text-[7px] font-black italic bg-slate-900 text-white shadow-inner uppercase tracking-widest">${d.status}</span>
                             <i class="fas fa-shield-halved ml-4 opacity-5"></i>
                        </div>
                    </div>
                    
                    <div id="ex_${cid}" class="exp-pan p-12 italic uppercase font-black tracking-tight">
                         <div class="grid lg:grid-cols-12 gap-10">
                            <div class="col-span-3 flex flex-col gap-6">
                                 <img src="${d.face}" class="rounded-3xl border-[6px] border-white shadow-2xl">
                                 <button onclick="event.stopPropagation(); vMaster('${d.doc_archive}')" class="w-full bg-slate-900 border-b-4 border-slate-950 text-white p-5 rounded-2xl text-[9px] flex items-center justify-center gap-3 active:scale-95"><i class="fas fa-microscope text-blue-400"></i> BUKA SCAN INVESTIGASI</button>
                            </div>
                            <div class="col-span-6 bg-white p-8 rounded-[3rem] border-t border-l border-white shadow-2xl">
                                 <p class="text-[8.5px] text-blue-600 mb-4 block underline">INSTRUKSI PENYELESAIAN AUDITOR :</p>
                                 <textarea id="msg_${cid}" onclick="event.stopPropagation()" class="w-full h-32 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 p-4 font-black italic text-slate-800 outline-none focus:bg-white" placeholder="Ketik Respon Anda Untuk Warga...">${d.note || ""}</textarea>
                                 <button onclick="event.stopPropagation(); svR('${cid}')" class="w-full mt-4 bg-emerald-600 text-white p-5 rounded-[2rem] font-black text-[9px] shadow-xl uppercase italic">PUSH MESSAGE TO PUBLIC HUB ✅</button>
                                 <a href="https://wa.me/${d.wa}" target="_blank" onclick="event.stopPropagation()" class="block text-center mt-5 text-[9px] opacity-20 underline uppercase">hubungi pelapor (WA)</a>
                            </div>
                            <div class="col-span-3 space-y-4">
                                 <button onclick="event.stopPropagation(); uS('${cid}','DIVERIFIKASI')" class="w-full bg-white border-2 border-slate-100 py-3 rounded-2xl text-[9px] text-blue-600 font-black">VALIDASI DATA</button>
                                 <button onclick="event.stopPropagation(); uS('${cid}','DIPROSES')" class="w-full bg-white border-2 border-slate-100 py-3 rounded-2xl text-[9px] text-amber-600 font-black">MULAI AUDIT DINAS</button>
                                 <button onclick="event.stopPropagation(); uS('${cid}','SELESAI')" class="w-full bg-emerald-600 text-white py-5 rounded-[3rem] text-[11px] font-black shadow-2xl active:translate-y-2 uppercase">ARKIP SELESAI ✅</button>
                            </div>
                         </div>
                    </div>
                </div>`;
            });
            Object.keys(dM).sort().forEach(kn=> maps.innerHTML += `<div class="group flex items-center justify-between p-3.5 hover:bg-slate-800 transition-colors rounded-2xl mb-1 italic px-4"><span class="text-[7.5px] opacity-30">${kn.toLowerCase()}</span><span class="text-[7px] text-blue-400 font-black tracking-widest">${dM[kn]} LAPS</span></div>`);
            document.getElementById('tot').innerText=t; document.getElementById('act').innerText=p;
        });

        window.tog=(i)=>{ const e=document.getElementById('ex_'+i); e.style.display=e.style.display==='block'?'none':'block'; };
        window.svR=async(i)=>{ const n=document.getElementById('msg_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:n}); alert("DATA SINRON SAH!"); };
        window.uS=async(i,s)=>{ if(confirm("RUBAH STATUS SECURE?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        
        window.vMaster=(url)=>{
            const cont = document.getElementById('vCont'); cont.innerHTML=""; 
            if(url.includes("application/pdf")){ cont.innerHTML=`<iframe src="${url}" class="pdf-v"></iframe>`; }
            else { cont.innerHTML=`<img src="${url}" class="img-hd shadow-2xl">`; }
            document.getElementById('modalViewer').style.display='flex';
        }

        function ps(c,n){ if(c==="DIVERIFIKASI") return n<=1; if(c==="DIPROSES") return n<=2; if(c==="SELESAI") return n<=3; return false; }
        const nt=new Date(); document.getElementById('timeD').innerText=nt.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()+" • COMMAND PANEL SECURE";
    </script>
</body>
</html>
