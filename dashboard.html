<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEM AUDIT MALRA | Cloud Integrated Interface S.Kom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <!-- Cloudinary SDK -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f7fa; color: #000; margin: 0; }
        .sidebar { background: #000a1f; border-right: 4px solid #3b82f6; width: 270px; height: 100vh; position: fixed; z-index: 100; }
        .row-case { background: white; border-bottom: 1px solid #e2e8f0; transition: 0.2s; cursor: pointer; border-left: 6px solid transparent; }
        .row-case:hover { background: #fdfdfd; border-left-color: #3b82f6; transform: scale(1.002); }
        .expanded-detail { display: none; background: #fcfdfe; padding: 25px; border-bottom: 4px solid #cbd5e1; }
        #modalViewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .canvas-container { width: 90vw; height: 75vh; display: flex; align-items: center; justify-content: center; position: relative; }
        iframe { width: 100%; height: 100%; border-radius: 12px; border: 4px solid #333; background: #eee; }
        img.hd-img { max-height: 80vh; max-width: 90vw; border: 8px solid white; border-radius: 15px; object-fit: contain; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .txt-bolt-pekat { color: #000000 !important; font-weight: 900 !important; text-transform: uppercase; line-height: 1; }
        .tab-btn { background: white; border: 1.5px solid #cbd5e1; font-weight: 800; padding: 8px 18px; border-radius: 99px; font-size: 10px; transition: 0.3s; }
        .tab-btn.aktif { background: #0ea5e9 !important; color: white !important; border-color: #0ea5e9; }
        * { text-decoration: none !important; }
        .pulse-btn { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- LOGIN WALL -->
    <div id="pintuAkses" style="position:fixed; inset:0; background:#000a1f; z-index:9999999; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; padding:40px; border-radius:3rem; width:380px; text-align:center; border-bottom:12px solid #3b82f6;">
            <img src="./logo_malra.png" style="height:90px; margin:0 auto 20px;">
            <h2 class="txt-bolt-pekat text-lg mb-8 italic">VERIFIKASI COMMANDER MALRA</h2>
            <input type="text" id="userInput" placeholder="USER ID" style="width:100%; padding:18px; border:2px solid #e2e8f0; border-radius:1rem; margin-bottom:12px; text-align:center; font-weight:900;">
            <input type="password" id="passInput" placeholder="KODE AUTH" style="width:100%; padding:18px; border:2px solid #e2e8f0; border-radius:1rem; margin-bottom:25px; text-align:center; font-weight:900; letter-spacing:4px;">
            <button id="btnLogin" style="width:100%; background:#2563eb; color:white; font-weight:900; padding:22px; border-radius:1.5rem; font-size:12px; text-transform:uppercase; cursor:pointer;">ACTIVATE ENGINE</button>
        </div>
    </div>

    <!-- ADVANCED CLOUDINARY VIEWER -->
    <div id="modalViewer">
        <div id="canvasCore" class="canvas-container"></div>
        <div class="flex gap-4 w-full justify-center">
            <button onclick="document.getElementById('modalViewer').style.display='none'" style="background:#ef4444; color:white; width:60%; max-width:300px; padding:18px; border-radius:2rem; font-weight:900; font-size:12px; margin-top:20px; cursor:pointer; text-transform:uppercase;">CLOSE ATTACHMENT [ESC]</button>
            <a id="downloadLink" href="#" target="_blank" style="background:#10b981; color:white; width:200px; padding:18px; border-radius:2rem; font-weight:900; font-size:12px; margin-top:20px; display:flex; align-items:center; justify-content:center; text-transform:uppercase;">Buka di Tab Baru <i class="fas fa-external-link-alt ml-2"></i></a>
        </div>
    </div>

    <aside class="sidebar p-6 flex flex-col italic font-black uppercase text-white">
        <div class="border-b border-slate-700 pb-8 mb-6 text-center">
            <img src="./logo_malra.png" class="h-28 mx-auto mb-3">
            <h1 class="text-lg">SiAPP <span class="text-blue-500">MAS</span></h1>
            <p class="text-[7px] tracking-[0.2em] opacity-40 italic">Command Gateway Hub • CLOUD VERSION</p>
        </div>
        <div class="flex-1 overflow-y-auto" id="areaListKec"></div>
        <div class="mt-auto border-t-2 border-slate-700 pt-6 font-sans">
            <p class="text-sm font-black italic text-white uppercase leading-none">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[8px] opacity-30 mt-1 uppercase italic font-bold">Auditor Ahli Pratama @ 2026</p>
            <button onclick="location.reload()" class="w-full mt-6 bg-slate-900 border border-slate-700 py-3 rounded-2xl text-[8.5px] hover:bg-red-700 font-black text-red-500 hover:text-white uppercase italic">End Command</button>
        </div>
    </aside>

    <main class="flex-1 ml-[270px] p-6 uppercase font-black italic tracking-tighter">
        <header class="flex justify-between items-end border-b-4 border-slate-900 pb-8 mb-8">
            <div>
                <p id="tglReal" class="text-blue-600 text-[10px] mb-1 font-bold font-sans tracking-widest"></p>
                <h2 class="text-2xl text-slate-800 uppercase font-black">Gateway Laporan Masyarakat</h2>
            </div>
            <div class="flex gap-2">
                <div class="bg-black text-white px-5 py-2.5 rounded-xl text-[9px] shadow-lg">TOTAL: <span id="ui_tot_stats">0</span></div>
                <div class="bg-red-600 text-white px-5 py-2.5 rounded-xl text-[9px] shadow-lg">BARU: <span id="ui_act_stats">0</span></div>
            </div>
        </header>
        
        <!-- Tab & Grid (Isinya diatur oleh JS Bapak yang Sempurna) -->
        <div id="dataGrid" class="divide-y-2 bg-white border-2 border-slate-900 rounded-[3rem] overflow-hidden shadow-2xl mt-10">
             <div class="p-20 text-center opacity-10 uppercase italic">Sinkronisasi Cloud Asset Malra...</div>
        </div>
    </main>

    <audio id="alrtSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const cf = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(cf); const db = getFirestore(app);

        // --- START CORE LOGIC BAPAK ---
        document.getElementById('btnLogin').onclick = () => {
            const u = document.getElementById('userInput').value, p = document.getElementById('passInput').value;
            if(u === 'itkabmalra1' && p === 'itkabmalra01') { document.getElementById('pintuAkses').style.display='none'; startMatrix(); } else { alert("DITOLAK!"); }
        };

        function startMatrix() {
            onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
                const gr = document.getElementById('dataGrid'); gr.innerHTML = "";
                let actv = 0;
                snap.forEach(shot => {
                    const d = shot.data(); const cid = shot.id;
                    if(d.status === "DILIHAT") actv++;
                    gr.innerHTML += `
                    <div class="row-target" data-k="${d.kat}">
                        <div class="row-case grid grid-cols-12 gap-5 p-8 py-4 items-center" onclick="togD('${cid}')">
                            <div class="col-span-1" onclick="event.stopPropagation(); see('${d.face}')"><img src="${d.face}" class="w-14 h-14 rounded-xl object-cover border-2 border-slate-100"></div>
                            <div class="col-span-2 leading-none"><p class="text-[8px] text-blue-500 mb-1"># ${d.ticket_id}</p><h4 class="text-[9.5px] font-black">${d.kat}</h4></div>
                            <div class="col-span-7 flex flex-col justify-center px-10 border-x">
                                 <h5 class="txt-bolt-pekat text-[24px] truncate italic">${d.pelapor_nama}</h5>
                                 <p class="text-[9px] font-bold text-black opacity-60 italic">WILAYAH: ${d.kec} / OHOI: ${d.vill}</p>
                            </div>
                            <div class="col-span-2 text-right"><span class="py-2 px-6 rounded-2xl text-white font-black text-[9px]" style="background:${d.status==='SELESAI'?'#10b981':'#ef4444'};">${d.status}</span></div>
                        </div>
                        <div id="ex_${cid}" class="expanded-detail">
                            <div class="grid grid-cols-12 gap-8">
                                <div class="col-span-3 text-center space-y-4">
                                    <div class="bg-slate-900 rounded-[2.5rem] p-1 shadow-2xl cursor-pointer" onclick="event.stopPropagation(); see('${d.face}')">
                                        <img src="${d.face}" class="rounded-[2.4rem] w-full">
                                    </div>
                                    <button onclick="event.stopPropagation(); see('${d.doc_archive}')" class="w-full p-6 bg-sky-500 rounded-full text-[10px] font-black text-white pulse-btn">LIHAT DOKUMEN ADUAN <i class="fas fa-file-invoice-dollar ml-2"></i></button>
                                </div>
                                <div class="col-span-6 bg-white p-8 rounded-[3.5rem] shadow-xl text-center">
                                    <p class="text-[10px] text-blue-600 mb-6 font-black underline tracking-widest uppercase">RESPONS AUDITOR KEPADA WARGA :</p>
                                    <textarea id="msg_${cid}" onclick="event.stopPropagation()" class="w-full h-32 bg-slate-50 border-2 border-emerald-50 rounded-3xl p-6 text-lg font-black italic shadow-inner">${d.note || ""}</textarea>
                                    <button onclick="event.stopPropagation(); saveM('${cid}')" class="w-full mt-6 bg-emerald-600 text-white py-5 rounded-full font-black text-xs uppercase shadow-lg">UPDATE BALASAN</button>
                                </div>
                                <div class="col-span-3 flex flex-col gap-2 pt-10">
                                    <button onclick="event.stopPropagation(); upP('${cid}','DIPROSES')" class="w-full py-4 rounded-xl font-black text-[10px] bg-slate-100 border border-slate-200">SET DIPROSES</button>
                                    <button onclick="event.stopPropagation(); upP('${cid}','SELESAI')" class="w-full bg-slate-900 text-emerald-400 py-6 rounded-[3.5rem] text-[13px] uppercase font-black shadow-2xl">ARSIP SELESAI ✅</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                document.getElementById('ui_tot_stats').innerText = snap.size;
                document.getElementById('ui_act_stats').innerText = actv;
            });
        }

        // --- PENYEMPURNAAN ENGINE VIEWER (SUNTIKAN AI) ---
        window.see = (url) => {
            if(!url || url === "" || url === "undefined") return alert("Aset Cloud tidak ditemukan atau sedang proses enkripsi.");
            const canv = document.getElementById('canvasCore'); 
            const dLink = document.getElementById('downloadLink');
            canv.innerHTML = "";
            dLink.href = url; // Update tombol "Buka Tab Baru"
            
            const isPDF = url.toLowerCase().includes(".pdf") || url.toLowerCase().includes("/raw/");

            if(isPDF) {
                // Bypass logic: Langsung render via PDF browser atau Fallback Google Viewer
                canv.innerHTML = `<iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true" allow="autoplay"></iframe>`;
            } else {
                // Render gambar High-Res Cloudinary
                canv.innerHTML = `<img src="${url}" class="hd-img">`;
            }
            document.getElementById('modalViewer').style.display='flex';
        };

        window.togD = (i) => { const el = document.getElementById('ex_'+i); el.style.display = el.style.display === 'block' ? 'none' : 'block'; };
        window.upP = async(i,s) => { if(confirm(`Tandai sebagai ${s}?`)) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        window.saveM = async(i) => { const m = document.getElementById('msg_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("TERKIRIM!"); };

        const tD = new Date(); document.getElementById('tglReal').innerText = tD.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • SECURE TERMINAL";
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('modalViewer').style.display='none'; });
    </script>
</body>
</html>
