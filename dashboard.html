<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiAPP Mas Admin | Command Hub Malra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #334155; }
        .sidebar { background: #0f172a; transition: all 0.3s; }
        .glass-card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .glass-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .status-pill { padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .mini-stat { background: #e2e8f0; padding: 4px 15px; border-radius: 12px; font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .img-preview { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; border: 2px solid #3b82f6; cursor: pointer; }
        /* VIEWER MODAL */
        #viewerModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { max-width: 90%; max-height: 90%; position: relative; }
        .btn-status { transition: 0.2s; filter: grayscale(1); opacity: 0.6; }
        .btn-status.active { filter: grayscale(0); opacity: 1; transform: scale(1.1); }
        * { text-decoration: none !important; } /* REMOVE ALL UNDERLINES */
    </style>
</head>
<body class="flex min-h-screen">

    <!-- VIEWER MODAL (SOLUSI BLANK) -->
    <div id="viewerModal" onclick="this.style.display='none'">
        <div class="modal-content text-center">
            <img id="imgFull" src="" class="rounded-2xl border-4 border-white shadow-2xl mx-auto mb-4" style="max-height: 80vh;">
            <button class="bg-white text-slate-900 px-8 py-3 rounded-full font-black text-sm">TUTUP DOKUMEN</button>
        </div>
    </div>

    <!-- SIDEBAR ARSITEKTUR S.KOM -->
    <aside class="sidebar w-64 fixed h-full flex flex-col p-6 text-white hidden md:flex">
        <div class="flex items-center gap-3 mb-10 border-b border-slate-800 pb-6">
            <img src="./logo_malra.png" alt="Malra" class="h-10 w-auto">
            <div>
                <p class="font-black text-sm leading-none">SiAPP <span class="text-blue-500">MAS</span></p>
                <p class="text-[8px] opacity-50 tracking-widest mt-1">OFFICIAL HUB</p>
            </div>
        </div>

        <nav class="space-y-4 flex-1">
            <div class="p-4 bg-blue-600/10 rounded-2xl flex items-center gap-3 text-blue-400">
                <i class="fas fa-th-large"></i> <span class="text-xs font-black italic">DATABASE COMMAND</span>
            </div>
        </nav>

        <!-- Nama Anda di Pojok Kiri Bawah (Fixed Cerah) -->
        <div class="mt-auto border-t border-slate-800 pt-6">
            <p class="text-[8px] text-blue-400 font-bold mb-1">CHIEF AUDITOR :</p>
            <p class="font-black text-xs tracking-tight italic">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[7px] opacity-40 uppercase tracking-tighter">Auditor Ahli Pertama Malra @ 2026</p>
            <button id="btnLogout" class="w-full mt-6 bg-red-950/50 hover:bg-red-600 text-red-500 hover:text-white py-3 rounded-xl text-[9px] font-black transition-all border border-red-900/50 uppercase">Terminate Session</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 md:ml-64 p-4 md:p-10">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
            <div>
                <p class="text-[10px] font-bold text-slate-400 mb-1" id="currentDateDisplay">SABTU, 24 MEI 2026</p>
                <div class="flex items-center gap-4">
                    <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tighter italic uppercase">Portal Kendali Audit</h2>
                    
                    <!-- PENGECUTAN KOLOM STATISTIK (SLIM MODE) -->
                    <div class="flex gap-2">
                        <div class="mini-stat border border-blue-200 bg-blue-50 text-blue-600"><i class="fas fa-database text-[10px]"></i> <span id="stat_total">0</span></div>
                        <div class="mini-stat border border-orange-200 bg-orange-50 text-orange-600"><i class="fas fa-bolt text-[10px]"></i> <span id="stat_pending">0</span></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- SEARCH ENGINE -->
        <div class="mb-8 flex gap-4">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-5 top-4 text-slate-400"></i>
                <input type="text" id="searchAduan" placeholder="MASUKKAN TICKET ID UNTUK INVESTIGASI DATA..." class="w-full bg-white border border-slate-200 py-4 pl-12 pr-6 rounded-2xl text-xs font-bold outline-none focus:border-blue-500 shadow-sm uppercase italic">
            </div>
        </div>

        <!-- ADUAN FEED LIST -->
        <div id="mainFeed" class="space-y-6">
            <div class="flex flex-col items-center py-20 text-slate-300">
                <i class="fas fa-satellite-dish text-5xl mb-4 animate-pulse"></i>
                <p class="text-[10px] font-black tracking-widest italic uppercase">Syncing to Central Government Server...</p>
            </div>
        </div>

        <p class="text-center text-[7px] text-slate-400 mt-20 font-bold opacity-30 italic">ARCHITECTURE SECURED BY : INSPEKTORAT MALUKU TENGGARA S-DKC.26</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = {
            apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc",
            authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com",
            projectId: "siapp-mas-malra-aa6c4",
            storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app",
            messagingSenderId: "18948056709",
            appId: "1:18948056709:web:6c5877826c206ac2e6ebec"
        };
        const app = initializeApp(config); const db = getFirestore(app);

        // DATA HANDLER
        const feedEl = document.getElementById('mainFeed');
        const stTotal = document.getElementById('stat_total');
        const stPending = document.getElementById('stat_pending');

        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
            feedEl.innerHTML = "";
            let total = snap.size;
            let pending = 0;
            
            snap.forEach(laporan => {
                const data = lapor.data();
                const id = lapor.id;
                if(data.status !== "SELESAI") pending++;

                const tgl = data.timestamp ? new Date(data.timestamp.seconds*1000).toLocaleDateString('id-ID',{day:'numeric',month:'short'}) : "...";

                const card = `
                    <div class="glass-card p-6 flex flex-col md:flex-row gap-6 items-start relative overflow-hidden shadow-sm">
                        <!-- Tgl & Status Float -->
                        <div class="absolute right-6 top-6 flex flex-col items-end">
                            <span class="text-[9px] font-black text-slate-300 italic mb-2 uppercase">${tgl}</span>
                            <span class="status-pill ${getStatusColor(data.status)}">${data.status}</span>
                        </div>

                        <!-- Evidences -->
                        <div class="flex flex-row md:flex-col gap-2 mt-2">
                            <img src="${data.face}" class="img-preview shadow-sm" onclick="showBig('${data.face}')" title="Scan Wajah Biometrik">
                            <div class="img-preview flex items-center justify-center bg-slate-900 text-white" onclick="showBig('${data.doc_archive}')" title="Berkas Pengaduan">
                                <i class="fas fa-file-invoice text-xs"></i>
                            </div>
                        </div>

                        <!-- Content Detail -->
                        <div class="flex-1 space-y-3 pr-20">
                            <h4 class="text-[9px] text-blue-600 font-black italic tracking-widest uppercase">INVESTIGASI TICKET : ${data.ticket_id}</h4>
                            <h3 class="text-lg font-black text-slate-800 leading-tight uppercase italic font-sans">${data.kat}</h3>
                            <p class="text-[11px] font-black text-slate-500 uppercase flex gap-3 italic">
                                <span class="border-r pr-3"><i class="fas fa-user-circle mr-1"></i> ${data.pelapor_nama}</span>
                                <span><i class="fas fa-map-marker-alt mr-1 text-red-500"></i> ${data.kec} • OHOI ${data.vill}</span>
                            </p>
                        </div>

                        <!-- Actions Controls (Update Status Tuntas) -->
                        <div class="w-full md:w-48 pt-4 md:pt-0 flex flex-col gap-2 border-t md:border-t-0 md:border-l border-slate-100 pl-0 md:pl-6">
                             <p class="text-[8px] font-black text-slate-400 italic mb-2">UPDATE AUDIT PROCESS :</p>
                             <div class="grid grid-cols-2 gap-2">
                                <button onclick="setStatus('${id}','DIVERIFIKASI')" class="text-[8px] bg-indigo-100 text-indigo-700 py-2 rounded-lg font-bold">VERIFIKASI</button>
                                <button onclick="setStatus('${id}','DIPROSES')" class="text-[8px] bg-amber-100 text-orange-700 py-2 rounded-lg font-bold">DIPROSES</button>
                                <button onclick="setStatus('${id}','SELESAI')" class="text-[8px] bg-emerald-100 text-emerald-700 py-2 rounded-lg font-bold col-span-2">SELESAIKAN KASUS</button>
                             </div>
                             <a href="https://wa.me/${data.wa}" target="_blank" class="w-full mt-2 border border-slate-200 text-slate-800 text-[8px] font-black py-2 rounded-lg text-center bg-slate-50"><i class="fab fa-whatsapp mr-1 text-green-500"></i> RESPON WA PELAPOR</a>
                        </div>
                    </div>
                `;
                feedEl.innerHTML += card;
            });
            stTotal.innerText = total;
            stPending.innerText = pending;
        });

        window.setStatus = async (id, stat) => {
            if(confirm("TETAPKAN STATUS MENJADI "+stat+"?")){
                await updateDoc(doc(db, "pengaduan", id), { status: stat });
            }
        };

        window.showBig = (src) => {
            if(!src) { alert("ERROR : DOKUMEN FISIK TIDAK ADA DALAM DATABASE!"); return; }
            document.getElementById('imgFull').src = src;
            document.getElementById('viewerModal').style.display = 'flex';
        }

        function getStatusColor(s){
            switch(s){
                case 'SELESAI': return 'bg-emerald-100 text-emerald-600';
                case 'DIPROSES': return 'bg-amber-100 text-orange-600';
                case 'DIVERIFIKASI': return 'bg-blue-100 text-blue-600';
                default: return 'bg-rose-100 text-red-600';
            }
        }

        // AUTO DATE
        const n = new Date();
        document.getElementById('currentDateDisplay').innerText = n.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).toUpperCase();

        document.getElementById('btnLogout').onclick = () => location.href = "index.html";

        // SEARCH ENGINE S.KOM LOGIC
        document.getElementById('searchAduan').oninput = (e) => {
            const v = e.target.value.toUpperCase();
            document.querySelectorAll('.glass-card').forEach(c => {
                const t = c.innerText.toUpperCase();
                c.style.display = t.includes(v) ? 'flex' : 'none';
            });
        };
    </script>
</body>
</html>
