<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINAL DASHBOARD | Arsitektur S.Kom Malra Secured</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000a1f; color: #ffffff; margin: 0; overflow-x: hidden; }
        /* PINTU MASUK KEAMANAN */
        #loginWall { position: fixed; inset: 0; background: #000a1f; z-index: 1000000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; width: 100%; max-width: 420px; border-bottom: 12px solid #3b82f6; border-radius: 3.5rem; text-align: center; }
        
        /* SISTEM KENDALI UTAMA */
        #mainPortal { display: none; background: #f1f5f9; color: #1e293b; min-height: 100vh; }
        .side-master { background: #000a1f; border-right: 4px solid #3b82f6; width: 290px; height: 100vh; position: fixed; z-index: 50; }
        .row-matrix-final { background: #ffffff; border-bottom: 2.5px solid #e2e8f0; cursor: pointer; border-left: 10px solid transparent; transition: 0.2s; }
        .row-matrix-final:hover { background: #fdfdfd; border-left-color: #3b82f6; transform: scale(1.002); }
        .panel-inspect { display: none; background: #ffffff; border-bottom: 5px solid #cbd5e1; }
        
        /* PUSAT PENAMPIL DATA (MODAL VIEWER) */
        #modalViewerFinale { position: fixed; inset: 0; background: rgba(0,0,0,1); z-index: 999999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(25px); padding: 15px; }
        .if-final { width: 92vw; height: 82vh; border-radius: 1.5rem; background: white; border: none; }
        .im-final { max-height: 75vh; max-width: 90vw; border-radius: 2rem; border: 8px solid white; shadow: 2xl; object-fit: contain; }

        .font-audit-heavy { color: #000000 !important; font-weight: 900 !important; }
        .btn-tabs { background: white; border: 2.5px solid #e2e8f0; color: #64748b; padding: 12px 26px; border-radius: 99px; font-weight: 900; font-size: 11px; transition: 0.3s; text-transform: uppercase; }
        .btn-tabs.f-active { background: #0ea5e9 !important; border-color: #0ea5e9 !important; color: white !important; box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4); }
        
        /* PULSE ALARM */
        .ping-new { width: 15px; height: 12px; background: #ef4444; border-radius: 50%; animation: pings 1.5s infinite; border: 2px solid white; }
        @keyframes pings { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="min-h-screen font-black uppercase italic">

    <!-- THE PINTU GERBANG (S-DKC LOGIC) -->
    <div id="loginWall">
        <div class="login-card shadow-2xl border-4 border-slate-900 animate-in fade-in duration-500">
             <img src="./logo_malra.png" class="h-24 mx-auto mb-6">
             <h2 class="text-xl font-black text-slate-800 uppercase italic">HUB AKSES TERKUNCI</h2>
             <p class="text-[9px] text-blue-600 font-bold mb-10 tracking-[0.2em]">IDENTITAS ARSITEKTUR DIGITAL MALRA</p>
             <div class="space-y-4">
                  <input type="text" id="userInput" placeholder="USER ID" class="w-full bg-slate-50 border-2 border-slate-200 p-5 rounded-[2rem] text-center text-lg font-black text-slate-900 outline-none uppercase italic focus:border-blue-500">
                  <input type="password" id="passInput" placeholder="AUTH CODE" class="w-full bg-slate-50 border-2 border-slate-200 p-5 rounded-[2rem] text-center text-lg font-black text-slate-900 outline-none focus:border-blue-500 tracking-[0.5em]">
                  <button id="authBtn" class="w-full bg-blue-600 text-white font-black py-6 rounded-full text-sm uppercase italic mt-8 shadow-2xl tracking-[0.3em] active:scale-95 transition-all">BUKA AKSES SISTEM <i class="fas fa-fingerprint ml-2"></i></button>
             </div>
        </div>
    </div>

    <!-- UTAMA DASHBOARD -->
    <div id="mainPortal" class="flex min-h-screen">
        <aside class="side-master p-6 text-white hidden lg:flex flex-col">
            <div class="text-center border-b-4 border-blue-600 pb-10 mb-8">
                <img src="./logo_malra.png" alt="Malra" class="h-32 w-auto mb-6 mx-auto scale-110">
                <h1 class="text-xl">SiAPP <span class="text-blue-500 italic">MAS</span></h1>
                <p class="text-[7px] text-blue-300 opacity-60 tracking-widest mt-2 uppercase">Integrity Commander</p>
            </div>
            <div class="flex-1 overflow-y-auto" id="areaTracking"></div>
            <div class="mt-auto border-t-2 border-slate-700 pt-8 lowercase font-sans">
                <p class="text-[10px] text-blue-500 font-black mb-3 uppercase italic">COMMANDER AUTHENTICATED :</p>
                <p class="text-lg font-black uppercase text-white leading-tight">FIRDAUS SETITIT, S.KOM</p>
                <p class="text-[9px] text-blue-400 font-bold mt-1 uppercase italic tracking-tighter">AUDITOR AHLI PRATAMA MALRA @ 2026</p>
                <button onclick="location.reload()" class="w-full mt-10 bg-slate-800 border-2 border-red-800 text-red-500 py-3.5 rounded-3xl text-[9px] font-black uppercase hover:bg-red-700 hover:text-white shadow-xl transition-all">Sign-Out Commander</button>
            </div>
        </aside>

        <main class="flex-1 lg:ml-[290px] p-4 lg:p-10 italic">
            <header class="flex flex-col lg:flex-row justify-between lg:items-end gap-8 mb-12 border-b-4 border-slate-900 pb-10 uppercase font-black">
                <div>
                    <p class="text-[12px] text-blue-600 mb-2 font-sans font-bold" id="headerDate"></p>
                    <div class="flex items-center gap-10">
                        <h2 class="text-3xl text-black italic">Matrix Laporan Digital</h2>
                        <div class="flex gap-4 font-sans italic">
                            <div class="bg-black text-white px-8 py-3 rounded-2xl text-[10.5px]">RECORD : <span id="log_tot">0</span></div>
                            <div class="bg-red-700 text-white px-8 py-3 rounded-2xl text-[10.5px] animate-pulse shadow-xl shadow-red-200">LIVE : <span id="log_act">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="relative lg:w-96"><i class="fas fa-search absolute left-5 top-5 text-blue-600"></i><input type="text" id="engineCek" placeholder="SEARCH IDENTITY..." class="w-full bg-white border-4 border-black p-5 pl-14 rounded-[3rem] text-[12px] font-black italic shadow-inner outline-none"></div>
            </header>

            <div class="flex flex-wrap gap-4 mb-10" id="filterSystem">
                 <button onclick="fExecute('ALL')" class="btn-tabs f-active">DAFTAR SELURUH ADUAN</button>
                 <button onclick="fExecute('Dana Desa')" class="btn-tabs">DANA DESA</button>
                 <button onclick="fExecute('Dana BOS')" class="btn-tabs">DANA BOS/PAUD</button>
                 <button onclick="fExecute('BOK Puskesmas')" class="btn-tabs">BOK PUSKESMAS</button>
                 <button onclick="fExecute('PBJ')" class="btn-tabs">PBJ KANTOR</button>
            </div>

            <div id="dataFlowContainer" class="divide-y-4 divide-slate-100 rounded-[4rem] overflow-hidden border-[6px] border-slate-900 bg-white shadow-2xl min-h-[50vh]">
                 <div class="p-40 text-center text-xl font-bold opacity-10">Transmitting Governance Intel Link...</div>
            </div>
        </main>
    </div>

    <!-- PENAMPIL DATA (FIXED CLONE) -->
    <div id="modalViewerFinale" onclick="this.style.display='none'">
        <div id="canvasSurface" class="flex flex-col items-center justify-center w-full h-full relative" onclick="event.stopPropagation()">
            <!-- System logic inside here -->
        </div>
    </div>

    <audio id="intelAudio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        // SECURE LOGIN LOKED
        const gateUI = document.getElementById('loginWall'), dashUI = document.getElementById('mainPortal');
        document.getElementById('authBtn').onclick = () => {
            const u = document.getElementById('userInput').value, p = document.getElementById('passInput').value;
            if(u === 'itkabmalra1' && p === 'itkabmalra01') { gateUI.style.display='none'; dashUI.style.display='flex'; runRealtimeSync(); }
            else { alert("ERROR 403: IDENTITAS AUDITOR DITOLAK!"); }
        };

        function runRealtimeSync() {
            let lastV = -1;
            onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
                const el=document.getElementById('dataFlowContainer'); const m=document.getElementById('areaTracking');
                el.innerHTML=""; m.innerHTML="";
                let t=snap.size, a=0, kcM={};
                if(lastV !== -1 && t > lastV) document.getElementById('intelAudio').play();
                lastV=t;

                snap.forEach(ds => {
                    const d=ds.data(); const cid=ds.id; kcM[d.kec]=(kcM[d.kec]||0)+1; if(d.status!=="SELESAI") a++;
                    el.innerHTML += `
                    <div class="item-f-hook" data-c="${d.kat}">
                        <div class="row-matrix-final grid lg:grid-cols-12 items-center gap-10 p-12 py-5" onclick="togDetailed('${cid}')">
                             <div class="col-span-1" onclick="event.stopPropagation(); enginePop('${d.face}')"><img src="${d.face}" class="w-20 h-20 rounded-3xl border-4 border-white shadow-xl object-cover hover:scale-110 transition-transform"></div>
                             <div class="col-span-3 border-l-4 px-6 border-slate-50"><p class="text-[9px] text-blue-700 italic font-black">AUDIT-TICKET: ${d.ticket_id}</p><h4 class="text-xl font-black text-slate-800 leading-tight">${d.kat.toUpperCase()}</h4></div>
                             <div class="col-span-6 border-x-4 px-8 border-slate-50 flex flex-col justify-center">
                                  <h5 class="font-audit-heavy text-[2.5rem] tracking-tighter leading-none italic uppercase truncate mb-1">${d.pelapor_nama}</h5>
                                  <p class="font-audit-heavy text-xl opacity-30 leading-none">MOB: ${d.wa}</p>
                                  <p class="font-audit-heavy text-lg mt-2 text-blue-900 font-sans tracking-tight">KEC: ${d.kec.toUpperCase()} • ${d.vill.toUpperCase()}</p>
                             </div>
                             <div class="col-span-2 text-right">
                                  <span class="inline-block py-2 px-10 rounded-full font-black text-xs border-4 shadow-xl italic uppercase ${d.status==='SELESAI'?'bg-emerald-600 text-white border-white':'bg-red-600 text-white border-white animate-pulse'}">${d.status}</span>
                             </div>
                        </div>

                        <div id="xpnd_${cid}" class="panel-inspect p-12">
                             <div class="grid lg:grid-cols-12 gap-14 font-black italic">
                                  <div class="col-span-3 flex flex-col items-center gap-8">
                                       <img src="${d.face}" class="rounded-[4rem] border-[10px] border-white shadow-2xl transition-all cursor-zoom-in" onclick="event.stopPropagation(); enginePop('${d.face}')">
                                       <button onclick="event.stopPropagation(); enginePop('${d.doc_archive}')" class="w-full bg-slate-950 text-blue-400 p-8 rounded-full shadow-2xl border-b-[15px] border-black text-xs hover:brightness-150 uppercase tracking-widest active:translate-y-5">LIHAT INVESTIGASI SURAT FISIK <i class="fas fa-barcode"></i></button>
                                  </div>
                                  <div class="col-span-6 bg-white p-12 rounded-[5rem] shadow-2xl border-t border-l border-slate-100 text-center">
                                       <label class="text-[12px] text-blue-700 mb-8 block underline decoration-4 decoration-blue-100 font-black">PESAN COMMANDER UNTUK PUBLIK :</label>
                                       <textarea id="notedX_${cid}" onclick="event.stopPropagation()" class="w-full h-44 bg-slate-50 border-4 border-dashed rounded-[3rem] p-10 text-[26px] font-black italic text-black outline-none shadow-inner focus:bg-white">${d.note || ""}</textarea>
                                       <button onclick="event.stopPropagation(); syncNowGate('${cid}')" class="w-full mt-10 bg-emerald-600 border-b-[15px] border-emerald-950 text-white py-6 rounded-full font-black text-[15px] uppercase tracking-widest active:scale-95 animate-pulse shadow-emerald-100 shadow-xl">SINKRONKAN KOMANDO AUDITOR ✅</button>
                                  </div>
                                  <div class="col-span-3 pt-10 uppercase italic">
                                       <p class="text-[10px] opacity-100 text-black border-l-8 border-red-600 pl-4 mb-6">Peralihan Audit :</p>
                                       <button onclick="event.stopPropagation(); pushU('${cid}','DIVERIFIKASI')" class="w-full border-4 border-blue-50 py-5 rounded-full text-lg font-black text-blue-600 mb-5">DIVERIFIKASI</button>
                                       <button onclick="event.stopPropagation(); pushU('${cid}','DIPROSES')" class="w-full border-4 border-amber-50 py-5 rounded-full text-lg font-black text-orange-900 mb-16">PROSES AUDIT</button>
                                       <button onclick="event.stopPropagation(); pushU('${cid}','SELESAI')" class="w-full bg-slate-900 text-emerald-400 py-10 rounded-[5rem] font-black text-3xl shadow-2xl shadow-emerald-100/50 mt-10">MARK DONE ✅</button>
                                  </div>
                             </div>
                        </div>
                    </div>`;
                });
                Object.keys(kcM).sort().forEach(nm=>m.innerHTML += `<div class="flex items-center justify-between p-4 mb-1 hover:bg-blue-600 rounded-3xl transition-all italic px-6"><span class="text-xs text-white">${nm}</span><span class="bg-blue-600 border border-white/20 text-[9px] px-3 py-1 rounded-full text-white">${kcM[nm]} ADT</span></div>`);
                document.getElementById('ui_tot' || 'log_tot').innerText = t; document.getElementById('ui_act' || 'log_act').innerText = a;
            });
        }

        window.fExecute=(k)=>{
            document.querySelectorAll('.btn-tabs').forEach(b=>{ if(b.innerText.includes(k.toUpperCase())||(k==='ALL'&&b.innerText.includes('SELURUH'))) b.classList.add('f-active'); else b.classList.remove('f-active'); });
            document.querySelectorAll('.item-f-hook').forEach(e => e.style.display=(k==='ALL'||e.getAttribute('data-c')===k)?'block':'none');
        };

        window.togDetailed=(i)=>{ const e=document.getElementById('xpnd_'+i); e.style.display = e.style.display==='block'?'none':'block'; };
        window.pushU=async(i,s)=>{ if(confirm("OTORISASI PROSES?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        window.syncNowGate=async(i)=>{ const m=document.getElementById('notedX_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("PUBLIKASI BERHASIL!"); };
        
        // --- THE ONLY VIEWER LOGIC - FIXING RED BUTTON ACTION (POIN 1-2) ---
        window.enginePop=(url)=>{
            if(!url) return;
            const target = document.getElementById('renderSurface' || 'canvasSurface');
            target.innerHTML = "";
            const isP = (url.includes("pdf") || url.includes("blob:"));
            if(isP) {
                target.innerHTML = `
                <div class="bg-white p-5 rounded-[4rem] shadow-2xl flex flex-col items-center animate-in zoom-in duration-500">
                    <iframe src="${url}" class="if-final shadow-inner border-2"></iframe>
                    <button onclick="document.getElementById('modalViewerFinale').style.display='none'" class="w-full mt-10 bg-red-700 text-white font-black py-8 rounded-full text-3xl uppercase italic tracking-tighter shadow-2xl active:translate-y-5 border-b-[20px] border-red-900">KELUAR & TUTUP INVESTIGASI PDF (EXIT)</button>
                </div>`;
            } else {
                target.innerHTML = `
                <div class="flex flex-col items-center p-2 text-center animate-in scale-in duration-300">
                    <img src="${url}" class="im-final mb-12 shadow-[0_0_200px_rgba(59,130,246,0.3)] border-[15px] border-white">
                    <button onclick="document.getElementById('modalViewerFinale').style.display='none'" class="bg-blue-600 text-white px-48 py-10 rounded-full font-black text-4xl shadow-[0_30px_60px_rgba(0,0,0,0.4)] border-b-[20px] border-blue-900 active:scale-90 transition-all uppercase italic tracking-[0.4em]">KELUAR SEKARANG (EXIT)</button>
                </div>`;
            }
            document.getElementById('modalViewerFinale').style.display='flex';
        };

        const rtD=new Date(); document.getElementById('headerDate' || 'clockD').innerText=rtD.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()+" • COMMAND PANEL ENCRYPTED";
        document.getElementById('findC' || 'engineCek').oninput=(e)=>{ const v=e.target.value.toUpperCase(); document.querySelectorAll('.row-matrix-final').forEach(r=>{ r.style.display=r.innerText.toUpperCase().includes(v)?'grid':'none'; }); };
    </script>
</body>
</html>
