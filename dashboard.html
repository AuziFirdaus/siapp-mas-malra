<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiAPP MAS | Digital Auditor Command Center Malra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #1e293b; overflow-x: hidden; }
        .sidebar { background: #0f172a; border-right: 2px solid #334155; }
        
        /* CARD MODERNI (NO UNDERLINE, NO ABU-ABU) */
        .case-card { 
            background: white; 
            border-radius: 2rem; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
        }
        .case-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); border-color: #3b82f6; }
        .priority-alert { background: #fff5f5; border-color: #fecaca; border-left: 10px solid #ef4444; }
        
        /* STATUS SYSTEM */
        .status-capsule { padding: 6px 16px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
        .bg-complete { background: #dcfce7; color: #065f46; border: 1px solid #059669; }
        .bg-process { background: #fef9c3; color: #854d0e; border: 1px solid #ca8a04; }
        .bg-verified { background: #dbeafe; color: #1e40af; border: 1px solid #2563eb; }

        /* VIEWERS */
        #viewerOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); padding: 10px; }
        iframe.doc-frame { width: 85vw; height: 85vh; border-radius: 1.5rem; background: white; border: 10px solid #1e293b; }
        img.img-frame { max-height: 85vh; max-width: 90vw; border-radius: 1.5rem; border: 5px solid white; box-shadow: 0 0 100px rgba(0,0,0,0.5); }

        textarea.note-editor { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 1.5rem; padding: 20px; font-weight: 600; font-size: 13px; color: #0f172a; resize: none; width: 100%; transition: 0.3s; }
        textarea.note-editor:focus { border-color: #3b82f6; background: white; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- MASTER EVIDENCE VIEWER (SOLUSI BLANK) -->
    <div id="viewerOverlay" onclick="this.style.display='none'">
        <div id="viewerBox" class="flex flex-col items-center gap-6"></div>
    </div>

    <!-- SIDEBAR AUDITORS MALRA -->
    <aside class="sidebar w-72 fixed h-full flex flex-col p-8 text-white hidden lg:flex font-black uppercase italic shadow-2xl">
        <div class="flex items-center gap-4 mb-12 pb-10 border-b border-slate-800">
            <img src="./logo_malra.png" alt="LogMalra" class="h-14 w-auto brightness-125">
            <div><h1 class="text-xl leading-none">SiAPP <span class="text-blue-500">MAS</span></h1><p class="text-[7px] tracking-[0.3em] opacity-40 mt-1.5 font-sans not-italic">Integrity Portal System</p></div>
        </div>

        <div class="flex-1 space-y-6 overflow-y-auto pr-2 custom-scrollbar">
            <div>
                <p class="text-[9px] text-blue-400 font-bold mb-5 tracking-widest px-2"><i class="fas fa-map-marked-alt mr-2"></i> PETA PEMETAAN KASUS :</p>
                <div id="sideMapping" class="space-y-2 bg-slate-900/60 p-3 rounded-3xl border border-slate-800 shadow-inner">
                    <p class="text-[8px] p-5 opacity-20 text-center uppercase tracking-widest">Collecting Maps...</p>
                </div>
            </div>
        </div>

        <div class="mt-auto pt-10 border-t border-slate-800 not-italic">
            <p class="text-[9px] text-blue-500 font-black mb-3 uppercase tracking-widest italic underline decoration-transparent">Primary Auditor Sah :</p>
            <p class="text-md font-black uppercase tracking-tight text-white italic leading-tight">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[8px] opacity-40 mt-1 uppercase font-bold tracking-[0.1em]">Auditor Ahli Pratama MALRA @ 2026</p>
            <button onclick="location.href='index.html'" class="w-full mt-10 bg-slate-800 border border-slate-700 text-red-400 py-4 rounded-2xl text-[9px] uppercase font-black hover:bg-red-800 hover:text-white transition-all">Selesaikan Sesi Portal</button>
        </div>
    </aside>

    <main class="flex-1 lg:ml-72 p-6 lg:p-12 font-black italic">
        <!-- HEADER DIGITAL CENTER -->
        <header class="flex flex-col md:flex-row justify-between md:items-end gap-10 mb-20 border-b-4 border-white pb-12 shadow-sm bg-white rounded-[3rem] p-10">
            <div class="text-left">
                <div class="flex items-center gap-3 mb-2">
                    <span class="w-10 h-[2px] bg-red-600"></span>
                    <p class="text-[11px] text-slate-400 font-sans tracking-[0.2em] uppercase font-bold" id="txtTgl"></p>
                </div>
                <h2 class="text-5xl text-slate-900 leading-none uppercase tracking-tighter">MEJA KERJA <span class="text-blue-600">KOMANDO</span></h2>
                <div class="flex gap-3 mt-6">
                    <div class="bg-blue-600 text-white px-6 py-2.5 rounded-2xl text-[12px] font-black uppercase shadow-lg"><i class="fas fa-file-invoice mr-2 opacity-50"></i> RECORD : <span id="val_t">0</span></div>
                    <div class="bg-slate-900 text-white px-6 py-2.5 rounded-2xl text-[12px] font-black uppercase shadow-lg"><i class="fas fa-satellite mr-2 text-emerald-400 animate-pulse"></i> AKTIF : <span id="val_a">0</span></div>
                </div>
            </div>
            <div class="relative lg:w-[420px] group">
                <i class="fas fa-id-card-clip absolute left-5 top-5.5 text-blue-600 text-lg group-hover:scale-125 transition-transform duration-500"></i>
                <input type="text" id="engineS" placeholder="CARI DATA BY TICKET ATAU NAMA..." class="w-full bg-slate-100 border-none p-5.5 pl-14 rounded-3xl text-[12px] font-black uppercase shadow-inner outline-none transition-all focus:bg-white focus:ring-4 focus:ring-blue-100">
            </div>
        </header>

        <!-- DATABASE TABLE (THE ULTIMATE CARDS) -->
        <div id="masterFeedAudit" class="space-y-8">
             <!-- Placeholder Connection -->
             <div class="p-32 text-center opacity-10 flex flex-col items-center">
                 <i class="fas fa-microchip text-7xl mb-5 animate-spin duration-[3000ms]"></i>
                 <p class="text-2xl uppercase font-black">Syncing Integrated Malra Hub...</p>
             </div>
        </div>

        <footer class="mt-28 mb-12 flex flex-col items-center opacity-10 font-black text-[10px] tracking-[0.6em] text-slate-600 uppercase">
             <span>ARCHIVE MANAGEMENT SYSTEMS v.FINAL-F8</span>
             <span class="mt-4 border-t-2 border-slate-900 w-64 block"></span>
        </footer>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        // DATA CONTROLLER MASTER
        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (sn) => {
            const feed = document.getElementById('masterFeedAudit'); const maps = document.getElementById('sideMapping');
            feed.innerHTML = ""; maps.innerHTML = "";
            let t = sn.size, a = 0, dictMap = {};

            sn.forEach(docSnap => {
                const d = docSnap.data(); const cid = docSnap.id;
                dictMap[d.kec] = (dictMap[d.kec] || 0) + 1; if(d.status !== "SELESAI") a++;
                const isCrit = (d.kat === "Dana Desa" || d.kat === "PBJ");
                
                feed.innerHTML += `
                <div id="row_${cid}">
                    <div class="case-card p-10 py-7 grid lg:grid-cols-12 items-center gap-10 ${isCrit?'priority-alert':''}" onclick="masterExp('${cid}')">
                        <div class="col-span-1"><img src="${d.face}" class="w-16 h-16 rounded-[1.3rem] shadow-xl border-4 border-white object-cover ring-2 ring-blue-50"></div>
                        <div class="col-span-3 border-l-2 border-slate-100 pl-8 leading-tight">
                            <p class="text-[9px] text-blue-600 font-bold mb-1 uppercase font-sans tracking-widest">IDENTITI: ${d.ticket_id}</p>
                            <h4 class="text-[13px] font-extrabold uppercase text-slate-900 italic font-sans">${d.kat}</h4>
                        </div>
                        <div class="col-span-3 text-[14px] font-extrabold text-slate-800 tracking-tight">${d.pelapor_nama.toUpperCase()}</div>
                        <div class="col-span-3 text-[11px] font-black text-blue-900 px-3 py-1 bg-slate-50 rounded-xl w-fit uppercase">KEC. ${d.kec}</div>
                        <div class="col-span-2 text-right">
                             <span class="status-capsule ${stStyle(d.status)}">${d.status}</span>
                             <i class="fas fa-angles-down ml-6 text-slate-200 text-xs"></i>
                        </div>
                    </div>

                    <!-- REKAYASA DETAIL EXPANSION (STRICT S.KOM LOCK) -->
                    <div id="panel_${cid}" class="hidden py-14 px-10 bg-white mt-1 border-2 border-slate-50 rounded-[3rem] shadow-2xl italic font-black uppercase">
                        <div class="grid lg:grid-cols-12 gap-12 items-start">
                            <div class="col-span-3 space-y-6">
                                <p class="text-[10px] text-slate-400 italic mb-5 tracking-[0.2em] px-1 text-center">BIOMETRIC EVIDENCE</p>
                                <img src="${d.face}" class="rounded-[2.8rem] border-8 border-slate-50 shadow-2xl cursor-zoom-in" onclick="event.stopPropagation(); zoomRes('${d.face}')">
                                <button onclick="event.stopPropagation(); zoomRes('${d.doc_archive}')" class="w-full bg-slate-950 border-b-8 border-black text-white p-6 rounded-[2rem] text-[10px] font-bold shadow-2xl flex items-center justify-center gap-4 transition-all hover:scale-105 active:translate-y-2"><i class="fas fa-file-magnifying-glass text-blue-400"></i> BUKA DOKUMEN TERTULIS</button>
                            </div>
                            <div class="col-span-6 space-y-6">
                                <div class="bg-blue-50/50 p-10 rounded-[3.2rem] border border-blue-100 shadow-inner">
                                    <label class="text-[10px] text-blue-600 block mb-4 italic tracking-widest"><i class="fas fa-reply mr-2"></i> KOLOM INSTRUKSI & CATATAN AUDITOR :</label>
                                    <textarea id="nt_${cid}" onclick="event.stopPropagation()" class="note-editor h-48 mb-8" placeholder="Berikan arahan untuk Pelapor di sini...">${d.note || ""}</textarea>
                                    <button onclick="event.stopPropagation(); svLog('${cid}')" class="w-full bg-blue-600 border-b-4 border-blue-900 text-white py-5 rounded-[2.2rem] text-[11px] font-black uppercase shadow-xl shadow-blue-200">SINKRONISASI PESAN KEPADA PELAPOR ✅</button>
                                </div>
                            </div>
                            <div class="col-span-3 space-y-5">
                                <p class="text-[10px] opacity-20 italic font-black text-center mb-6">ADMINISTRASI TAHAP AUDIT</p>
                                <button onclick="event.stopPropagation(); stUP('${cid}','DIVERIFIKASI')" class="w-full bg-white border-2 border-blue-100 text-blue-600 py-4 rounded-3xl font-black text-[10px]">TANDAI: DIVERIFIKASI</button>
                                <button onclick="event.stopPropagation(); stUP('${cid}','DIPROSES')" class="w-full bg-white border-2 border-amber-100 text-orange-700 py-4 rounded-3xl font-black text-[10px]">TANDAI: DALAM PROSES</button>
                                <div class="pt-8">
                                     <button onclick="event.stopPropagation(); stUP('${cid}','SELESAI')" class="w-full bg-emerald-600 border-b-4 border-emerald-950 text-white py-6 rounded-[3rem] font-black text-[12px] shadow-2xl active:translate-y-3">ARSIP KASUS : SELESAI ✅</button>
                                     <a href="https://wa.me/${d.wa}" target="_blank" onclick="event.stopPropagation()" class="block text-center mt-8 text-[11px] text-emerald-500 font-sans font-bold underline underline-offset-4 decoration-transparent hover:decoration-emerald-500"><i class="fab fa-whatsapp"></i> Hubungi Langsung WhatsApp</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            Object.keys(dictMap).sort().forEach(k=> maps.innerHTML += `<div class="group flex items-center justify-between p-3.5 bg-slate-900 border border-slate-800/50 hover:bg-blue-700 rounded-2xl transition-all cursor-default mb-1"><span class="text-[8.5px] opacity-50 font-sans font-black uppercase text-blue-50 italic">${k}</span><span class="bg-blue-600 text-[8.5px] font-black text-white px-2 py-0.5 rounded-lg shadow-lg">${dictMap[k]} RECORD</span></div>`);
            document.getElementById('val_t').innerText = t; document.getElementById('val_a').innerText = a;
        });

        window.masterExp = (id) => { const el = document.getElementById('panel_'+id); el.style.display = el.style.display==='grid'?'none':'grid'; };
        window.svLog = async(id) => { const note = document.getElementById('nt_'+id).value; if(!note){alert("LOG PESAN KOSONG!");return;} await updateDoc(doc(db,"pengaduan",id),{note:note}); alert("LOG BERHASIL DI-TRANSFERS SECARA REAL-TIME!"); };
        window.stUP = async(id,s) => { if(confirm("PERBARUI STATUS KE "+s+"?")) await updateDoc(doc(db,"pengaduan",id),{status:s}); };
        
        window.zoomRes = (uri) => {
            if(!uri){alert("NO ARCHIVE DETECTED.");return;}
            const vB = document.getElementById('viewerBox'); vB.innerHTML = "";
            if(uri.includes("application/pdf") || uri.includes(";base64,JVBERi")){ 
                vB.innerHTML=`<iframe src="${uri}" class="doc-frame"></iframe><button class="bg-white px-10 py-4 rounded-full font-black text-xs text-red-600">TUTUP DOKUMEN INSPEKSI</button>`; 
            } else { 
                vB.innerHTML=`<img src="${uri}" class="img-frame shadow-2xl animate-in zoom-in-75 duration-300"><button class="bg-white px-10 py-4 rounded-full font-black text-xs text-blue-900 mt-6 shadow-2xl">KEMBALI KE MEJA KASUS</button>`; 
            }
            document.getElementById('viewerOverlay').style.display='flex';
        };

        function stStyle(s){ if(s==='SELESAI') return 'bg-complete shadow-md'; if(s==='DIPROSES') return 'bg-process'; return 'bg-verified'; }
        
        document.getElementById('engineS').oninput=(e)=>{
            const v = e.target.value.trim().toUpperCase();
            document.querySelectorAll('[id^="row_"]').forEach(el => el.style.display = el.innerText.toUpperCase().includes(v)?'block':'none');
        };

        const dy = new Date(); document.getElementById('txtTgl').innerText = dy.toLocaleDateString('id-ID', {weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();
    </script>
</body>
</html>
