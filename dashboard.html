<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiAPP MAS | Master Hub - Firdaus Setitit, S.Kom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfdfd; color: #1e293b; overflow-x: hidden; }
        .sidebar { background: #0f172a; border-right: 1px solid #1e293b; transition: 0.3s; }
        
        /* DATA DENSITY HIGH - COMPACT ROWS S.KOM */
        .case-row { background: #ffffff; border-bottom: 1.5px solid #f1f5f9; cursor: pointer; transition: 0.2s; border-left: 5px solid transparent; }
        .case-row:hover { background: #f8fafc; border-left-color: #3b82f6; }
        .urgent-red { background: #fff8f8 !important; border-left-color: #ef4444 !important; }
        
        .expand-panel { display: none; background: #fafcfe; border-bottom: 3px solid #cbd5e1; }
        
        /* THE DIGITAL EVIDENCE VIEWER */
        #evidenceModal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); padding: 15px; }
        .evidence-cont { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .evidence-cont img { max-height: 80vh; border: 4px solid white; border-radius: 2rem; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
        .evidence-cont iframe { width: 90vw; height: 85vh; border: none; border-radius: 1.5rem; background: white; }

        /* STATUS BADGE STYLE */
        .badge-s { padding: 4px 14px; border-radius: 99px; font-size: 8px; font-weight: 800; text-transform: uppercase; border: 1.2px solid transparent; }
        .bg-ok { background: #ecfdf5; color: #059669; border-color: #10b981; }
        .bg-proc { background: #fff7ed; color: #d97706; border-color: #fb923c; }
        .bg-view { background: #f8fafc; color: #3b82f6; border-color: #94a3b8; }

        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- FINAL VIEWER MODAL ENGINE (RESIK ANTI BLANK) -->
    <div id="evidenceModal" onclick="this.style.display='none'">
        <div class="evidence-cont" id="viewerLoader"></div>
    </div>

    <!-- SIDEBAR MASTER -->
    <aside class="sidebar w-64 fixed h-full flex flex-col p-7 text-white hidden lg:flex uppercase font-black italic">
        <div class="flex items-center gap-3 border-b border-slate-800 pb-8 mb-8">
            <img src="./logo_malra.png" alt="Malra" class="h-10 w-auto">
            <div><h1 class="text-sm">SiAPP <span class="text-blue-500 font-bold">MAS</span></h1><p class="text-[6.5px] tracking-widest mt-1 opacity-30 italic">investigation unit</p></div>
        </div>

        <div class="flex-1 overflow-y-auto pr-2 custom-scroll">
            <p class="text-[7.5px] text-blue-400 mb-5 tracking-[0.2em] font-bold">Geographic Audit Maps :</p>
            <div id="districtStats" class="space-y-1">
                 <!-- Generated Otomatis by AI -->
            </div>
        </div>

        <div class="mt-auto border-t border-slate-800 pt-8 lowercase font-sans">
            <p class="text-[8.5px] text-blue-500 mb-4 font-black italic uppercase tracking-widest">AUTHORIZED COMMANDER :</p>
            <p class="text-sm font-black italic text-slate-100 uppercase tracking-tighter leading-none">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[7.5px] opacity-40 mt-1 uppercase tracking-widest">AUDIT AHLI PRATAMA MALRA @ 2026</p>
            <button onclick="location.href='index.html'" class="w-full mt-10 bg-slate-900 border border-slate-800 text-slate-500 py-4 rounded-xl text-[8px] uppercase font-black transition-all hover:bg-red-800 hover:text-white">Secure Log-out</button>
        </div>
    </aside>

    <main class="flex-1 lg:ml-64 p-5 lg:p-12 font-black italic">
        <header class="flex flex-col md:flex-row justify-between md:items-end gap-10 mb-16 border-b border-slate-100 pb-10">
            <div>
                <p class="text-[10px] text-slate-400 mb-2 uppercase tracking-[0.1em] font-sans" id="dateBar"></p>
                <div class="flex items-center gap-6">
                    <h2 class="text-4xl text-slate-900 leading-none uppercase tracking-tighter">Command <span class="text-blue-600">Gateway</span></h2>
                    <div class="flex gap-2">
                        <div class="bg-blue-50 text-blue-700 px-5 py-2 rounded-xl text-[10px] border border-blue-100 uppercase italic">RECORDS : <span id="val_tot">0</span></div>
                        <div class="bg-red-50 text-red-700 px-5 py-2 rounded-xl text-[10px] border border-red-100 uppercase italic animate-pulse">ACTIVE : <span id="val_act">0</span></div>
                    </div>
                </div>
            </div>
            <div class="relative lg:w-96">
                <i class="fas fa-search absolute left-5 top-5 text-slate-300"></i>
                <input type="text" id="engineSearch" placeholder="SEARCH TICKET ID OR NAMA..." class="w-full bg-slate-50 border border-slate-100 p-4.5 pl-14 rounded-3xl text-[9px] font-black uppercase shadow-inner outline-none italic shadow-inner">
            </div>
        </header>

        <!-- DATA MATRIX -->
        <div id="masterFeed" class="divide-y rounded-[3.5rem] overflow-hidden border border-slate-200 bg-white shadow-2xl">
             <div class="p-32 text-center opacity-10">
                 <i class="fas fa-satellite text-6xl mb-4 animate-bounce"></i>
                 <p class="text-xl italic">Initialing Synchronized Connection...</p>
             </div>
        </div>

        <p class="text-center text-[7px] text-slate-200 mt-20 italic uppercase tracking-[0.5em] font-bold">Encrypted Archive Hub • Inspectorate Specialist v.Ultimate</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        // DATA REAL-TIME STREAMING
        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (s) => {
            const feed = document.getElementById('masterFeed'); const maps = document.getElementById('districtStats');
            feed.innerHTML = ""; maps.innerHTML = "";
            let t = s.size, p = 0, distMap = {};

            s.forEach(snap => {
                const d = snap.data(); const d_id = snap.id;
                distMap[d.kec] = (distMap[d.kec] || 0) + 1;
                if(d.status !== "SELESAI") p++;
                const isPriority = (d.kat === "Dana Desa" || d.kat === "PBJ");
                
                feed.innerHTML += `
                <div id="wrap_${d_id}">
                    <div class="case-row grid lg:grid-cols-12 items-center gap-6 p-8 py-4 ${isPriority?'priority-red':''}" onclick="togP('${d_id}')">
                        <div class="col-span-1"><img src="${d.face}" class="w-12 h-12 rounded-xl shadow-lg border-2 border-white object-cover"></div>
                        <div class="col-span-2 border-l border-slate-50 pl-5 leading-tight"><p class="text-[7.5px] text-blue-500 font-bold mb-1 uppercase tracking-widest">${d.ticket_id}</p><h4 class="text-[10px] font-black uppercase italic">${d.kat}</h4></div>
                        <div class="col-span-3 text-[10.5px] font-black italic text-slate-800 truncate">${d.pelapor_nama}</div>
                        <div class="col-span-3 text-[8.5px] font-black text-slate-400 opacity-60 px-2 italic uppercase">KEC. ${d.kec} | OHOI ${d.vill}</div>
                        <div class="col-span-1 flex gap-1 justify-center italic text-xs"><i class="fas fa-fingerprint ${d.status==='SELESAI'?'text-emerald-500':'text-blue-500 animate-pulse'}"></i></div>
                        <div class="col-span-2 text-right">
                             <span class="badge-s ${getSCol(d.status)} italic">${d.status}</span>
                             <i class="fas fa-ellipsis-v text-slate-300 ml-4 opacity-30"></i>
                        </div>
                    </div>

                    <!-- EXPAND INVESTIGATION UNIT -->
                    <div id="ex_${d_id}" class="expand-panel p-10 font-black italic uppercase shadow-inner">
                         <div class="grid lg:grid-cols-12 gap-10">
                            <div class="col-span-3 flex flex-col gap-6">
                                 <img src="${d.face}" class="rounded-[2.5rem] border-[10px] border-white shadow-2xl transition-all hover:scale-105" onclick="event.stopPropagation(); openHD('${d.face}')">
                                 <button onclick="event.stopPropagation(); openHD('${d.doc_archive}')" class="w-full bg-slate-900 border-b-4 border-black text-white p-5 rounded-2xl text-[9px] font-bold shadow-xl active:scale-95 transition-all"><i class="fas fa-id-card-clip text-emerald-500 mr-2"></i> VERIFIKASI SURAT SAH</button>
                            </div>
                            <div class="col-span-6 bg-white p-10 rounded-[3rem] border-t-4 border-slate-50 shadow-2xl">
                                 <p class="text-[8.5px] text-emerald-600 mb-3 tracking-widest underline decoration-transparent font-black italic">CATATAN BALASAN KEU PELAPOR :</p>
                                 <textarea id="nt_${d_id}" onclick="event.stopPropagation()" class="w-full h-36 bg-slate-50 border-2 border-dashed border-slate-100 rounded-3xl p-5 outline-none font-bold text-xs focus:bg-white text-slate-900" placeholder="MASUKKAN ARAHAN AUDITOR DI SINI...">${d.note || ""}</textarea>
                                 <button onclick="event.stopPropagation(); svNote('${d_id}')" class="w-full mt-5 bg-blue-600 border-b-4 border-blue-900 text-white p-4.5 rounded-[1.8rem] font-black text-[9px] shadow-2xl hover:brightness-110 italic transition-all">SINKRONISASI PESAN KEU HP PELAPOR ✅</button>
                            </div>
                            <div class="col-span-3 space-y-4">
                                 <p class="text-[7.5px] opacity-20 font-bold mb-4">ACTION COMMAND :</p>
                                 <button onclick="event.stopPropagation(); chS('${d_id}','DIVERIFIKASI')" class="w-full border-2 border-blue-200 bg-white py-4 rounded-2xl text-[8px] font-bold text-blue-600 active:scale-95 shadow-md">SET DIVERIFIKASI</button>
                                 <button onclick="event.stopPropagation(); chS('${d_id}','DIPROSES')" class="w-full border-2 border-amber-200 bg-white py-4 rounded-2xl text-[8px] font-bold text-amber-700 active:scale-95 shadow-md">SET PROSES AUDIT</button>
                                 <button onclick="event.stopPropagation(); chS('${d_id}','SELESAI')" class="w-full bg-emerald-600 text-white py-5 rounded-[2.5rem] font-black text-[10px] tracking-widest shadow-2xl active:translate-y-2 transition-all">ARKIP SELESAI ✅</button>
                            </div>
                         </div>
                    </div>
                </div>`;
            });
            Object.keys(distMap).sort().forEach(k=> maps.innerHTML += `<div class="group flex items-center justify-between p-3.5 hover:bg-blue-600/90 rounded-2xl transition-all cursor-default mb-1"><span class="text-[7.5px] opacity-40 group-hover:text-white font-sans">${k.toLowerCase()}</span><span class="text-[8px] font-black text-blue-500 group-hover:text-white">${distMap[k]} RECORD</span></div>`);
            document.getElementById('val_tot').innerText = t; document.getElementById('val_act').innerText = p;
        });

        window.togP = (i) => { const el = document.getElementById('ex_'+i); el.style.display = (el.style.display==='block'?'none':'block'); };
        window.svNote = async(i) => { const m = document.getElementById('nt_'+i).value; await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("DATA BERHASIL DI SINKRONKAN!"); };
        window.chS = async(i,st) => { if(confirm("UPDATE KEMajuan PROYEK?")) await updateDoc(doc(db,"pengaduan",i),{status:st}); };
        
        window.openHD = (url) => {
            if(!url){alert("NOT FOUND!"); return;}
            const c = document.getElementById('viewerLoader'); c.innerHTML="";
            if(url.includes("application/pdf")){ c.innerHTML=`<iframe src="${url}"></iframe>`; }
            else { c.innerHTML=`<img src="${url}" class="animate-in fade-in zoom-in duration-300">`; }
            document.getElementById('evidenceModal').style.display='flex';
        };

        function getSCol(s){ if(s==='SELESAI') return 'bg-ok'; if(s==='DIPROSES') return 'bg-proc'; return 'bg-view'; }
        
        document.getElementById('engineSearch').oninput=(e)=>{const v=e.target.value.toUpperCase();document.querySelectorAll('[id^="wrap_"]').forEach(r=>r.style.display=r.innerText.toUpperCase().includes(v)?'block':'none');};
        const curDate = new Date(); document.getElementById('dateBar').innerText=curDate.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • OFFICIAL MALRA GATEWAY";
    </script>
</body>
</html>
