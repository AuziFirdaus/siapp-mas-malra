<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINAL DASHBOARD | ARSITEKTUR S.KOM MALRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* [STRICT LOCK] PERINGATAN: JANGAN UBAH VARIABEL STYLE INI */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .sidebar-left { background: #0f172a; border-right: 2px solid #1e293b; z-index: 100; }
        .case-matrix-row { background: #ffffff; border-bottom: 2px solid #f1f5f9; transition: 0.3s; cursor: pointer; border-left: 6px solid transparent; }
        .case-matrix-row:hover { background: #fdfdfd; border-left-color: #3b82f6; }
        .expand-area-finale { display: none; background: #fcfdfe; border-bottom: 3px solid #cbd5e1; }
        
        /* VIEWER DYNAMIC MODAL (FIX BLANK PDF) */
        #modalCommander { position: fixed; inset: 0; background: rgba(0,0,0,0.99); z-index: 99999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        .iframe-final { width: 92vw; height: 85vh; border-radius: 1.5rem; background: white; border: none; }
        .image-final { max-height: 85vh; max-width: 90vw; border-radius: 2rem; border: 4px solid white; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
        
        /* TIMELINE AUDIT V.26 SYSTEM */
        .p-dot { width: 10px; height: 10px; border-radius: 50%; background: #e2e8f0; border: 1px solid white; }
        .p-line { height: 3px; background: #f1f5f9; flex-grow: 1; }
        .p-active { background: #10b981 !important; box-shadow: 0 0 12px #10b981; }

        /* FONT LOCK: HITAM BOLD INTEGRITY */
        .font-black-bolt { color: #000000 !important; font-weight: 900 !important; text-decoration: none !important; }
        * { text-decoration: none !important; }

        /* [POIN 1] VISUAL PING: ANIMASI BERKEDIP UNTUK LAPORAN BARU */
        .pulse-ping { width: 12px; height: 12px; background: #ef4444; border-radius: 50%; display: inline-block; position: relative; }
        .pulse-ping::after { content: ""; width: 100%; height: 100%; background: #ef4444; border-radius: 50%; position: absolute; top: 0; left: 0; animation: ping-glow 1.5s infinite; opacity: 0.6; }
        @keyframes ping-glow { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(3); opacity: 0; } }

        /* [POIN 2] FILTER BUTTON STYLES */
        .btn-flt { background: white; border: 1.5px solid #e2e8f0; color: #64748b; font-size: 8px; font-weight: 900; padding: 8px 18px; border-radius: 99px; transition: 0.3s; text-transform: uppercase; }
        .btn-flt.f-active { background: #3b82f6; border-color: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- MASTER MODAL COMPONENT (ANTI-BLANK PDF & HD IMAGE) -->
    <div id="modalCommander" onclick="this.style.display='none'">
        <div id="coreEngineViewer" class="flex flex-col items-center justify-center p-4 w-full h-full" onclick="event.stopPropagation()"></div>
    </div>

    <!-- SIDEBAR : PUSAT MONITORING INVESTIGASI -->
    <aside class="sidebar-left w-64 fixed h-full p-6 text-white hidden lg:flex flex-col font-black italic uppercase">
        <div class="flex items-center gap-3 border-b border-slate-800 pb-8 mb-8">
            <img src="./logo_malra.png" alt="Malra" class="h-12 w-auto">
            <div><h1 class="text-sm">SiAPP <span class="text-blue-500 italic">MAS</span></h1><p class="text-[6.5px] tracking-widest mt-2 opacity-30 italic">Audit Control Center</p></div>
        </div>
        
        <div class="flex-1 overflow-y-auto pr-1" id="distMappingContainer">
             <!-- KRISIS HEATMAP 11 KECAMATAN TERSEGEL DISINI -->
        </div>

        <div class="mt-auto border-t border-slate-800 pt-8 lowercase font-sans">
            <p class="text-[8px] text-blue-500 font-bold mb-4 uppercase tracking-widest italic">Commander-in-Chief :</p>
            <p class="text-xs font-black uppercase italic text-blue-50 leading-tight">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[7.5px] opacity-40 mt-1 uppercase font-black tracking-tight">Audit Ahli Pratama MALRA @ 2026</p>
            <button onclick="location.href='index.html'" class="w-full mt-10 bg-slate-900 border border-slate-800 text-red-500 py-3 rounded-2xl text-[9px] uppercase font-black hover:bg-red-700 transition-all">Sign-Out Session</button>
        </div>
    </aside>

    <!-- CONTENT PORTAL ARSITEKTUR TERSEGEL -->
    <main class="flex-1 lg:ml-64 p-4 lg:p-8 font-black uppercase italic">
        <header class="flex flex-col lg:flex-row justify-between lg:items-end gap-10 mb-10 border-b pb-8 border-slate-100">
            <div>
                <p class="text-[10px] text-slate-300 mb-2 font-sans tracking-widest" id="dynamicClock"></p>
                <div class="flex items-center gap-6">
                    <h2 class="text-3xl text-slate-800 leading-none">Pusat Kendali Malra Hub</h2>
                    <div class="flex gap-2 font-sans">
                        <div class="bg-blue-600 text-white px-5 py-2 rounded-xl text-[9px] shadow-xl">DATABASE : <span id="ui_tot">0</span></div>
                        <div class="bg-emerald-600 text-white px-5 py-2 rounded-xl text-[9px] shadow-xl">LIVE RECORDS : <span id="ui_act">0</span></div>
                    </div>
                </div>
            </div>
            
            <div class="relative lg:w-96 group">
                <i class="fas fa-satellite absolute left-5 top-4 text-blue-500 group-hover:rotate-45 transition-all"></i>
                <input type="text" id="id_finder" placeholder="SECURE CASE SEARCH..." class="w-full bg-white border border-slate-200 p-4 pl-14 rounded-[2rem] text-[9.5px] font-black italic shadow-inner outline-none uppercase placeholder:opacity-20 focus:border-blue-500">
            </div>
        </header>

        <!-- [POIN 2] THE COMMAND FILTER TABS -->
        <div class="flex flex-wrap gap-2 mb-8" id="filterSystem">
             <button onclick="fCase('ALL')" class="btn-flt f-active">ALL CATEGORIES</button>
             <button onclick="fCase('Dana Desa')" class="btn-flt">DANA DESA</button>
             <button onclick="fCase('Dana BOS')" class="btn-flt">DANA BOS/PAUD</button>
             <button onclick="fCase('BOK Puskesmas')" class="btn-flt">DANA BOK</button>
             <button onclick="fCase('PBJ')" class="btn-flt">PBJ DINAS</button>
        </div>

        <div id="liveAuditFeed" class="divide-y rounded-[3.5rem] overflow-hidden border border-slate-100 bg-white shadow-[0_50px_100px_rgba(0,0,0,0.04)] min-h-[50vh]">
             <div class="p-40 text-center opacity-10">Transmitting Core Audit Gateway...</div>
        </div>

        <p class="text-center text-[7.5px] mt-24 italic opacity-10 tracking-[0.4em] font-black uppercase">Infrastructure Locked by Security Protocol S-DKC.26 • Malra @2026</p>
    </main>

    <!-- [POIN 1] HIDDEN AUDIO COMPONENT (INTEL SOUND) -->
    <audio id="intelAudio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        let previousCount = -1; // INITIAL TRACKER

        // MAIN SYNC SYSTEM V.FINAL (POIN 1-2 INTEGRATED)
        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
            const feed = document.getElementById('liveAuditFeed'); const heatMap = document.getElementById('distMappingContainer');
            feed.innerHTML = ""; heatMap.innerHTML = "";
            let tCnt = snap.size, liveCnt = 0, kMap = {};

            // [POIN 1] AUDIO LOGIC S.KOM LEVEL
            if(previousCount !== -1 && tCnt > previousCount) { document.getElementById('intelAudio').play(); }
            previousCount = tCnt;

            snap.forEach(itSnap => {
                const it = itSnap.data(); const dbId = itSnap.id;
                kMap[it.kec] = (kMap[it.kec] || 0) + 1;
                if(it.status !== "SELESAI") liveCnt++;

                // Arsitektur Card Terkunci : No damage on features
                feed.innerHTML += `
                <div class="filter-item-target" data-k="${it.kat}">
                    <div class="case-matrix-row grid lg:grid-cols-12 items-center gap-10 p-12 py-4 ${it.status==='DILIHAT'?'bg-red-50/20':''}" onclick="togDetailFull('${dbId}')">
                        <div class="col-span-1 relative flex items-center group">
                             <img src="${it.face}" class="w-14 h-14 rounded-2xl shadow-xl border-4 border-white object-cover" onclick="event.stopPropagation(); masterDisplay('${it.face}')">
                             ${it.status==='DILIHAT'?'<div class="absolute -right-2 -top-1 pulse-ping border-2 border-white shadow"></div>':''}
                        </div>
                        <div class="col-span-3 border-l-2 border-slate-50 px-5">
                             <p class="text-[7px] text-blue-500 mb-2 font-bold font-sans">ID-CASE: ${it.ticket_id}</p>
                             <h4 class="text-[12px] font-black text-black tracking-tight">${it.kat.toUpperCase()}</h4>
                        </div>
                        <div class="col-span-5 flex flex-col justify-center leading-tight border-x border-slate-50 px-5">
                             <h5 class="font-black-bolt text-[14px] mb-1 italic uppercase tracking-tighter">${it.pelapor_nama}</h5>
                             <p class="font-black-bolt text-[9px] opacity-40 tracking-wider">SECURE WA: ${it.wa}</p>
                             <p class="font-black-bolt text-[10px] text-blue-800 tracking-tighter mt-1">LOK: ${it.kec.toUpperCase()} • OHOI ${it.vill.toUpperCase()}</p>
                        </div>
                        <div class="col-span-1 flex items-center gap-1 px-4">
                             <div class="p-dot p-active"></div><div class="p-line ${vP(it.status,1)?'p-active':''}"></div>
                             <div class="p-dot ${vP(it.status,1)?'p-active':''}"></div><div class="p-line ${vP(it.status,2)?'p-active':''}"></div>
                             <div class="p-dot ${vP(it.status,2)?'p-active':''}"></div>
                        </div>
                        <div class="col-span-2 text-right">
                             <span class="inline-block py-2 px-6 rounded-2xl font-black text-[7.5px] border tracking-[0.2em] shadow-sm bg-white ${it.status==='SELESAI'?'text-emerald-600':'text-red-500'}">${it.status}</span>
                             <i class="fas fa-microchip ml-6 opacity-5"></i>
                        </div>
                    </div>
                    
                    <div id="panelFinal_${dbId}" class="expand-area-finale p-12">
                         <div class="grid lg:grid-cols-12 gap-12 items-start">
                            <div class="col-span-3 space-y-6 flex flex-col items-center">
                                 <img src="${it.face}" class="rounded-[2.5rem] border-8 border-white shadow-2xl hover:brightness-125 cursor-zoom-in" onclick="event.stopPropagation(); masterDisplay('${it.face}')">
                                 <button onclick="event.stopPropagation(); masterDisplay('${it.doc_archive}')" class="w-full bg-slate-950 text-blue-400 p-6 rounded-3xl font-black text-[9px] flex items-center justify-center gap-3 active:scale-95 shadow-2xl uppercase">
                                       <i class="fas fa-barcode-read text-xl"></i> ANALISA DOKUMEN TERTULIS
                                 </button>
                            </div>
                            <div class="col-span-6 bg-white p-12 rounded-[3.5rem] shadow-2xl border-t-[5px] border-l-[5px] border-slate-50">
                                 <p class="text-[9.5px] text-emerald-600 mb-4 block underline font-black">MATRIX KOMANDO AUDITOR (FEEDWAR):</p>
                                 <textarea id="respAud_${dbId}" onclick="event.stopPropagation()" class="w-full h-32 bg-slate-50 border-2 border-slate-200 border-dashed rounded-[2rem] p-6 text-slate-800 text-[13px] font-black outline-none italic focus:bg-white">${it.note || ""}</textarea>
                                 <button onclick="event.stopPropagation(); syncNow('${dbId}')" class="w-full mt-6 bg-emerald-600 border-b-8 border-emerald-950 text-white p-5 rounded-[2.5rem] font-black text-[11px] uppercase italic animate-pulse">SINKRONKAN PESAN KEU PUBLIC 📡</button>
                            </div>
                            <div class="col-span-3 space-y-5 pt-8 italic">
                                 <button onclick="event.stopPropagation(); statX('${dbId}','DIVERIFIKASI')" class="w-full bg-slate-50 border-2 border-blue-200 py-3.5 rounded-2xl text-[10px] text-blue-600 font-black">1. VERIFIKASI ID</button>
                                 <button onclick="event.stopPropagation(); statX('${dbId}','DIPROSES')" class="w-full bg-slate-50 border-2 border-orange-200 py-3.5 rounded-2xl text-[10px] text-amber-700 font-black">2. INVESTIGASI KANTOR</button>
                                 <button onclick="event.stopPropagation(); statX('${dbId}','SELESAI')" class="w-full bg-slate-900 border-b-4 border-slate-950 py-6 rounded-[2.5rem] text-emerald-400 text-lg mt-10 shadow-2xl tracking-tighter active:scale-95">MARK COMPLETED ✅</button>
                            </div>
                         </div>
                    </div>
                </div>`;
            });
            Object.keys(kMap).sort().forEach(kn => heatMap.innerHTML += `<div class="group flex items-center justify-between p-4 hover:bg-blue-600/30 transition-all rounded-3xl mb-1 italic px-6"><span class="text-[9px] opacity-40 font-bold lowercase tracking-widest">${kn.toLowerCase()}</span><span class="bg-blue-600 text-white text-[7.5px] px-3.5 py-1.5 rounded-full font-black italic shadow-inner tracking-widest">${kMap[kn]} CASE</span></div>`);
            document.getElementById('ui_tot').innerText = tCnt; document.getElementById('ui_act').innerText = liveCnt;
        });

        // POIN 2: COMMAND FILTER CORE S.KOM
        window.fCase = (k) => {
            const btns = document.querySelectorAll('.btn-flt'); btns.forEach(b => { if(b.innerText === (k==='ALL'?'ALL CATEGORIES':k.toUpperCase())) b.classList.add('f-active'); else b.classList.remove('f-active'); });
            document.querySelectorAll('.filter-item-target').forEach(row => {
                const targetK = row.getAttribute('data-k');
                if(k === "ALL") row.style.display = 'block';
                else if(targetK === k) row.style.display = 'block';
                else row.style.display = 'none';
            });
        };

        window.togDetailFull = (i) => { const el = document.getElementById('panelFinal_'+i); el.style.display = el.style.display==='block'?'none':'block'; };
        window.statX = async(i,s) => { if(confirm("OTORISASI STATUS BARU?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        window.syncNow = async(i) => { const n=document.getElementById('respAud_'+i).value; if(!n){alert("Note is blank!");return;} await updateDoc(doc(db,"pengaduan",i),{note:n}); alert("DATA INTEGRASI SELESAI!"); };
        
        // VIEW ENGINE [STRICT PROTECTED] : BYPASS BLANK PDF & HD IMAGE
        window.masterDisplay = (u) => {
            if(!u) return; const wrap = document.getElementById('coreEngineViewer'); wrap.innerHTML = "";
            if(u.includes("data:application/pdf") || u.includes(".pdf")) {
                wrap.innerHTML = `<div class="bg-white p-5 rounded-[3rem] shadow-2xl border-b-[15px] border-slate-900 animate-in fade-in zoom-in duration-500"><iframe src="${u}" class="iframe-final"></iframe><div class="mt-6 flex gap-6"><button class="flex-1 bg-red-600 text-white py-6 rounded-[2.5rem] font-black text-sm active:translate-y-2 uppercase shadow-xl" onclick="document.getElementById('modalCommander').style.display='none'">EXIT INSPECTION</button><a href="${u}" download="report_malra.pdf" class="px-14 bg-slate-950 text-emerald-400 rounded-[2.5rem] flex items-center font-black">EXPORT PDF</a></div></div>`;
            } else {
                wrap.innerHTML = `<img src="${u}" class="image-final border-[10px] border-white animate-in zoom-in duration-300 shadow-2xl"><button class="bg-blue-600 text-white px-24 py-6 mt-12 rounded-full font-black text-sm uppercase shadow-2xl active:translate-y-4 tracking-widest border-b-8 border-blue-900" onclick="document.getElementById('modalCommander').style.display='none'">TUTUP LAYAR SCAN</button>`;
            }
            document.getElementById('modalIntegritas' || 'modalCommander').style.display='flex';
        };

        function vP(c,n){ if(c==="DIVERIFIKASI") return n<=1; if(c==="DIPROSES") return n<=2; if(c==="SELESAI") return n<=3; return false; }
        const rtc = new Date(); document.getElementById('dynamicClock').innerText = rtc.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).toUpperCase() + " • COMMAND PROTOCOL INITIALIZED";
        document.getElementById('id_finder').oninput = (e) => { const val=e.target.value.toUpperCase(); document.querySelectorAll('.case-matrix-row').forEach(r => r.style.display=r.innerText.toUpperCase().includes(val)?'grid':'none'); };
    </script>
</body>
</html>
