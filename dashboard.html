<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER COMMAND | Firdaus Setitit S.Kom - Integrity Malra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4f8; color: #000000; margin: 0; overflow-x: hidden; }
        .sidebar { background: #0f172a; border-right: 2px solid #1e293b; z-index: 50; }
        .case-card { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 1.5rem; transition: 0.2s; cursor: pointer; border-left: 8px solid #3b82f6; margin-bottom: 12px; }
        .case-card:hover { transform: translateY(-2px); border-color: #3b82f6; box-shadow: 0 12px 25px rgba(0,0,0,0.06); }
        .priority-red { border-left-color: #ef4444 !important; background: #fffafa !important; }
        .expand-view { display: none; background: #ffffff; border: 2px solid #3b82f6; border-top:none; border-radius: 0 0 2rem 2rem; margin-top: -15px; margin-bottom: 20px; }
        .status-badge { padding: 5px 16px; border-radius: 99px; font-size: 11px; font-weight: 900; text-transform: uppercase; border: 2px solid transparent; }
        .header-slim { background: white; border-radius: 2rem; padding: 1.2rem 2.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid #3b82f6; margin-bottom: 2rem; }
        #viewerMaster { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); padding: 10px; }
        iframe.doc-p { width: 92vw; height: 88vh; border-radius: 1.5rem; background: white; border: none; }
        img.img-p { max-height: 85vh; border-radius: 2rem; border: 5px solid white; shadow: 2xl; }
        .text-black-heavy { color: #000000 !important; font-weight: 800 !important; }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex min-h-screen font-black italic">

    <!-- MASTER EVIDENCE VIEWER (ANTI-BLANK PDF) -->
    <div id="viewerMaster" onclick="this.style.display='none'">
        <div id="canvasBox" class="flex flex-col items-center w-full h-full justify-center"></div>
    </div>

    <!-- SIDEBAR STAY (AUDIT INTELLIGENCE MALRA) -->
    <aside class="sidebar w-64 fixed h-full flex flex-col p-6 text-white hidden lg:flex uppercase">
        <div class="flex items-center gap-3 border-b border-slate-800 pb-8 mb-8">
            <img src="./logo_malra.png" alt="Log" class="h-10 w-auto">
            <div><h1 class="text-sm font-black leading-tight">SiAPP <span class="text-blue-500">MAS</span></h1><p class="text-[7px] tracking-widest mt-1 opacity-40 not-italic">command center malra</p></div>
        </div>
        <div class="flex-1 overflow-y-auto" id="sideDistrictMap"></div>
        <div class="mt-auto border-t border-slate-800 pt-8 lowercase not-italic font-sans">
            <p class="text-[8.5px] text-blue-500 font-black mb-3 uppercase tracking-widest italic underline decoration-transparent">Access Granted By :</p>
            <p class="text-sm font-black uppercase text-white leading-tight">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[7.5px] opacity-30 uppercase font-bold mt-1">Audit Pratama MALRA @ 2026</p>
            <button onclick="location.href='index.html'" class="w-full mt-10 bg-red-950 text-red-500 py-3 rounded-xl uppercase font-black text-[8px] hover:bg-red-700 hover:text-white transition-all shadow-xl">Terminate Session</button>
        </div>
    </aside>

    <main class="flex-1 lg:ml-64 p-5 lg:p-10 italic font-black uppercase">
        <!-- HEADER RAMPING FINAL V.90 -->
        <header class="header-slim shadow-sm">
            <div class="flex items-center gap-6">
                <div class="border-l-4 border-red-600 pl-5">
                    <h2 class="text-2xl text-slate-900 leading-none">MEJA KERJA <span class="text-blue-600">KOMANDO</span></h2>
                    <p class="text-[9.5px] text-slate-400 font-sans tracking-[0.15em] mt-1" id="calLive"></p>
                </div>
                <div class="flex gap-2">
                    <div class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10.5px]">ARCHIVE: <span id="stat_t">0</span></div>
                    <div class="bg-slate-900 text-white px-4 py-2 rounded-xl text-[10.5px] animate-pulse">ACTIVE: <span id="stat_a">0</span></div>
                </div>
            </div>
            <div class="relative w-80 group"><i class="fas fa-fingerprint absolute left-4 top-3.5 text-blue-500"></i><input type="text" id="engineFilter" placeholder="CARI CASE BY TIKET/NAMA..." class="w-full bg-slate-50 border border-slate-100 p-3 pl-11 rounded-3xl text-[11px] font-black italic shadow-inner outline-none focus:ring-4 focus:ring-blue-100"></div>
        </header>

        <!-- FEED UTAMA SINKRONISASI -->
        <div id="rootAuditFeed" class="space-y-4">
             <div class="p-32 text-center opacity-10 text-xl font-black italic">Synchronizing Record Government Secure Line...</div>
        </div>

        <p class="text-center text-[7px] text-slate-400 mt-24 opacity-30 tracking-[0.6em]">Infrastructure Intelligence Arsitektur Firdaus S.Kom • 2026</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        // DATA CONTROLLER MASTER
        onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (sn) => {
            const feed = document.getElementById('rootAuditFeed'); const mBox = document.getElementById('sideDistrictMap');
            feed.innerHTML = ""; mBox.innerHTML = "";
            let t = sn.size, a = 0, geoMap = {};

            sn.forEach(docSnap => {
                const d = docSnap.data(); const cid = docSnap.id;
                geoMap[d.kec] = (geoMap[d.kec] || 0) + 1;
                if(d.status !== "SELESAI") a++;
                const isCrit = (d.kat === "Dana Desa" || d.kat === "PBJ");
                
                feed.innerHTML += `
                <div id="card_${cid}">
                    <!-- HEADER BARIS COMPACT S.KOM (FORCED BLACK) -->
                    <div class="case-card grid lg:grid-cols-12 items-center gap-6 px-10 py-5 ${isCrit?'priority-red':''}" onclick="exP('${cid}')">
                        <div class="col-span-1"><img src="${d.face}" class="w-14 h-14 rounded-2xl border-4 border-white shadow-2xl object-cover ring-2 ring-slate-100"></div>
                        <div class="col-span-2 border-l border-slate-100 pl-4 leading-tight">
                            <p class="text-[7.5px] text-blue-600 font-bold mb-1 font-sans">TIKET ID: ${d.ticket_id}</p>
                            <h4 class="text-[12px] font-black italic text-black-heavy uppercase">${d.kat}</h4>
                        </div>
                        <div class="col-span-3 border-l border-slate-100 pl-5 leading-snug">
                            <p class="text-[15px] text-black-heavy">${d.pelapor_nama.toUpperCase()}</p>
                            <p class="text-[11px] font-bold text-emerald-700 not-italic font-sans uppercase mt-1">WA: ${d.wa}</p>
                        </div>
                        <div class="col-span-3 border-l border-slate-100 pl-5 leading-snug uppercase italic">
                            <p class="text-[12.5px] text-black-heavy font-black">${d.kec}</p>
                            <p class="text-[10px] text-slate-500 font-bold opacity-60">📍 OHOI ${d.vill}</p>
                        </div>
                        <div class="col-span-1 text-blue-500 animate-pulse text-lg flex justify-center"><i class="fas fa-shield-halved"></i></div>
                        <div class="col-span-2 text-right">
                             <span class="status-badge ${stCol(d.status)}">${d.status}</span>
                             <i class="fas fa-angle-right ml-4 opacity-10"></i>
                        </div>
                    </div>

                    <!-- EXPAND CONTENT INTEGRITY MODUL -->
                    <div id="p_${cid}" class="expand-view p-12 italic uppercase font-black shadow-inner">
                         <div class="grid lg:grid-cols-12 gap-10">
                            <div class="col-span-3 flex flex-col gap-6">
                                 <img src="${d.face}" class="rounded-3xl border-8 border-white shadow-2xl transition-all hover:scale-[1.05]" onclick="event.stopPropagation(); opHD('${d.face}')">
                                 <button onclick="event.stopPropagation(); opHD('${d.doc_archive}')" class="w-full bg-slate-900 border-b-8 border-black text-white p-5 rounded-3xl text-[9px] shadow-lg flex items-center justify-center gap-3 transition-all active:scale-95"><i class="fas fa-magnifying-glass-chart text-emerald-500"></i> PERIKSA ARSIP SURAT</button>
                            </div>
                            <div class="col-span-6 bg-blue-50 border border-blue-100 p-10 rounded-[3rem] shadow-inner">
                                 <p class="text-[9.5px] text-blue-700 mb-4 block underline decoration-blue-100 tracking-widest font-black uppercase italic">INSTRUKSI PENYELESAIAN AUDITOR :</p>
                                 <textarea id="nt_${cid}" onclick="event.stopPropagation()" class="w-full h-44 bg-white border-2 border-dashed border-blue-200 rounded-[1.8rem] p-6 outline-none font-bold text-xs italic text-slate-900 focus:border-blue-500" placeholder="Ketik Respon Anda Disini...">${d.note || ""}</textarea>
                                 <button onclick="event.stopPropagation(); saveN('${cid}')" class="w-full mt-6 bg-emerald-600 border-b-8 border-emerald-950 text-white p-5 rounded-[2.2rem] font-black text-[11px] shadow-xl italic tracking-wider active:translate-y-2 uppercase">PUSH RESPONS KE PELAPOR ✅</button>
                                 <a href="https://wa.me/${d.wa}" target="_blank" onclick="event.stopPropagation()" class="block text-center mt-5 opacity-20 text-[9px] underline">CALL PETUGAS VIA WHATSAPP</a>
                            </div>
                            <div class="col-span-3 space-y-4 font-sans uppercase">
                                 <p class="text-[10px] text-slate-300 font-bold mb-6 tracking-[0.2em] italic uppercase px-1">Tahap Progress Audit:</p>
                                 <button onclick="event.stopPropagation(); upX('${cid}','DIVERIFIKASI')" class="w-full bg-white border-2 border-slate-100 py-3.5 rounded-2xl text-blue-600 font-black text-[10px] uppercase shadow-sm">Set: Diverifikasi</button>
                                 <button onclick="event.stopPropagation(); upX('${cid}','AUDIT AKTIF')" class="w-full bg-white border-2 border-slate-100 py-3.5 rounded-2xl text-amber-700 font-black text-[10px] uppercase shadow-sm">Set: Audit Aktif</button>
                                 <div class="pt-8">
                                      <button onclick="event.stopPropagation(); upX('${cid}','SELESAI')" class="w-full bg-emerald-700 border-b-8 border-emerald-950 text-white py-6 rounded-3xl font-black text-[12px] uppercase shadow-2xl active:translate-y-2 italic tracking-tighter">MISSION COMPLETED ✅</button>
                                 </div>
                            </div>
                         </div>
                    </div>
                </div>`;
            });
            Object.keys(geoMap).sort().forEach(kn=> mBox.innerHTML += `<div class="group flex items-center justify-between p-3.5 bg-slate-900 border border-slate-800 rounded-2xl mb-2 italic transition-all px-4 hover:bg-blue-600"><span class="text-[9px] opacity-40 font-black text-blue-50">${kn.toUpperCase()}</span><span class="bg-blue-500 text-white text-[8px] font-black px-2 py-0.5 rounded-md uppercase">${geoMap[kn]} LAPS</span></div>`);
            document.getElementById('stat_t').innerText = t; document.getElementById('stat_a').innerText = a;
        });

        window.exP = (i) => { const el = document.getElementById('p_'+i); el.style.display = el.style.display==='grid'?'none':'grid'; };
        window.saveN = async(i) => { const m = document.getElementById('nt_'+i).value; if(!m){alert("DATA BLANK!");return;} await updateDoc(doc(db,"pengaduan",i),{note:m}); alert("DATA SINRON SAH!"); };
        
        // --- LOGIKA UPDATE STATUS (POINT UTAMA GAMBAR 101) ---
        window.upX = async(i,s) => { 
            if(confirm("TETAPKAN STATUS KASUS MENJADI : " + s + " ?")) {
                const docRef = doc(db,"pengaduan",i);
                try {
                    await updateDoc(docRef, { status: s });
                    // Tanpa Reload, Data akan update otomatis karena onSnapshot.
                } catch (e) { alert("GAGAL AKSES SERVER DATABASE!"); }
            }
        };
        
        window.opHD = (u) => {
            if(!u){alert("RECORD FILE KOSONG!");return;}
            const bx = document.getElementById('canvasBox'); bx.innerHTML = "";
            if(u.includes("pdf") || u.includes(";base64,JVBERi")){ bx.innerHTML = `<iframe src="${u}" class="doc-p shadow-2xl border-white border-[8px]"></iframe><button class="bg-red-700 text-white px-10 py-3 rounded-full mt-5 font-black uppercase text-xs">TUTUP DOKUMEN ARSIP</button>`; }
            else { bx.innerHTML = `<img src="${u}" class="img-p shadow-2xl animate-in fade-in duration-500"><button class="bg-blue-700 text-white px-10 py-3 rounded-full mt-10 font-black uppercase text-xs italic shadow-xl">KEMBALI KE PANEL AUDIT</button>`; }
            document.getElementById('viewerMaster').style.display='flex';
        };

        function stCol(s){ if(s==='SELESAI') return 'bg-emerald-500/10 text-emerald-700 border-emerald-300'; if(s==='AUDIT AKTIF') return 'bg-amber-100 text-orange-700 border-amber-200 ring-2 ring-amber-50 animate-pulse'; if(s==='DIVERIFIKASI') return 'bg-blue-100 text-blue-700 border-blue-200'; return 'bg-white text-slate-800 italic border-slate-100'; }
        document.getElementById('engineFilter').oninput=(e)=>{ const v = e.target.value.toUpperCase(); document.querySelectorAll('[id^="card_"]').forEach(el=>el.style.display=el.innerText.toUpperCase().includes(v)?'block':'none'); };
        const dy = new Date(); document.getElementById('calLive').innerText=dy.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • OFFICIAL MALRA GATEWAY CORE";
    </script>
</body>
</html>
