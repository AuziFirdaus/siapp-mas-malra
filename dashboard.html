<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB INVESTIGASI | Malra Digital Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; overflow: hidden; }
        .sidebar-master { background: #000a1f; border-right: 5px solid #3b82f6; width: 300px; height: 100vh; position: fixed; }
        .row-case { background: white; border-bottom: 2px solid #e2e8f0; cursor: pointer; border-left: 10px solid transparent; }
        .row-case:hover { background: #fdfdfd; border-left-color: #3b82f6; transition: 0.3s; }
        .p-inspect { display: none; background: #ffffff; border-bottom: 5px solid #cbd5e1; }
        #modalMaster { position: fixed; inset: 0; background: #000; z-index: 1000000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(25px); }
        .font-black-bolt { color: #000 !important; font-weight: 900 !important; text-transform: uppercase; line-height: 1.2; }
        iframe { width: 92vw; height: 75vh; border-radius: 1.5rem; background: white; border: none; }
        .im-v { max-height: 75vh; border: 8px solid white; border-radius: 20px; box-shadow: 0 40px 100px #000; }
        .btn-filt { background: white; border: 2px solid #e2e8f0; color: #64748b; font-size: 10px; font-weight: 900; padding: 10px 25px; border-radius: 99px; transition: 0.3s; }
        .btn-filt.aktif { background: #0ea5e9 !important; color: white !important; border-color: #0ea5e9; }
        * { text-decoration: none !important; }
    </style>
</head>
<body class="flex">

    <!-- THE PINTU KESALAMATAN LOGIN -->
    <div id="pintu" style="position:fixed; inset:0; background:#000a1f; z-index:9999999; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; padding:50px; border-radius:4rem; width:450px; text-align:center; border-bottom:20px solid #3b82f6;">
            <img src="./logo_malra.png" style="height:100px; margin:0 auto 30px;">
            <h2 class="font-black-bolt text-2xl italic mb-10 tracking-tight">COMMAND GATEWAY MALRA</h2>
            <input type="text" id="u" placeholder="ID DIGITAL" style="width:100%; padding:20px; border:3px solid #e2e8f0; border-radius:1.5rem; margin-bottom:15px; text-align:center; font-weight:900;">
            <input type="password" id="p" placeholder="SECRET AUTH" style="width:100%; padding:20px; border:3px solid #e2e8f0; border-radius:1.5rem; margin-bottom:40px; text-align:center; font-weight:900; letter-spacing:8px;">
            <button id="goLogin" style="width:100%; background:#2563eb; color:white; font-weight:900; padding:28px; border-radius:2rem; font-size:16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">ACCESS HUB <i class="fas fa-lock-open ml-3"></i></button>
        </div>
    </div>

    <!-- PROTOKOL MASTER PENAMPIL PDF/JPG -->
    <div id="modalMaster">
        <div id="matrixViewer" class="flex flex-col items-center w-full" onclick="event.stopPropagation()"></div>
        <button onclick="document.getElementById('modalMaster').style.display='none'" style="background:#ef4444; color:white; width:90%; padding:28px; border-radius:2.5rem; font-weight:900; font-size:22px; margin-top:20px; box-shadow:0 0 50px rgba(0,0,0,0.8); cursor:pointer;">KELUAR & TUTUP MONITORING (EXIT)</button>
    </div>

    <aside class="sidebar-master p-8 text-white hidden lg:flex flex-col uppercase font-black italic">
        <div class="border-b-4 border-blue-600 pb-10 mb-8 text-center">
            <img src="./logo_malra.png" class="h-32 mx-auto mb-5 drop-shadow-2xl">
            <h1 class="text-xl">SiAPP <span class="text-blue-500 italic">MAS</span></h1>
            <p class="text-[7px] tracking-[0.4em] opacity-40">Command Center</p>
        </div>
        <div class="flex-1 overflow-y-auto" id="listDistMap"></div>
        <div class="mt-auto border-t-2 border-slate-700 pt-10 font-sans lowercase">
            <p class="text-[9px] text-blue-500 font-black mb-3 uppercase tracking-widest italic">COMMANDER AUTH :</p>
            <p class="text-lg font-black uppercase text-white leading-tight">FIRDAUS SETITIT, S.KOM</p>
            <p class="text-[8.5px] opacity-40 mt-1 uppercase italic tracking-widest">AUDIT PRATAMA MALRA @ 2026</p>
            <button onclick="location.reload()" class="w-full mt-10 bg-slate-900 border-2 border-red-900 text-red-600 py-3.5 rounded-3xl text-[9px] font-black uppercase hover:bg-red-700">TERMINATE</button>
        </div>
    </aside>

    <main class="flex-1 lg:ml-[300px] p-6 lg:p-12 uppercase italic font-black">
        <header class="flex justify-between items-end border-b-4 border-slate-900 pb-10 mb-10">
            <div>
                <p id="cal" class="text-blue-600 text-xs mb-2 font-sans font-bold"></p>
                <h2 class="text-3xl text-slate-800 tracking-tighter italic">Markas Kendali Laporan</h2>
                <div class="flex gap-4 mt-4 font-sans tracking-tight">
                    <div class="bg-black text-white px-5 py-1.5 rounded-lg text-[10px]">TOT : <span id="r_t">0</span></div>
                    <div class="bg-red-700 text-white px-5 py-1.5 rounded-lg text-[10px] animate-pulse">ALR : <span id="r_a">0</span></div>
                </div>
            </div>
            <!-- KOMPONEN SEARCH RAMPING S.KOM -->
            <div style="position: relative; width: 230px;">
                <i class="fas fa-id-card absolute left-4 top-3 text-blue-600"></i>
                <input type="text" id="srch" placeholder="CARI TICKET ID..." style="width:100%; background:white; border:2px solid #000; padding:10px 10px 10px 45px; border-radius:1.5rem; font-size:10px;">
            </div>
        </header>

        <div class="flex gap-2 mb-10">
            <button onclick="filtX('ALL')" class="btn-filt aktif" id="b-a">DASHBOARD UTAMA</button>
            <button onclick="filtX('Dana Desa')" class="btn-filt">DANA DESA</button>
            <button onclick="filtX('Dana BOS')" class="btn-filt">DANA BOS</button>
            <button onclick="filtX('BOK Puskesmas')" class="btn-filt">DANA BOK</button>
            <button onclick="filtX('PBJ')" class="btn-filt">PBJ DINAS</button>
        </div>

        <div id="auditFeed" class="divide-y-4 bg-white border-4 border-slate-900 rounded-[3.5rem] overflow-hidden shadow-2xl min-h-[50vh]">
             <div class="p-40 text-center opacity-10">transmitting real-time encryption data malra hub...</div>
        </div>
    </main>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
        const app = initializeApp(config); const db = getFirestore(app);

        // LOGIN VERIFIED
        document.getElementById('goLogin').onclick=()=>{ const u=document.getElementById('u').value, p=document.getElementById('p').value; if(u==='itkabmalra1'&&p==='itkabmalra01'){ document.getElementById('pintu').style.display='none'; runAuditHub(); } else {alert("DENIED!");}};

        function runAuditHub() {
            let lastL = -1;
            onSnapshot(query(collection(db, "pengaduan"), orderBy("timestamp", "desc")), (snap) => {
                const feed = document.getElementById('auditFeed'); const dist = document.getElementById('listDistMap');
                feed.innerHTML = ""; dist.innerHTML = ""; let km = {}; let act = 0;
                if(lastL !== -1 && snap.size > lastL) document.getElementById('beep').play();
                lastL = snap.size;

                snap.forEach(shot => {
                    const d=shot.data(), id=shot.id; km[d.kec]=(km[d.kec]||0)+1; if(d.status==="DILIHAT") act++;
                    const v = (d.kat === "Dana Desa" || d.kat === "PBJ");
                    
                    feed.innerHTML += `
                    <div class="case-item" data-c="${d.kat}">
                        <div class="row-case grid grid-cols-12 gap-8 p-12 py-5 items-center ${v?'bg-red-50/40 border-l-[12px] border-red-500':''}" onclick="masterExpand('${id}')">
                            <div class="col-span-1" onclick="event.stopPropagation(); masterSee('${id}', '${d.face}', true)"><img src="${d.face}" class="w-24 h-24 rounded-3xl border-4 border-slate-50 object-cover shadow-2xl transition-transform hover:scale-110"></div>
                            <div class="col-span-3 border-l-2 pl-10 leading-none"><p class="text-[9px] text-blue-700 italic">ID: ${d.ticket_id}</p><h4 class="text-xs font-black uppercase tracking-tight">${d.kat}</h4></div>
                            <div class="col-span-6 px-10 border-x flex flex-col justify-center">
                                <h5 class="font-black-bolt text-3xl leading-none italic mb-1 truncate">${d.pelapor_nama}</h5>
                                <p class="font-black-bolt text-lg text-emerald-700 opacity-60 font-sans tracking-widest leading-none mb-1">WA: ${d.wa}</p>
                                <p class="font-black-bolt text-[14px] text-blue-950 font-sans tracking-tight uppercase">${d.kec} • ${d.vill}</p>
                            </div>
                            <div class="col-span-2 text-right">
                                <span style="background:${d.status==='SELESAI'?'#10b981':'#ef4444'};" class="inline-block py-2.5 px-10 rounded-[1.8rem] text-white text-[11px] shadow-2xl">${d.status}</span>
                            </div>
                        </div>

                        <div id="panel_${id}" class="p-inspect p-12">
                             <div class="grid grid-cols-12 gap-12">
                                <div class="col-span-3 text-center space-y-6">
                                     <img src="${d.face}" class="rounded-[3rem] border-8 border-white shadow-2xl hover:brightness-125 transition-all" onclick="event.stopPropagation(); masterSee('${id}', '${d.face}', true)">
                                     <button onclick="event.stopPropagation(); masterSee('${id}', '${d.face}', false)" class="w-full bg-black text-blue-400 p-8 rounded-[3.5rem] font-black italic shadow-2xl uppercase border-b-8 border-slate-900 active:scale-95 text-xs">BUKA INVESTIGASI FISIK SURAT <i class="fas fa-search-plus"></i></button>
                                </div>
                                <div class="col-span-6 bg-white p-12 rounded-[5rem] shadow-2xl border-t-[5px] border-l-[5px] border-slate-50 text-center relative overflow-hidden">
                                     <label class="font-black-bolt text-sm text-blue-700 mb-8 block underline decoration-4 decoration-blue-50 tracking-tighter">SINTRONISASI INTRUKSI AUDIT :</label>
                                     <textarea id="msg_${id}" onclick="event.stopPropagation()" class="w-full h-44 bg-slate-50 border-4 border-dashed rounded-[2.8rem] p-10 text-[35px] font-black italic text-black outline-none shadow-inner focus:bg-white">${d.note || ""}</textarea>
                                     <button onclick="event.stopPropagation(); masterSave('${id}')" style="background:#10b981;" class="w-full mt-10 bg-emerald-600 text-white py-6 rounded-full font-black text-lg animate-pulse shadow-xl tracking-tighter uppercase italic">SINKRONKAN PESAN KEU WARGA ✅</button>
                                </div>
                                <div class="col-span-3 pt-12 space-y-4">
                                     <p class="text-[9px] font-black opacity-30 px-3 uppercase underline underline-offset-4 decoration-blue-600">Switch status audit:</p>
                                     <button onclick="event.stopPropagation(); masterUp('${id}','DIVERIFIKASI')" class="w-full bg-slate-50 border-2 border-blue-50 py-4 rounded-[2rem] text-sm font-black text-blue-600">VERIFIKASI ID</button>
                                     <button onclick="event.stopPropagation(); masterUp('${id}','DIPROSES')" class="w-full bg-slate-50 border-2 border-amber-50 py-4 rounded-[2rem] text-sm font-black text-orange-800">INVESTIGASI AUDIT</button>
                                     <button onclick="event.stopPropagation(); masterUp('${id}','SELESAI')" class="w-full bg-slate-900 border-b-8 border-black text-emerald-400 py-10 mt-16 rounded-[4rem] text-2xl font-black shadow-2xl active:translate-y-5">ARSIP DONE ✅</button>
                                </div>
                             </div>
                        </div>
                    </div>`;
                });
                Object.keys(km).sort().forEach(n => dist.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:15px 25px; background:rgba(255,255,255,0.05); border-radius:2rem; margin-bottom:8px;"><span class="text-[12px] font-black text-blue-50 tracking-tight">${n.toLowerCase()}</span><span class="bg-blue-600 border border-blue-400 px-5 py-2 rounded-full font-bold text-[9px] italic">${km[n]} RECORDS</span></div>`);
                document.getElementById('r_t').innerText=total; document.getElementById('r_a').innerText=act;
            });
        }

        // PROTOKOL S-DKC ASSEMBLY: PENYAMBUNG FILE POTONGAN
        window.masterSee = async(id, thumb, isFace) => {
            const canv = document.getElementById('matrixViewer'); canv.innerHTML = "MENYAMBUNG FRAGMEN DATABASE..."; 
            document.getElementById('modalMaster').style.display='flex';

            if(isFace){ 
                canv.innerHTML = `<img src="${thumb}" class="im-v shadow-2xl">`; 
            } else {
                const qs = await getDocs(query(collection(db, "pengaduan", id, "shards"), orderBy("idx", "asc")));
                let rawFull = ""; qs.forEach(chunk => { rawFull += chunk.data().data; });
                
                if(rawFull.includes("pdf")){ canv.innerHTML = `<iframe src="${rawFull}"></iframe>`; }
                else { canv.innerHTML = `<img src="${rawFull}" class="im-v">`; }
            }
        };

        window.masterExpand = (i) => { const el=document.getElementById('panel_'+i); el.style.display = el.style.display==='block'?'none':'block'; };
        window.masterSave = async(i) => { const nt=document.getElementById('msg_'+i).value; await updateDoc(doc(db,"pengaduan",i), {note:nt}); alert("SYC BERHASIL!"); };
        window.masterUp = async(i,s) => { if(confirm("AUTORISASI CHANGE STAGE?")) await updateDoc(doc(db,"pengaduan",i),{status:s}); };
        
        window.filtX = (k) => {
            document.querySelectorAll('.btn-filt').forEach(b => { if(b.innerText.includes(k.toUpperCase())||(k==='ALL'&&b.innerText.includes('DASHBOARD'))) b.classList.add('aktif'); else b.classList.remove('aktif'); });
            document.querySelectorAll('.case-item').forEach(e => e.style.display = (k==='ALL' || e.getAttribute('data-c')===k)?'block':'none');
        };

        const dtNow = new Date(); document.getElementById('cal').innerText = dtNow.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase() + " • GOVERNANCE AUDIT CENTER MALRA";
        document.getElementById('srch').oninput=(e)=>{ const f = e.target.value.toUpperCase(); document.querySelectorAll('.case-item').forEach(it=>{ it.style.display = it.innerText.toUpperCase().includes(f)?'block':'none'; }); };
    </script>
</body>
</html>
