<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SiAPP Mas Malra | High Efficiency v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; color: #1e293b; overflow-x: hidden; margin: 0; }
        .border-hijau-kab { border: 2.8px solid #10b981 !important; border-radius: 2rem !important; background: #ffffff; padding: 25px; margin-bottom: 25px; display: block; width: 100%; box-sizing: border-box; }
        select.border-hijau-kab { color: #000000 !important; font-weight: 800 !important; background: white !important; appearance: none; padding: 18px 25px !important; font-size: 11.5px !important; }
        #video-preview { border-radius: 2rem; width: 100%; height: 350px; display: none; background: #000; border: 4px solid #10b981; object-fit: cover; transform: scaleX(-1); }
        #doc-preview-cam { border-radius: 1.5rem; width: 100% !important; height: 500px !important; object-fit: cover; display: none; background: #000; border: 6px solid #1e293b; box-shadow: 0 15px 45px rgba(0,0,0,0.15); }
        .modal-base { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(12px); }
        .loader-hub { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.99); z-index: 200000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .bar-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.4s; }
        .thumb-wrap { position: relative; flex-shrink: 0; cursor: pointer; margin-top: 10px; }
        .thumb-img { width: 85px; height: 110px; border-radius: 1rem; object-fit: cover; border: 2.5px solid #10b981; }
        .del-page-btn { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid white; cursor: pointer; }
        #antreanDokumen { display: flex; gap: 15px; overflow-x: auto; padding: 15px 10px; min-height: 140px; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen italic font-black uppercase text-balance">

    <div class="loader-hub" id="loadingLayer">
        <i class="fas fa-rocket text-emerald-500 text-6xl animate-bounce"></i>
        <p class="text-white text-[10px] mt-8 tracking-[0.4em]">TURBO-SYNC BINER SYSTEM...</p>
        <div class="w-64 h-2 bg-slate-800 rounded-full mt-6 overflow-hidden"><div id="progressFill" class="bar-fill"></div></div>
    </div>

    <nav class="bg-white border-b border-slate-100 py-6 px-4 sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex items-center gap-5 text-left">
            <img src="./logo_malra.png" alt="Malra" class="h-12 w-auto">
            <div class="border-l-2 border-red-600 pl-4">
                <h1 class="text-xl text-slate-900 font-black">SiAPP MAS</h1>
                <h2 class="text-[10px] text-slate-700">INSPEKTORAT KABUPATEN MALUKU TENGGARA</h2>
            </div>
        </div>
    </nav>

    <main class="max-w-lg mx-auto px-5 py-8 text-center">
        <form id="masterAduanForm" class="border-[4px] border-red-600 rounded-[4rem] p-1 bg-white mb-10 shadow-2xl">
            <div class="bg-white rounded-[3.7rem] p-6 space-y-10 shadow-inner font-black">
                <!-- SCAN WAJAH -->
                <div class="border-hijau-kab">
                    <span class="text-[9px] text-emerald-600 mb-6 block uppercase font-black">SCAN WAJAH AI</span>
                    <video id="video-preview" autoplay playsinline></video>
                    <canvas id="face-canvas" class="hidden"></canvas>
                    <img id="face-result" class="mx-auto rounded-[2.2rem] hidden border-4 border-emerald-500 w-48 h-48 object-cover">
                    <button type="button" id="start-camera" class="w-full bg-sky-500 text-white py-5 rounded-2xl text-[9px] mt-4">AKTIFKAN KAMERA</button>
                    <button type="button" id="take-photo" class="w-full bg-red-600 text-white py-5 rounded-2xl hidden text-[9px] mt-4">KONFIRMASI WAJAH</button>
                </div>

                <!-- BIODATA -->
                <div class="space-y-6 text-left px-1">
                    <input type="text" id="n_pelapor" required placeholder="NAMA LENGKAP" class="border-hijau-kab p-5 text-xs">
                    <input type="number" id="wa_pelapor" required placeholder="WHATSAPP (628...)" class="border-hijau-kab p-5 text-xs">
                    
                    <select id="kat_audit" required class="border-hijau-kab">
                        <option value="">- Pilih Kategori -</option>
                        <option value="Dana Desa">Pengawasan Dana Desa</option>
                        <option value="Dana BOS">Dana BOS / PAUD / BOP</option>
                        <option value="BOK Puskesmas">Pengawasan BOK Puskesmas</option>
                        <option value="PBJ">Pengadaan barang/jasa</option>
                        <option value="Penyalahgunaan Jabatan/Wewenang">Penyalahgunaan Jabatan/Wewenang</option>
                        <option value="Dll">Lainnya</option>
                    </select>

                    <select id="kec_audit" required class="border-hijau-kab">
                        <option value="">- Pilih Kecamatan -</option>
                        <option value="Kei Kecil">Kei Kecil</option>
                        <option value="Manyeuw">Manyeuw</option>
                        <option value="Kei Kecil Timur">Kei Kecil Timur</option>
                        <option value="Kei Kecil Timur Selatan">Kei Kecil Timur Selatan</option>
                        <option value="Kei Kecil Barat">Kei Kecil Barat</option>
                        <option value="Hoat Sorbay">Hoat Sorbay</option>
                        <option value="Kei Besar">Kei Besar</option>
                        <option value="KEI BESAR SELATAN">KEI BESAR SELATAN</option>
                        <option value="KEI BESAR SELATAN BARAT">KEI BESAR SELATAN BARAT</option>
                        <option value="KEI BESAR UTARA BARAT">KEI BESAR UTARA BARAT</option>
                        <option value="KEI BESAR UTARA TIMUR">KEI BESAR UTARA TIMUR</option>
                    </select>
                    <input type="text" id="desa_audit" required placeholder="NAMA OHOI/KELURAHAN" class="border-hijau-kab p-5 text-xs">
                </div>

                <!-- DOKUMEN -->
                <div class="border-hijau-kab text-center" style="padding: 25px 8px;">
                    <span class="text-[10px] font-black uppercase mb-3 block">MESIN SCAN DOKUMEN / PDF</span>
                    <div id="antreanDokumen"></div>
                    <div id="boxKameraScanner" class="hidden mb-6 px-0">
                        <video id="doc-preview-cam" autoplay playsinline></video>
                        <button type="button" id="btnJepretLagi" class="w-full bg-red-600 text-white py-6 mt-6 rounded-3xl font-black text-sm uppercase shadow-2xl">JEPRET HALAMAN</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4 px-2">
                        <button type="button" id="start-doc-cam" class="bg-amber-400 text-amber-950 font-black py-4 rounded-xl text-[9px]"><i class="fas fa-print mr-2"></i> MESIN SCAN</button>
                        <label for="f_up_input" class="bg-emerald-600 text-white font-black py-4 rounded-xl text-[9px] flex items-center justify-center cursor-pointer"><i class="fas fa-file-pdf mr-2"></i> FILE/PDF</label>
                        <input type="file" id="f_up_input" accept="image/*, application/pdf" class="hidden">
                    </div>
                    <button type="button" id="btnSelesaiScan" class="hidden w-full mt-4 bg-slate-900 text-white py-4 rounded-xl font-black text-[9px]">KONFIRMASI SELESAI</button>
                </div>

                <button type="button" id="submitAllMain" class="w-full bg-red-600 text-white p-7 rounded-[3.5rem] opacity-30 font-black text-[11px]" disabled>LENGKAPI DATA</button>
            </div>
        </form>

        <button id="btnTrackerTrigger" class="w-full bg-white border-2 border-slate-900 p-5 rounded-[2.5rem] font-black text-[10px] mb-20 italic">CEK STATUS ADUAN ANDA <i class="fas fa-search-plus ml-2"></i></button>
    </main>

    <!-- SUCCESS MODAL -->
    <div id="resiDigital" class="modal-base">
        <div class="bg-white rounded-[3.5rem] p-10 max-w-sm w-full text-center border-t-8 border-emerald-500 shadow-2xl">
            <h3 class="font-black text-xs text-slate-800 italic">TERKIRIM !</h3>
            <div class="bg-slate-50 p-6 rounded-3xl my-6"><span id="txtResId" class="text-2xl text-emerald-800 font-black tracking-tighter"></span></div>
            <p class="text-red-700 text-[10px] font-black italic">CATAT ATAU SCREENSHOT ID INI UNTUK CEK STATUS PENGADUAN ANDA!</p>
            <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-5 rounded-[2.5rem] mt-5 text-[10px]">KEMBALI</button>
        </div>
    </div>

    <!-- TRACKER MODAL -->
    <div id="trackPanel" class="modal-base">
        <div class="bg-white rounded-[3.8rem] p-10 max-w-md w-full border-[10px] border-emerald-500 shadow-2xl">
            <input type="text" id="tiket-id-in" placeholder="ID TIKET ANDA" class="w-full bg-slate-100 p-5 rounded-2xl text-center text-lg font-black mb-5 outline-none uppercase italic shadow-inner">
            <button id="runCheckAudit" class="w-full bg-emerald-600 text-white py-5 rounded-3xl font-black text-[10px]">MULAI</button>
            <div id="box-result-track" class="hidden mt-5 text-[9px] text-left italic border-t pt-5">
                <div class="flex justify-between mb-2"><span>PROGRES:</span><span id="o_s" class="font-black"></span></div>
                <p id="o_n" class="bg-emerald-50 p-4 rounded-2xl mt-2"></p>
            </div>
            <p onclick="document.getElementById('trackPanel').style.display='none'" class="text-center mt-5 cursor-pointer font-bold text-[10px]">TUTUP</p>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
    const app = initializeApp(config); const db = getFirestore(app);

    const CLOUD_NAME = "dfqwrkoqm", UPLOAD_PRESET = "siappmas";
    let curStream, fcBlob, docBlobs=[], ready={w:false, d:false};

    async function uploadToCloudinary(inputBlob) {
        if(!inputBlob) return null;
        const formData = new FormData();
        formData.append("file", inputBlob);
        formData.append("upload_preset", UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, { method: "POST", body: formData });
        const data = await res.json();
        return data.secure_url;
    }

    async function toBlob(url){ const r=await fetch(url); return await r.blob(); }

    function vChk(){ 
        ready.d = (docBlobs.length > 0);
        const btn = document.getElementById('submitAllMain');
        if(ready.w && ready.d){ btn.disabled=false; btn.classList.remove('opacity-30'); btn.classList.add('bg-slate-900','animate-pulse'); btn.innerText="KIRIM PENGADUAN"; } 
        else { btn.disabled=true; btn.classList.add('opacity-30'); btn.innerText="LENGKAPI DATA"; }
    }

    document.getElementById('start-camera').onclick=async()=>{ curStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:720}}); const v=document.getElementById('video-preview'); v.srcObject=curStream; v.style.display="block"; document.getElementById('start-camera').style.display="none"; document.getElementById('take-photo').style.display="block"; };
    document.getElementById('take-photo').onclick=async()=>{ 
        const v=document.getElementById('video-preview'), c=document.getElementById('face-canvas');
        c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0);
        fcBlob = await toBlob(c.toDataURL('image/jpeg', 0.8));
        document.getElementById('face-result').src=URL.createObjectURL(fcBlob); 
        document.getElementById('face-result').classList.remove('hidden'); v.style.display="none"; document.getElementById('take-photo').style.display="none";
        ready.w=true; vChk(); curStream.getTracks().forEach(t=>t.stop());
    };

    document.getElementById('start-doc-cam').onclick=async()=>{ curStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:1280}}); document.getElementById('doc-preview-cam').srcObject=curStream; document.getElementById('doc-preview-cam').style.display="block"; document.getElementById('boxKameraScanner').classList.remove('hidden'); document.getElementById('btnSelesaiScan').classList.remove('hidden'); };
    document.getElementById('btnJepretLagi').onclick=async()=>{ 
        const v=document.getElementById('doc-preview-cam'), cd=document.createElement('canvas');
        cd.width=v.videoWidth; cd.height=v.videoHeight; cd.getContext('2d').drawImage(v,0,0);
        const b = await toBlob(cd.toDataURL('image/jpeg', 0.7));
        docBlobs.push(b); refresh();
    };
    function refresh(){
        const a=document.getElementById('antreanDokumen'); a.innerHTML="";
        docBlobs.forEach((b,i)=>{
            const w=document.createElement('div'); w.className='thumb-wrap';
            w.innerHTML=`<span class="del-page-btn" onclick="window.delP(${i})">×</span><img src="${URL.createObjectURL(b)}" class="thumb-img">`;
            a.appendChild(w);
        }); vChk();
    }
    window.delP=(i)=>{ docBlobs.splice(i,1); refresh(); };
    document.getElementById('btnSelesaiScan').onclick=()=>{ document.getElementById('boxKameraScanner').classList.add('hidden'); document.getElementById('btnSelesaiScan').classList.add('hidden'); curStream.getTracks().forEach(t=>t.stop()); };

    document.getElementById('f_up_input').onchange=async(e)=>{
        const f=e.target.files[0]; if(!f) return;
        if(f.type==="application/pdf") { docBlobs = [f]; refresh(); document.getElementById('antreanDokumen').innerHTML="<p class='p-5 text-[9px] text-emerald-600 font-black'>DOKUMEN PDF SIAP</p>"; vChk(); }
        else { docBlobs.push(f); refresh(); }
    };

    document.getElementById('submitAllMain').onclick=async()=>{
        const fill = document.getElementById('progressFill'); document.getElementById('loadingLayer').style.display='flex';
        const resID="MALRA-"+Math.random().toString(36).substring(7).toUpperCase();
        try {
            const fU = await uploadToCloudinary(fcBlob); fill.style.width='30%';
            let links = [];
            for(let i=0; i<docBlobs.length; i++){
                const u = await uploadToCloudinary(docBlobs[i]); links.push(u);
                fill.style.width = (30 + (i*70/docBlobs.length)) + '%';
            }
            await addDoc(collection(db,"pengaduan"),{ ticket_id:resID, pelapor_nama:document.getElementById('n_pelapor').value, wa:document.getElementById('wa_pelapor').value, face:fU, doc_archive:links.join("|"), kec:document.getElementById('kec_audit').value, vill:document.getElementById('desa_audit').value, kat:document.getElementById('kat_audit').value, status:"TERIMA", timestamp:serverTimestamp() });
            fill.style.width='100%'; document.getElementById('txtResId').innerText=resID; document.getElementById('resiDigital').style.display='flex';
        } catch(e){ alert("Gagal: " + e.message); document.getElementById('loadingLayer').style.display='none'; }
    };

    document.getElementById('btnTrackerTrigger').onclick=()=>{ document.getElementById('trackPanel').style.display='flex'; };
    document.getElementById('runCheckAudit').onclick=async()=>{
        const tid = document.getElementById('tiket-id-in').value.trim();
        const qS = await getDocs(query(collection(db,"pengaduan"), where("ticket_id","==",tid)));
        if(qS.empty) return alert("Tiket tidak ada!");
        const d = qS.docs[0].data();
        document.getElementById('o_s').innerText=d.status; document.getElementById('o_n').innerText=d.note || "Proses verifikasi berkas.";
        document.getElementById('box-result-track').classList.remove('hidden');
    };
</script>
</body>
</html>
