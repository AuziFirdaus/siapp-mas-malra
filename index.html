<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SiAPP Mas Malra | Versi Ultra Stable S.Kom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; color: #1e293b; overflow-x: hidden; margin: 0; }
        .border-hijau-kab { border: 2.8px solid #10b981 !important; border-radius: 2rem !important; background: #ffffff; padding: 20px; margin-bottom: 25px; display: block; width: 100%; }
        select.border-hijau-kab { color: #000; font-weight: 800; padding: 15px !important; font-size: 11px; }
        #video-preview { border-radius: 2rem; width: 100%; height: 350px; background: #000; border: 4px solid #10b981; object-fit: cover; display: none; transform: scaleX(-1); }
        .loader-hub { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 200000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .bar-container { width: 80%; height: 12px; bg-slate-800; border-radius: 20px; overflow: hidden; margin-top: 20px; border: 1px solid #334155; }
        .bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.3s; box-shadow: 0 0 15px #10b981; }
        .thumb-wrap { position: relative; margin: 10px; flex-shrink: 0; }
        .thumb-img { width: 75px; height: 100px; border-radius: 12px; object-fit: cover; border: 2px solid #10b981; }
        .del-page-btn { position: absolute; -top: 8px; -right: 8px; background: #ef4444; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; border: 2px solid #fff; }
        .modal-base { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="min-h-screen italic font-black uppercase">

    <!-- UPLOAD PROGRESS (SUPER AI POWERED) -->
    <div class="loader-hub" id="loadingLayer">
        <i class="fas fa-satellite-dish text-emerald-400 text-6xl animate-bounce"></i>
        <div class="mt-8 text-white">
            <p id="uploadStatusText" class="text-[11px] tracking-[0.3em]">MENGOPTIMALKAN BERKAS...</p>
            <p id="percentText" class="text-4xl font-black mt-2 text-emerald-400">0%</p>
        </div>
        <div class="bar-container">
            <div id="progressFill" class="bar-fill"></div>
        </div>
        <p class="text-[8px] text-slate-400 mt-6 tracking-widest px-10 leading-loose">Sinyal tidak stabil? Sistem akan otomatis menyesuaikan transmisi.</p>
    </div>

    <nav class="bg-white border-b-4 border-red-600 py-6 px-5 sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex items-center gap-4">
            <img src="./logo_malra.png" alt="Logo" class="h-10">
            <div class="border-l-2 border-slate-300 pl-4 uppercase leading-none">
                <h1 class="text-lg font-black text-slate-900 tracking-tighter">SiAPP MAS</h1>
                <p class="text-[9px] text-slate-500 font-bold">Maluku Tenggara Safe-Link v2.0</p>
            </div>
        </div>
    </nav>

    <main class="max-w-lg mx-auto px-5 py-8">
        <div class="mb-8 text-center">
            <h2 class="text-red-600 text-sm font-black italic">PENGADUAN INSPEKTORAT MALRA</h2>
            <div class="h-1 w-20 bg-emerald-500 mx-auto mt-2"></div>
        </div>

        <form id="masterAduanForm" class="space-y-6">
            <!-- BIOMETRIK SECTION -->
            <div class="border-hijau-kab shadow-xl">
                <p class="text-[10px] text-emerald-600 mb-4 block font-black">Langkah 1: Validasi Biometrik</p>
                <video id="video-preview" autoplay playsinline></video>
                <img id="face-result" class="mx-auto rounded-[1.5rem] hidden border-4 border-emerald-500 w-44 h-44 object-cover">
                <button type="button" id="start-camera" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl text-[10px] mt-2 shadow-lg"><i class="fas fa-camera-retro mr-2"></i> Buka Kamera Wajah</button>
                <button type="button" id="take-photo" class="w-full bg-red-600 text-white font-black py-4 rounded-2xl hidden animate-pulse text-[10px] mt-2">AMBIL FOTO</button>
            </div>

            <!-- IDENTITAS SECTION -->
            <div class="bg-slate-50 rounded-[2.5rem] p-6 space-y-4">
                <div>
                    <label class="text-[9px] text-slate-500 px-3 font-bold uppercase tracking-widest">Nama Lengkap Sesuai KTP</label>
                    <input type="text" id="n_pelapor" required placeholder="..." class="w-full p-4 border-2 border-slate-200 rounded-2xl outline-none focus:border-emerald-500 font-black">
                </div>
                <div>
                    <label class="text-[9px] text-slate-500 px-3 font-bold uppercase tracking-widest">WhatsApp Aktif (Ohoijang/Langgur)</label>
                    <input type="number" id="wa_pelapor" required placeholder="08..." class="w-full p-4 border-2 border-slate-200 rounded-2xl outline-none focus:border-emerald-500 font-black">
                </div>
                <div>
                    <select id="kat_audit" required class="w-full p-4 border-2 border-emerald-400 bg-white rounded-2xl font-black text-[10px] uppercase">
                        <option value="">- Kategori Laporan -</option>
                        <option value="Dana Desa">Dana Desa / Ohoi</option>
                        <option value="ASN">ASN & Layanan Publik</option>
                        <option value="BOS">Pendidikan & Dana BOS</option>
                    </select>
                </div>
            </div>

            <!-- DOKUMEN SECTION -->
            <div class="border-hijau-kab bg-emerald-50 shadow-inner">
                <p class="text-[10px] text-slate-800 mb-4 font-black">Langkah 2: Lampiran Dokumen Bukti</p>
                <div id="boxScan" class="hidden mb-4 overflow-hidden rounded-2xl border-2 border-black">
                    <video id="doc-cam" class="w-full h-64 object-cover" autoplay playsinline></video>
                </div>
                <div id="antreanDokumen" class="flex overflow-x-auto min-h-[50px] mb-4 bg-white/50 rounded-xl"></div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnScanMode" class="bg-emerald-600 text-white p-4 rounded-xl text-[9px] font-black"><i class="fas fa-expand mr-2"></i> SCAN MANUAL</button>
                    <label class="bg-amber-500 text-amber-900 p-4 rounded-xl text-[9px] font-black flex items-center justify-center cursor-pointer"><i class="fas fa-file-upload mr-2"></i> PILIH PDF
                        <input type="file" id="f_up_input" accept="image/*,application/pdf" class="hidden">
                    </label>
                </div>
                <button type="button" id="btnSnap" class="hidden w-full bg-red-600 text-white p-4 rounded-xl text-[9px] font-black mt-2"><i class="fas fa-dot-circle mr-2"></i> JEPRET SEKARANG</button>
            </div>

            <button type="button" id="submitAllMain" class="w-full bg-slate-300 text-white p-6 rounded-[2.5rem] font-black text-xs shadow-2xl tracking-widest disabled:cursor-not-allowed uppercase" disabled>Lengkapi Data Dulu</button>
        </form>

        <p class="text-[8px] text-center text-slate-400 mt-10 tracking-[0.5em] font-black italic underline decoration-red-500">© FIRDAUS S.KOM (INSPEKTORAT MALRA 2026)</p>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const config = { apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc", authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com", projectId: "siapp-mas-malra-aa6c4", storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app", messagingSenderId: "18948056709", appId: "1:18948056709:web:6c5877826c206ac2e6ebec" };
    const app = initializeApp(config); const db = getFirestore(app);

    const CLOUD_NAME = "dfqwrkoqm", UPLOAD_PRESET = "siappmas";
    let curStream, fcBlob, docFiles = [], isCameraReady = false;

    const sSubmit = document.getElementById('submitAllMain'), hubLoad = document.getElementById('loadingLayer');
    const pFill = document.getElementById('progressFill'), pText = document.getElementById('percentText');

    // CANGGIH: Compressor Ultra (Penyelamat file 10MB)
    async function smartCompress(fileOrDataUrl, quality = 0.7) {
        return new Promise(r => {
            const img = new Image();
            img.src = fileOrDataUrl instanceof File ? URL.createObjectURL(fileOrDataUrl) : fileOrDataUrl;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                const maxDim = 1200; // Cukup besar untuk dibaca, cukup kecil untuk kirim cepat
                if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
                else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                canvas.toBlob(blob => r(blob), 'image/jpeg', quality);
            };
        });
    }

    // MEGA POWER: Upload dengan Progres Persentase (AJAX-XHR)
    function powerUploadCloudinary(blob, onProgress) {
        return new Promise((resolve, reject) => {
            const formData = new FormData();
            formData.append("file", blob);
            formData.append("upload_preset", UPLOAD_PRESET);

            const xhr = new XMLHttpRequest();
            xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    onProgress(percent);
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) resolve(JSON.parse(xhr.responseText).secure_url);
                else reject("Gagal");
            };
            xhr.onerror = () => reject("Jaringan Terputus");
            xhr.send(formData);
        });
    }

    // SISTEM VALIDASI & INTERAKSI
    function val() {
        const ok = fcBlob && docFiles.length > 0 && document.getElementById('n_pelapor').value;
        sSubmit.disabled = !ok;
        if(ok) { sSubmit.className = "w-full bg-emerald-600 text-white p-6 rounded-[2.5rem] font-black text-xs shadow-2xl tracking-widest animate-pulse"; sSubmit.innerText="KIRIM LAPORAN SEKARANG"; }
    }

    // KAMERA BIOMETRIK
    document.getElementById('start-camera').onclick=async()=>{
        curStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
        document.getElementById('video-preview').srcObject = curStream;
        document.getElementById('video-preview').style.display = "block";
        document.getElementById('start-camera').classList.add('hidden');
        document.getElementById('take-photo').classList.remove('hidden');
    };

    document.getElementById('take-photo').onclick=async()=>{
        const v = document.getElementById('video-preview'), c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        fcBlob = await smartCompress(c.toDataURL('image/jpeg'), 0.5); // Press keras untuk wajah
        document.getElementById('face-result').src = URL.createObjectURL(fcBlob);
        document.getElementById('face-result').classList.remove('hidden');
        v.style.display="none"; document.getElementById('take-photo').style.display="none";
        curStream.getTracks().forEach(t=>t.stop()); val();
    };

    // KAMERA SCANNER DOKUMEN
    document.getElementById('btnScanMode').onclick=async()=>{
        document.getElementById('boxScan').classList.toggle('hidden');
        document.getElementById('btnSnap').classList.toggle('hidden');
        if(!isCameraReady){
            const str = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
            document.getElementById('doc-cam').srcObject = str;
            isCameraReady = true;
        }
    };

    document.getElementById('btnSnap').onclick=async()=>{
        const dc = document.getElementById('doc-cam'), canv = document.createElement('canvas');
        canv.width = dc.videoWidth; canv.height = dc.videoHeight;
        canv.getContext('2d').drawImage(dc, 0, 0);
        const res = await smartCompress(canv.toDataURL('image/jpeg'), 0.7); // Press stabil bukti fisik
        docFiles.push(res); 
        renderList();
    };

    // HANDLE PDF/FILES
    document.getElementById('f_up_input').onchange = async(e) => {
        const file = e.target.files[0];
        if(!file) return;
        if(file.size > 15*1024*1024) return alert("Peringatan S.Kom: File terlalu raksasa (>15MB). Sistem mungkin macet.");
        
        if(file.type === "application/pdf") {
            docFiles.push(file); // PDF langsung kirim (tidak di-compress client)
            renderList();
        } else {
            const comp = await smartCompress(file, 0.7);
            docFiles.push(comp);
            renderList();
        }
    };

    function renderList() {
        const container = document.getElementById('antreanDokumen');
        container.innerHTML = "";
        docFiles.forEach((f, i) => {
            const wrap = document.createElement('div');
            wrap.className = "thumb-wrap";
            const icon = f.type === "application/pdf" ? "fas fa-file-pdf text-red-500 text-3xl p-5" : "";
            wrap.innerHTML = `<span class="del-page-btn" onclick="removeFile(${i})">X</span>` + 
                             (icon ? `<i class="${icon}"></i>` : `<img src="${URL.createObjectURL(f)}" class="thumb-img">`);
            container.appendChild(wrap);
        });
        val();
    }
    window.removeFile = (i) => { docFiles.splice(i,1); renderList(); };

    // PROSES FINAL (BATTLE PROVEN FOR 10MB+)
    sSubmit.onclick = async() => {
        hubLoad.style.display = 'flex';
        const totalItems = 1 + docFiles.length; // 1 Wajah + N Berkas
        let results = [];
        const tiket = "RES-"+Math.random().toString(36).substr(2,9).toUpperCase();

        try {
            // 1. Upload Wajah
            document.getElementById('uploadStatusText').innerText = "MENAUTKAN DATA BIOMETRIK...";
            const faceUrl = await powerUploadCloudinary(fcBlob, (p) => {
                pText.innerText = Math.round(p / totalItems) + "%";
                pFill.style.width = Math.round(p / totalItems) + "%";
            });

            // 2. Upload Berkas
            for(let i=0; i<docFiles.length; i++) {
                document.getElementById('uploadStatusText').innerText = `MENGIRIM BERKAS ${i+1}/${docFiles.length}...`;
                const dUrl = await powerUploadCloudinary(docFiles[i], (p) => {
                    let totalProg = ((i+1) * 100 / totalItems) + (p / totalItems);
                    pText.innerText = Math.round(totalProg) + "%";
                    pFill.style.width = Math.round(totalProg) + "%";
                });
                results.push(dUrl);
            }

            // 3. Simpan Ke Firebase
            await addDoc(collection(db, "pengaduan"), {
                ticket_id: tiket,
                pelapor: document.getElementById('n_pelapor').value,
                wa: document.getElementById('wa_pelapor').value,
                kat: document.getElementById('kat_audit').value,
                face: faceUrl,
                docs: results.join("|"),
                status: "MENUNGGU",
                timestamp: serverTimestamp()
            });

            hubLoad.innerHTML = `<div class='bg-white p-10 rounded-[3rem] text-center text-emerald-900 border-8 border-emerald-500 shadow-2xl'>
                                <i class="fas fa-check-circle text-6xl mb-4 text-emerald-600"></i>
                                <h2 class='font-black text-2xl uppercase tracking-tighter'>BERHASIL TERKIRIM</h2>
                                <p class='text-[10px] mt-4'>ID TIKET ANDA (HARAP CATAT/SS):</p>
                                <div class='text-2xl font-black bg-slate-100 p-4 rounded-2xl my-2 border-2 border-dashed border-emerald-400'>${tiket}</div>
                                <button onclick='location.reload()' class='w-full bg-slate-900 text-white p-5 rounded-2xl mt-4 font-black text-[10px] uppercase'>TUTUP APLIKASI</button>
                                </div>`;

        } catch (e) {
            alert("S.Kom ALERT: Jaringan Anda terputus ditengah jalan. Klik kirim kembali.");
            hubLoad.style.display = 'none';
        }
    }
</script>
</body>
</html>
