<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiAPP Mas | Malra Modern Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* TEMA CERAH BERSIH (PATRIOTIK) */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfdfd; color: #1e293b; }
        .form-focus:focus { border-color: #ef4444; ring: 3px; ring-color: rgba(239, 68, 68, 0.1); outline: none; }
        
        /* PREVIEW KAMERA - COMPACT SIZE */
        #video-preview, #ktp-video-preview, #doc-preview-cam { transform: scaleX(-1); border-radius: 20px; width: 100%; max-width: 250px; margin: 0 auto; display: none; background: #f1f5f9; border: 4px solid #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        #ktp-video-preview, #doc-preview-cam { transform: scaleX(1); }
        
        .quality-badge { font-size: 8px; font-weight: 900; padding: 4px 12px; border-radius: 99px; text-transform: uppercase; }
        .status-fail { background: #ef4444; color: white; }
        .status-pass { background: #10b981; color: white; }
        .ribbon-merah { height: 8px; background: repeating-linear-gradient(45deg, #ef4444, #ef4444 20px, #ffffff 20px, #ffffff 40px); }
        
        /* STYLING BUTTON COLORS (PERINTAH KHUSUS BAPAK) */
        .btn-biometrik { background: #38bdf8 !important; color: white !important; } /* Biru Langit */
        .btn-kamera { background: #fbbf24 !important; color: black !important; }   /* Kuning */
        .input-file-hijau::-webkit-file-upload-button { background: #10b981 !important; color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 900; }
        
        /* PATRIO CARDS - COMPACT SIZE */
        .patriotic-card { background: white; border: 1px solid #f1f5f9; box-shadow: 0 15px 35px rgba(0,0,0,0.04); }
    </style>
</head>
<body class="min-h-screen italic font-black uppercase tracking-tight overflow-x-hidden text-balance">

    <div class="ribbon-merah"></div>

    <nav class="bg-white border-b border-slate-100 sticky top-0 z-50 py-4 shadow-sm px-4 backdrop-blur-xl">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="./logo_malra.png" alt="Logo Malra" class="h-14 w-auto drop-shadow-md">
                <div class="flex flex-col border-l border-red-500 pl-4 leading-tight">
                    <h1 class="text-xl font-black text-slate-800">SiAPP <span class="text-red-600">MAS</span></h1>
                    <h2 class="text-[9px] font-black text-slate-400 tracking-wider">INSPEKTORAT MALUKU TENGGARA</h2>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTAINER MAX-W-LG UNTUK KESAN "IMUT & STYLE" -->
    <main class="max-w-lg mx-auto px-4 py-8 no-print">
        
        <div class="bg-red-50 p-6 rounded-[2rem] mb-8 border border-red-100 flex items-start gap-4">
            <div class="bg-red-600 text-white p-3.5 rounded-xl shadow-lg animate-pulse"><i class="fas fa-shield-halved text-xl"></i></div>
            <div class="flex-1">
                <h2 class="text-sm font-black text-red-700 decoration-slate-800 underline">SISTEM APLIKASI PENGADUAN MASYARAKAT</h2>
                <p class="text-[10px] text-slate-500 mt-1 italic tracking-widest font-black uppercase opacity-60 underline decoration-red-200">PRIVACY SYSTEM ENCRYPTED</p>
                <p class="text-[9px] text-slate-400 font-sans tracking-tight mt-2 italic leading-relaxed uppercase">"Kerahasiaan Identitas Pelapor Dijamin 100% Oleh Negara."</p>
            </div>
        </div>

        <div class="patriotic-card rounded-[2.5rem] p-6 md:p-8 relative">
            <form id="complaintForm" class="space-y-6">
                
                <!-- 1. BIOMETRIK (SKY BLUE BUTTON) -->
                <div class="bg-slate-50 p-6 rounded-[1.8rem] border-2 border-dashed border-red-100 text-center">
                    <span class="text-[9px] text-red-500 mb-4 block font-black underline underline-offset-4 decoration-slate-300 uppercase tracking-widest">I. VALIDASI WAJAH AI (BIOMETRIK)</span>
                    <video id="video-preview" autoplay playsinline></video>
                    <canvas id="face-canvas" class="hidden"></canvas>
                    <img id="face-result" class="mx-auto rounded-[1.5rem] shadow-xl mb-4 hidden border-4 border-red-500" style="max-width: 180px;">
                    
                    <div id="qualityInfo" class="mb-4 flex justify-center gap-2 hidden font-sans italic">
                         <span id="badgeBright" class="quality-badge status-fail italic">Sensor Cahaya</span>
                         <span id="badgeSharp" class="quality-badge status-pass">Fokus Valid</span>
                    </div>

                    <button type="button" id="start-camera" class="w-full btn-biometrik py-4 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-sky-100 active:scale-95 transition-all">AKTIFKAN MODUL BIOMETRIK</button>
                    <button type="button" id="take-photo" class="w-full bg-red-600 text-white py-4 rounded-2xl text-[10px] font-black hidden animate-pulse underline decoration-white uppercase tracking-widest">CAPTURE IDENTITAS WAJAH</button>
                </div>

                <!-- IDENTITAS -->
                <div class="space-y-4">
                    <div>
                        <label class="text-[8px] text-slate-400 px-1 font-black uppercase underline decoration-red-500">Nama Pelapor (KTP)</label>
                        <input type="text" id="nama_ktp" required placeholder="INPUT NAMA LENGKAP..." class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-4 text-red-700 font-black italic text-xs form-focus shadow-inner">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 italic">
                        <input type="number" id="no_hp" required placeholder="WHATSAPP 08..." class="bg-slate-50 border border-slate-100 rounded-2xl p-4 text-xs font-black shadow-inner outline-none">
                        <select id="kategori" class="bg-slate-50 border border-slate-100 rounded-2xl p-4 text-[9px] font-black underline decoration-red-100">
                            <option value="Korupsi">🚫 TIPIKOR (Dugaan)</option>
                            <option value="Pungli">💸 PUNGLI</option>
                            <option value="Layanan Publik">🏢 LAYANAN BURUK</option>
                        </select>
                    </div>
                </div>

                <!-- 3. KTP SECTION (HIJAU + KUNING BUTTON) -->
                <div class="bg-red-50/50 p-6 rounded-[2rem] border border-red-100 text-center italic uppercase font-black shadow-sm">
                    <label class="block text-[8px] text-red-600 mb-5 tracking-widest decoration-red-200 underline italic underline-offset-4">II. VALIDASI KTP PELAPOR</label>
                    
                    <div id="ktp-cam-box" class="mb-4 hidden">
                        <video id="ktp-video-preview" autoplay playsinline class="mx-auto rounded-xl shadow-lg border-2 border-white mb-2"></video>
                        <button type="button" id="take-ktp-photo" class="bg-emerald-600 text-white p-3 rounded-xl text-[9px] font-black underline">OK : CAPTURE KTP</button>
                    </div>
                    
                    <img id="ktpPreview" class="rounded-2xl w-full hidden border-2 border-white shadow-md mb-4">

                    <div class="flex flex-col gap-3">
                        <input type="file" id="ktp_file" accept="image/*" class="w-full text-[9px] text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:bg-emerald-600 file:text-white file:font-black shadow-sm">
                        
                        <button type="button" id="start-ktp-camera" class="w-full btn-kamera py-4 rounded-xl text-[10px] font-black flex items-center justify-center gap-3 transition-all hover:scale-[1.01] active:scale-95 shadow-md">
                             <i class="fas fa-camera text-sm"></i> KAMERA KTP
                        </button>
                    </div>
                    <p id="ktpQuality" class="quality-badge status-fail hidden mt-4 italic font-black uppercase">DATA KTP KURANG TERANG!</p>
                </div>

                <!-- LOKASI -->
                <div class="grid grid-cols-2 gap-3 italic">
                    <select id="kecamatan" required class="bg-slate-50 border border-slate-100 rounded-2xl p-4 text-[8px] font-black text-slate-800">
                        <option value="">- KECAMATAN -</option>
                        <option value="Kei Kecil">Kei Kecil</option><option value="Manyeuw">Manyeuw</option><option value="Kei Kecil Timur">Kei Kecil Timur</option>
                        <option value="Kei Kecil Timur Selatan">Kei Kecil Timur Selatan</option><option value="Kei Kecil Barat">Kei Kecil Barat</option>
                        <option value="Hoat Sorbay">Hoat Sorbay</option><option value="Kei Besar">Kei Besar</option>
                        <option value="KEI BESAR SELATAN">KEI BESAR SELATAN</option><option value="KEI BESAR SELATAN BARAT">KEI BESAR SELATAN BARAT</option>
                        <option value="KEI BESAR UTARA BARAT">KEI BESAR UTARA BARAT</option><option value="KEI BESAR UTARA TIMUR">KEI BESAR UTARA TIMUR</option>
                    </select>
                    <input type="text" id="desa" required placeholder="DESA/OHOI" class="bg-slate-50 border border-slate-100 rounded-2xl p-4 text-[9px] font-black uppercase italic shadow-inner">
                </div>

                <!-- KOMUNIKASI (DIPERTAHANKAN) -->
                <div class="bg-red-50 p-5 rounded-[1.5rem] italic underline decoration-red-100">
                    <label class="block text-red-600 mb-3 font-black uppercase text-[8px] tracking-widest px-1">INISIASI KOMUNIKASI CHAT</label>
                    <input type="text" id="chat_init" required placeholder="TULIS PESAN CHAT UNTUK AUDITOR..." class="w-full bg-white border border-red-100 p-4 rounded-xl text-slate-900 font-black italic uppercase text-[10px] outline-none shadow-md">
                </div>

                <textarea id="deskripsi" rows="4" required placeholder="NARASI DETAIL ADUAN PENYALAHGUNAAN..." class="w-full bg-slate-50 border border-red-100 rounded-3xl p-6 text-[12px] text-slate-700 italic font-black uppercase text-justify shadow-inner leading-relaxed"></textarea>

                <!-- LAPORAN TERTULIS (HIJAU + KUNING BUTTON) -->
                <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 italic font-black shadow-inner">
                    <label class="block text-[10px] mb-4 uppercase text-slate-950 font-black italic tracking-widest decoration-slate-200 underline">KIRIM LAPORAN PENGADUAN TERTULIS</label>
                    <div class="flex flex-col gap-3">
                        <input type="file" id="bukti" accept="image/*, application/pdf" class="w-full text-[9px] text-slate-400 file:bg-emerald-600 file:text-white file:rounded-xl file:px-4 file:py-3 italic shadow-sm">
                        <button type="button" id="start-doc-camera" class="w-full btn-kamera py-4 rounded-xl flex items-center justify-center gap-2 font-black transition-all active:scale-95 text-[9px]">
                             <i class="fas fa-camera px-1"></i> SCAN FISIK SURAT 
                        </button>
                    </div>
                    <div id="camDocBox" class="mt-6 hidden">
                        <video id="doc-preview-cam" autoplay playsinline class="mx-auto rounded-lg mb-2 shadow-lg border border-white"></video>
                        <button type="button" id="take-doc-photo" class="bg-red-600 text-white w-full py-3 rounded-xl text-[9px] font-black underline animate-pulse">OK : AMBIL FOTO SURAT</button>
                    </div>
                    <img id="doc-result" class="mt-4 rounded-xl w-full hidden border border-emerald-300 shadow-md">
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-red-600 text-white p-7 rounded-[2rem] font-black italic tracking-[0.2em] shadow-xl opacity-40 cursor-not-allowed transition-all text-[10px] uppercase shadow-red-100 no-underline" disabled>
                    VALIDASI AI : HARAP SCAN WAJAH & KTP!
                </button>
            </form>
        </div>
        
        <p class="text-center text-[8px] mt-16 font-black italic opacity-20 tracking-[0.4em] underline uppercase font-sans">DESIGNED BY: FIRDAUS SETITIT, S.KOM @ 2026</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const config = {
            apiKey: "AIzaSyA3hAV-t9EYHBXpiUW9crY1q-tgM48wdRc",
            authDomain: "siapp-mas-malra-aa6c4.firebaseapp.com",
            projectId: "siapp-mas-malra-aa6c4",
            storageBucket: "siapp-mas-malra-aa6c4.firebasestorage.app",
            messagingSenderId: "18948056709",
            appId: "1:18948056709:web:6c5877826c206ac2e6ebec"
        };
        const app = initializeApp(config); const db = getFirestore(app);

        // -- UTUH: LOGIKA SENSOR & KAMERA (AS PER COMMAND) --
        const v = document.getElementById('video-preview'); const cv = document.getElementById('face-canvas');
        const fR = document.getElementById('face-result'); const sub = document.getElementById('btnSubmit');
        const bB = document.getElementById('badgeBright'); let fBase = null; let kBase = null; let docBase = null;
        let qStatus = { face: false, ktp: false };

        function updateLock() {
            if (qStatus.face && qStatus.ktp) {
                sub.disabled = false; sub.classList.remove('opacity-40', 'cursor-not-allowed');
                sub.innerText = "SENSOR SAH : KIRIM ADUAN SEKARANG";
                sub.classList.add('bg-slate-900', 'animate-pulse');
            } else {
                sub.disabled = true; sub.classList.add('opacity-40', 'cursor-not-allowed');
                sub.innerText = "PENOLAKAN SENSOR : FOTO HARAP JELAS!";
            }
        }

        function sensorAI(canvas, mode) {
            const ctx = canvas.getContext('2d'); const d = ctx.getImageData(0,0,canvas.width,canvas.height).data;
            let L = 0; for(let i=0; i<d.length; i+=4) L += (d[i]+d[i+1]+d[i+2])/3;
            L = L/(d.length/4); const OK = L > 61;
            if(mode==='W'){
                document.getElementById('qualityInfo').classList.remove('hidden');
                bB.className=OK?"quality-badge status-pass italic":"quality-badge status-fail italic";
                bB.innerText=OK?"PIXEL VALID":"GELAP!"; qStatus.face=OK;
            } else {
                const ks=document.getElementById('ktpQuality'); ks.classList.remove('hidden');
                ks.className=OK?"quality-badge status-pass italic":"quality-badge status-fail italic";
                ks.innerText=OK?"KTP LOLOS SENSOR":"IDENTITAS TIDAK JELAS!"; qStatus.ktp=OK;
            } updateLock();
        }

        document.getElementById('start-camera').onclick = async () => {
            const st = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}});
            v.srcObject=st; v.style.display="block"; document.getElementById('start-camera').style.display="none";
            document.getElementById('take-photo').style.display="block";
        };
        document.getElementById('take-photo').onclick = () => {
            cv.width=v.videoWidth; cv.height=v.videoHeight; cv.getContext('2d').drawImage(v,0,0);
            fBase=cv.toDataURL('image/jpeg'); sensorAI(cv,'W');
            if(qStatus.face){ fR.src=fBase; fR.classList.remove('hidden'); v.style.display="none"; }
            else{ alert("AUDIT WARNING: Ruangan terlalu gelap!"); }
        };

        const ktpV = document.getElementById('ktp-video-preview');
        document.getElementById('start-ktp-camera').onclick = async () => {
            const stK = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
            ktpV.srcObject = stK; ktpV.style.display="block"; document.getElementById('ktp-cam-box').classList.remove('hidden');
        };
        document.getElementById('take-ktp-photo').onclick = () => {
            const cx=document.createElement('canvas'); cx.width=ktpV.videoWidth; cx.height=ktpV.videoHeight;
            cx.getContext('2d').drawImage(ktpV,0,0); kBase=cx.toDataURL('image/jpeg');
            sensorAI(cx,'K');
            if(qStatus.ktp){
                document.getElementById('ktpPreview').src=kBase; document.getElementById('ktpPreview').classList.remove('hidden');
                document.getElementById('ktp-cam-box').classList.add('hidden'); ktpV.srcObject.getTracks().forEach(t=>t.stop());
            } else { alert("DITOLAK AI : Hasil foto gelap/kabur!"); }
        };

        const vdDoc = document.getElementById('doc-preview-cam');
        document.getElementById('start-doc-camera').onclick = async () => {
            const sd=await navigator.mediaDevices.getUserMedia({video:{facingMode: "environment"}});
            vdDoc.srcObject=sd; vdDoc.style.display="block"; document.getElementById('camDocBox').classList.remove('hidden');
        };
        document.getElementById('take-doc-photo').onclick = () => {
            const cd=document.createElement('canvas'); cd.width=vdDoc.videoWidth; cd.height=vdDoc.videoHeight;
            cd.getContext('2d').drawImage(vdDoc,0,0); docBase=cd.toDataURL('image/jpeg');
            document.getElementById('doc-result').src=docBase; document.getElementById('doc-result').classList.remove('hidden');
            document.getElementById('camDocBox').classList.add('hidden'); vdDoc.srcObject.getTracks().forEach(t=>t.stop());
        };

        // --- SUBMIT + WHATSAPP ENGINE UTUH (PERINTAH BAPAK) ---
        document.getElementById('complaintForm').onsubmit = async (ev) => {
            ev.preventDefault(); const procB = document.getElementById('btnSubmit');
            const targetP = document.getElementById('no_hp').value;
            const tiketVal = "MLRA-ID-" + Math.floor(1000+Math.random()*8999).toString();
            procB.disabled=true; procB.innerText="AUDIT SECURE SYNC...";
            try {
                await addDoc(collection(db, "pengaduan"), {
                    ticket_id: tiketVal, pelapor_identitas: document.getElementById('nama_ktp').value,
                    foto_biometrik: fBase, foto_ktp_legal: kBase, doc_fisik: docBase, 
                    kontak: targetP, kec: document.getElementById('kecamatan').value, ohoi: document.getElementById('desa').value,
                    init_chat: document.getElementById('chat_init').value, uraian_lengkap: document.getElementById('deskripsi').value,
                    status_server: "CLEAN_Patriot", audit_status: "DILIHAT", timestamp: serverTimestamp()
                });
                const msg = `NOTIFIKASI RESMI SiAPP MAS\n\nNo TICKET ID : ${tiketVal}\n\nPENGADUAN ANDA ADALAH SUARA RAKYAT UNTUK MALUKU TENGGARA YANG LEBIH BAIK DAN SEJAHTERA.\n\nPanduan Pelapor:\nSilakan masukan nomor TICKET ID ini pada kolom FITUR KOMUNIKASI DUA ARAH (CHAT) untuk berkomunikasi interaktif dengan Admin Inspektorat.`;
                alert(`LAPORAN TERSIMPAN!\nNo ID: ${tiketVal}\n\nKlik OK untuk terima salinan WhatsApp.`);
                window.location.href=`https://api.whatsapp.com/send?phone=${targetP}&text=${encodeURIComponent(msg)}`;
            } catch(e) { alert("RE-TRY"); procB.disabled=false; }
        };
    </script>
</body>
</html>
